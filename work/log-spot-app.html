<title>LoG 斑点测量台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: two-column instrument — controls left, canvas + detail right */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --surface-2: #eceee8;
  --fg: #1d2320;
  --fg-dim: #5d6760;
  --line: #d3d8d0;
  --accent: #176b5b;
  --accent-soft: #dcece7;
  --bright: #c2571f;
  --dark: #2b5aa6;
  --warn: #a33a2c;
  --shadow: 0 1px 3px rgba(20, 30, 25, 0.08), 0 4px 14px rgba(20, 30, 25, 0.06);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816;
    --surface: #1c221f;
    --surface-2: #242b27;
    --fg: #e3e8e3;
    --fg-dim: #94a098;
    --line: #343d38;
    --accent: #4fb39d;
    --accent-soft: #1e3a34;
    --bright: #e8844a;
    --dark: #7aa4e8;
    --warn: #e07a6c;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816;
  --surface: #1c221f;
  --surface-2: #242b27;
  --fg: #e3e8e3;
  --fg-dim: #94a098;
  --line: #343d38;
  --accent: #4fb39d;
  --accent-soft: #1e3a34;
  --bright: #e8844a;
  --dark: #7aa4e8;
  --warn: #e07a6c;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { font-weight: 600; text-wrap: balance; }
h1 { font-size: 18px; margin: 0; letter-spacing: 0.01em; }
h2 { font-size: 13px; margin: 0 0 10px; color: var(--fg-dim);
  text-transform: uppercase; letter-spacing: 0.08em; }
h3 { font-size: 13px; margin: 0 0 6px; }
code, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding-block: 16px 14px;
  border-bottom: 1px solid var(--line);
}
.app-header .sub { color: var(--fg-dim); font-size: 12.5px; margin-top: 2px; }
.header-actions { display: flex; gap: 8px; align-items: center; }

.layout {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 18px;
  padding-top: 18px;
  align-items: start;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.panel + .panel { margin-top: 14px; }

.control-group { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--fg-dim); display: flex;
  justify-content: space-between; gap: 8px; }
.field label .val { color: var(--fg); font-family: var(--mono); }
input[type="number"], input[type="text"], select {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--fg);
  padding: 7px 9px;
  font-family: var(--mono);
  font-size: 13px;
}
input:focus, select:focus, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

button {
  font-family: var(--sans);
  font-size: 13.5px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  padding: 8px 14px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary {
  background: var(--accent); border-color: var(--accent);
  color: #fff; font-weight: 600;
}
button.primary:disabled { opacity: 0.45; cursor: default; }
button.ghost { background: transparent; }
button.small { padding: 4px 9px; font-size: 12px; border-radius: 6px; }

.file-row { display: grid; gap: 6px; }
.file-pick {
  display: flex; align-items: center; gap: 8px;
  border: 1px dashed var(--line); border-radius: 8px;
  padding: 9px 10px; background: var(--surface-2);
}
.file-pick input { min-width: 0; flex: 1; }
.file-name {
  font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.status-line { font-size: 12px; color: var(--fg-dim); min-height: 18px; }
.status-line.err { color: var(--warn); }

.viewer-col { display: grid; gap: 14px; min-width: 0; }
.viewer-toolbar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); }
.seg button.active { background: var(--accent); color: #fff; }
.canvas-wrap {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  overflow: auto;
}
canvas#view {
  display: block;
  max-width: 100%;
  image-rendering: pixelated;
  margin: 0 auto;
  cursor: crosshair;
}
.legend { display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 12px; color: var(--fg-dim); }
.legend .sw { display: inline-block; width: 11px; height: 11px;
  border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.table-wrap { overflow-x: auto; max-height: 280px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line);
  white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface);
  color: var(--fg-dim); font-weight: 600; font-size: 11.5px;
  text-transform: uppercase; letter-spacing: 0.04em; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr.selected { background: var(--accent-soft); outline: 1px solid var(--accent); }
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
}
.pill.bright { background: color-mix(in srgb, var(--bright) 16%, transparent);
  color: var(--bright); }
.pill.dark { background: color-mix(in srgb, var(--dark) 16%, transparent);
  color: var(--dark); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.no { background: color-mix(in srgb, var(--warn) 15%, transparent);
  color: var(--warn); }

.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; }
.stat {
  background: var(--surface-2); border-radius: 8px; padding: 9px 11px;
  min-width: 0;
}
.stat .k { font-size: 11px; color: var(--fg-dim);
  text-transform: uppercase; letter-spacing: 0.05em; }
.stat .v { font-family: var(--mono); font-size: 14px; margin-top: 2px;
  overflow-wrap: anywhere; }
.scale-bars { display: grid; gap: 8px; }
.scale-row {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) 78px;
  gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px;
}
.bar { height: 8px; border-radius: 4px; background: var(--surface-2);
  position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 4px;
  background: var(--accent); display: block; }
.bar.peak > i { background: var(--bright); }
.bar.peak.darkkind > i { background: var(--dark); }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: var(--fg); color: var(--bg);
  padding: 9px 16px; border-radius: 8px; font-size: 13px;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none;
  transition: opacity 0.2s; z-index: 50; max-width: calc(100% - 40px);
}
.toast.show { opacity: 0.96; }
.hint { font-size: 11.5px; color: var(--fg-dim); }
.hidden { display: none !important; }
.count-chip { font-family: var(--mono); font-size: 12px; color: var(--fg-dim); }
</style>

<header class="app-header">
  <div>
    <h1>LoG 斑点测量台</h1>
    <div class="sub">尺度归一化高斯拉普拉斯 · 物理间距各向异性 · 三维亚像素细化</div>
  </div>
  <div class="header-actions">
    <button class="ghost small" id="themeToggle" type="button">切换主题</button>
    <button class="small" id="loadSampleBtn" type="button">载入内置样例</button>
  </div>
</header>

<div class="layout">
  <!-- ============ 控制栏 ============ -->
  <div>
    <section class="panel">
      <h2>数据导入</h2>
      <div class="control-group">
        <div class="file-row">
          <label class="field-label hint" for="imgFile">灰度图 · 小端 float32 逐行（单边 ≤ 384 px）</label>
          <div class="file-pick">
            <input type="file" id="imgFile" accept=".f32,.raw,application/octet-stream">
          </div>
          <span class="file-name" id="imgFileName">未选择</span>
        </div>
        <div class="file-row">
          <label class="field-label hint" for="maskFile">有效掩膜 · uint8 逐行（可选，非零为有效）</label>
          <div class="file-pick">
            <input type="file" id="maskFile" accept=".u8,.raw,application/octet-stream">
          </div>
          <span class="file-name" id="maskFileName">未选择（默认全图有效）</span>
        </div>
        <div class="row2">
          <div class="field">
            <label for="inW">宽 w（像素）</label>
            <input type="number" id="inW" min="1" max="384" step="1" placeholder="129">
          </div>
          <div class="field">
            <label for="inH">高 h（像素）</label>
            <input type="number" id="inH" min="1" max="384" step="1" placeholder="97">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="inDx">水平间距 dx</label>
            <input type="number" id="inDx" min="0" step="0.001" placeholder="0.6">
          </div>
          <div class="field">
            <label for="inDy">垂直间距 dy</label>
            <input type="number" id="inDy" min="0" step="0.001" placeholder="1.1">
          </div>
        </div>
        <div class="field">
          <label class="field-label hint" for="jsonFile">参数侧车（可选，与 image.json 同构的 w/h/dx/dy/sigma0/ratio/levels/threshold）</label>
          <div class="file-pick">
            <input type="file" id="jsonFile" accept=".json,application/json">
          </div>
          <span class="file-name" id="jsonFileName">未选择</span>
        </div>
        <div class="field">
          <label class="hint" style="color:var(--fg-dim)">间距单位任意但需一致；物理原点在左上像素中心，x 沿列、y 沿行。</label>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>尺度与阈值</h2>
      <div class="control-group">
        <div class="field">
          <label for="inSigma0">起始尺度 σ₀ <span class="val" id="sigma0Val"></span></label>
          <input type="number" id="inSigma0" min="0.01" step="0.05">
        </div>
        <div class="field">
          <label for="inLevels">尺度数 L <span class="val" id="levelsVal"></span></label>
          <input type="range" id="inLevels" min="3" max="16" step="1">
        </div>
        <div class="field">
          <label for="inRatio">比例 ratio <span class="val" id="ratioVal"></span></label>
          <input type="number" id="inRatio" min="1.01" max="3" step="0.01">
        </div>
        <div class="field">
          <label for="inBrightThr">亮斑阈值（正响应）<span class="val" id="brightThrVal"></span></label>
          <input type="range" id="inBrightThr" min="0" max="2" step="0.005">
        </div>
        <div class="field">
          <label for="inDarkThr">暗斑阈值（负响应取反）<span class="val" id="darkThrVal"></span></label>
          <input type="range" id="inDarkThr" min="0" max="2" step="0.005">
        </div>
        <button class="primary" id="runBtn" type="button" disabled>运行检测</button>
        <div class="status-line" id="statusLine"></div>
      </div>
    </section>

    <section class="panel">
      <h2>输出</h2>
      <div class="control-group">
        <button id="exportBtn" type="button" disabled>导出 CSV</button>
        <button id="copyBtn" type="button" disabled>复制 CSV 到剪贴板</button>
        <span class="hint">CSV 含亮暗类型、像素与物理位置、尺度层与物理 σ、响应及细化状态，UTF-8 带 BOM。</span>
      </div>
    </section>
  </div>

  <!-- ============ 视图与结果 ============ -->
  <div class="viewer-col">
    <section class="panel">
      <div class="viewer-toolbar">
        <div class="seg" id="viewSeg">
          <button type="button" data-view="image" class="active">原图</button>
          <button type="button" data-view="response">响应图</button>
        </div>
        <div class="field" style="flex:1; min-width:200px;">
          <label for="levelSlider">查看尺度层 <span class="val" id="levelLabel"></span></label>
          <input type="range" id="levelSlider" min="0" max="1" step="1" disabled>
        </div>
        <label class="hint" style="display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="showSpots" checked> 斑点
        </label>
        <label class="hint" style="display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="showMask" checked> 有效区
        </label>
      </div>
      <div class="canvas-wrap" style="margin-top:12px;">
        <canvas id="view"></canvas>
      </div>
      <div class="legend" style="margin-top:10px;">
        <span><i class="sw" style="background:var(--bright)"></i>亮斑（正 LoG）</span>
        <span><i class="sw" style="background:var(--dark)"></i>暗斑（负 LoG）</span>
        <span><i class="sw" style="background:repeating-linear-gradient(45deg,#888 0 3px,transparent 3px 6px)"></i>掩膜外无效区</span>
        <span id="respLegend" class="hidden">响应配色：暖色正 / 冷色负 / 灰为无效</span>
      </div>
    </section>

    <section class="panel" id="resultPanel" hidden>
      <h2 style="display:flex; justify-content:space-between; align-items:center;">
        <span>检出斑点</span>
        <span class="count-chip" id="countChip"></span>
      </h2>
      <div class="table-wrap">
        <table id="spotTable">
          <thead>
            <tr>
              <th>#</th><th>类型</th><th>层 k</th><th>σ（物理）</th>
              <th>物理 x</th><th>物理 y</th><th>响应</th><th>细化</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="detailPanel" hidden>
      <h2>斑点详情</h2>
      <div class="detail-grid" id="detailStats"></div>
      <h3 style="margin-top:16px;">邻近尺度层响应（−1 / 当前 / +1）</h3>
      <div class="scale-bars" id="scaleBars"></div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/*
 * log-core.js — scale-normalized Laplacian-of-Gaussian blob detection.
 *
 * Implements the convention in 约定.txt:
 *  - physical origin at the top-left pixel centre; row-major float32 input
 *  - level k: sigma_k = sigma0 * ratio^k
 *  - per-axis Gaussian G sampled at physical spacing, normalised to sum 1,
 *    truncated at ceil(3*sigma/spacing)
 *  - second-order kernel D = (r^2/sigma^4 - 1/sigma^2) G, zero-DC corrected
 *  - response R = -sigma^2 * (D_y*G_x + G_y*D_x) I
 *  - a response is valid only where the whole rectangular kernel footprint
 *    lies inside the image and the validity mask
 *  - 3x3x3 maxima (separately on R for bright and -R for dark), centre and
 *    neighbours all valid, first/last levels only take part in comparison,
 *    ties resolved by the first (level, row, col)
 *  - 3D quadratic sub-pixel refinement; accepted only when the Hessian is
 *    negative definite and every |axis displacement| <= 1
 *
 * Runs in Node (module.exports) and in the browser (window.LogCore).
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {
    root.LogCore = factory();
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  function buildAxisKernel(sigma, spacing) {
    const radius = Math.ceil((3 * sigma) / spacing);
    const n = 2 * radius + 1;
    const g = new Float64Array(n);
    const d = new Float64Array(n);
    const s2 = sigma * sigma;
    const s4 = s2 * s2;
    let sumG = 0;
    for (let i = 0; i < n; i++) {
      const r = (i - radius) * spacing;
      const v = Math.exp(-(r * r) / (2 * s2));
      g[i] = v;
      sumG += v;
    }
    let sumD = 0;
    for (let i = 0; i < n; i++) {
      g[i] /= sumG;
      const r = (i - radius) * spacing;
      d[i] = (r * r / s4 - 1 / s2) * g[i];
      sumD += d[i];
    }
    for (let i = 0; i < n; i++) {
      d[i] -= sumD * g[i]; // zero DC
    }
    return { radius, g, d };
  }

  // Integral image of the mask (float64, (w+1)*(h+1)) for O(1) footprint tests.
  function buildIntegralMask(mask, w, h) {
    const W = w + 1;
    const intImg = new Float64Array(W * (h + 1));
    for (let r = 0; r < h; r++) {
      let rowSum = 0;
      const rowBase = r * w;
      const outBase = (r + 1) * W;
      for (let c = 0; c < w; c++) {
        rowSum += mask[rowBase + c] ? 1 : 0;
        intImg[outBase + c + 1] = intImg[r * W + c + 1] + rowSum;
      }
    }
    return intImg;
  }

  function footprintAllValid(intImg, w, h, r0, r1, c0, c1) {
    if (r0 < 0 || r1 >= h || c0 < 0 || c1 >= w) return false;
    const W = w + 1;
    const total = (r1 - r0 + 1) * (c1 - c0 + 1);
    const got =
      intImg[(r1 + 1) * W + (c1 + 1)] -
      intImg[r0 * W + (c1 + 1)] -
      intImg[(r1 + 1) * W + c0] +
      intImg[r0 * W + c0];
    return got === total;
  }

  // Separable convolution of img with vert kernel (y) then horz kernel (x);
  // output zero outside valid footprints.
  function convolveSeparable(img, w, h, vert, horz, intImg, tmp, out) {
    const rv = vert.radius;
    const rh = horz.radius;
    const kv = vert.kernel;
    const kh = horz.kernel;
    out.fill(0);
    // vertical pass (constant columns)
    for (let c = 0; c < w; c++) {
      for (let r = 0; r < h; r++) {
        if (r - rv < 0 || r + rv >= h) {
          tmp[r * w + c] = 0;
          continue;
        }
        let acc = 0;
        for (let i = 0; i < kv.length; i++) {
          acc += kv[i] * img[(r - rv + i) * w + c];
        }
        tmp[r * w + c] = acc;
      }
    }
    // horizontal pass with full-footprint validity
    for (let r = 0; r < h; r++) {
      const base = r * w;
      for (let c = 0; c < w; c++) {
        if (c - rh < 0 || c + rh >= w) continue;
        if (!footprintAllValid(intImg, w, h, r - rv, r + rv, c - rh, c + rh)) {
          continue;
        }
        let acc = 0;
        for (let j = 0; j < kh.length; j++) {
          acc += kh[j] * tmp[base + (c - rh + j)];
        }
        out[base + c] = acc;
      }
    }
  }

  function computeVolume(params) {
    const { width: w, height: h, dx, dy, sigma0, ratio, levels, image, mask } =
      params;
    const n = w * h;
    const intImg = buildIntegralMask(mask, w, h);
    const responses = new Array(levels);
    const valids = new Array(levels);
    const sigmas = new Float64Array(levels);
    const tmp = new Float64Array(n);
    const termA = new Float64Array(n);
    const termB = new Float64Array(n);

    for (let k = 0; k < levels; k++) {
      const sigma = sigma0 * Math.pow(ratio, k);
      sigmas[k] = sigma;
      const kx = buildAxisKernel(sigma, dx);
      const ky = buildAxisKernel(sigma, dy);
      // term A: D along y, G along x
      convolveSeparable(
        image, w, h,
        { radius: ky.radius, kernel: ky.d },
        { radius: kx.radius, kernel: kx.g },
        intImg, tmp, termA
      );
      // term B: G along y, D along x
      convolveSeparable(
        image, w, h,
        { radius: ky.radius, kernel: ky.g },
        { radius: kx.radius, kernel: kx.d },
        intImg, tmp, termB
      );
      const resp = new Float64Array(n);
      const valid = new Uint8Array(n);
      const negSigma2 = -sigma * sigma;
      for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
          const idx = r * w + c;
          const inside =
            r - ky.radius >= 0 && r + ky.radius < h &&
            c - kx.radius >= 0 && c + kx.radius < w &&
            footprintAllValid(
              intImg, w, h,
              r - ky.radius, r + ky.radius,
              c - kx.radius, c + kx.radius
            );
          if (inside) {
            resp[idx] = negSigma2 * (termA[idx] + termB[idx]);
            valid[idx] = 1;
          }
        }
      }
      responses[k] = resp;
      valids[k] = valid;
    }
    return { responses, valids, sigmas };
  }

  function isNegativeDefinite(H) {
    // LDL^T: D pivots must all be strictly negative
    const a = H.map((row) => row.slice());
    const n = 3;
    for (let j = 0; j < n; j++) {
      let pivot = a[j][j];
      for (let p = 0; p < j; p++) {
        pivot -= (a[j][p] * a[p][j]) / a[p][p];
      }
      if (!(pivot < 0)) return false;
      a[j][j] = pivot;
      for (let i = j + 1; i < n; i++) {
        let v = a[i][j];
        for (let p = 0; p < j; p++) {
          v -= (a[i][p] * a[p][j]) / a[p][p];
        }
        a[i][j] = v / pivot;
      }
    }
    return true;
  }

  // Solve H delta = -g via Gaussian elimination with partial pivoting.
  function solve3(H, g) {
    const A = [
      [H[0][0], H[0][1], H[0][2], -g[0]],
      [H[1][0], H[1][1], H[1][2], -g[1]],
      [H[2][0], H[2][1], H[2][2], -g[2]],
    ];
    for (let i = 0; i < 3; i++) {
      let piv = i;
      for (let q = i + 1; q < 3; q++) {
        if (Math.abs(A[q][i]) > Math.abs(A[piv][i])) piv = q;
      }
      if (Math.abs(A[piv][i]) < 1e-15) return null;
      if (piv !== i) {
        for (let t = 0; t < 4; t++) {
          const tmpV = A[i][t];
          A[i][t] = A[piv][t];
          A[piv][t] = tmpV;
        }
      }
      for (let q = i + 1; q < 3; q++) {
        const f = A[q][i] / A[i][i];
        for (let t = i; t < 4; t++) A[q][t] -= f * A[i][t];
      }
    }
    const x = [0, 0, 0];
    for (let i = 2; i >= 0; i--) {
      let s = A[i][3];
      for (let j = i + 1; j < 3; j++) s -= A[i][j] * x[j];
      x[i] = s / A[i][i];
    }
    return x;
  }

  function detectPeaks(params, volume) {
    const { width: w, height: h, levels, dx, dy, sigma0, ratio,
      brightThreshold, darkThreshold } = params;
    const { responses, valids, sigmas } = volume;
    const peaks = [];

    const sample = (k, r, c) => {
      if (r < 0 || r >= h || c < 0 || c >= w) return null;
      if (!valids[k][r * w + c]) return null;
      return responses[k][r * w + c];
    };

    for (let k = 1; k < levels - 1; k++) {
      const resp = responses[k];
      const valid = valids[k];
      for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
          const idx = r * w + c;
          if (!valid[idx]) continue;
          const v0 = resp[idx];
          const kind = v0 > 0 ? "bright" : v0 < 0 ? "dark" : null;
          if (!kind) continue;
          const sign = kind === "bright" ? 1 : -1;
          const det0 = sign * v0;
          const thr = kind === "bright" ? brightThreshold : darkThreshold;
          if (det0 < thr) continue;

          let isPeak = true;
          outer:
          for (let dk = -1; dk <= 1; dk++) {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dk === 0 && dr === 0 && dc === 0) continue;
                const nv = sample(k + dk, r + dr, c + dc);
                if (nv === null) {
                  isPeak = false;
                  break outer;
                }
                const nd = sign * nv;
                if (nd > det0 ||
                    (nd === det0 && (dk < 0 ||
                      (dk === 0 && (dr < 0 || (dr === 0 && dc < 0)))))) {
                  isPeak = false;
                  break outer;
                }
              }
            }
          }
          if (!isPeak) continue;

          // 3D quadratic refinement on the detection volume
          const detAt = (dk2, dr2, dc2) =>
            sign * sample(k + dk2, r + dr2, c + dc2);
          const s0 = det0;
          const grad = [
            (detAt(1, 0, 0) - detAt(-1, 0, 0)) / 2,
            (detAt(0, 1, 0) - detAt(0, -1, 0)) / 2,
            (detAt(0, 0, 1) - detAt(0, 0, -1)) / 2,
          ];
          const H = [
            [
              detAt(1, 0, 0) - 2 * s0 + detAt(-1, 0, 0),
              (detAt(1, 1, 0) - detAt(1, -1, 0) -
                detAt(-1, 1, 0) + detAt(-1, -1, 0)) / 4,
              (detAt(1, 0, 1) - detAt(1, 0, -1) -
                detAt(-1, 0, 1) + detAt(-1, 0, -1)) / 4,
            ],
            [0,
              detAt(0, 1, 0) - 2 * s0 + detAt(0, -1, 0),
              (detAt(0, 1, 1) - detAt(0, 1, -1) -
                detAt(0, -1, 1) + detAt(0, -1, -1)) / 4,
            ],
            [0, 0,
              detAt(0, 0, 1) - 2 * s0 + detAt(0, 0, -1),
            ],
          ];
          H[1][0] = H[0][1];
          H[2][0] = H[0][2];
          H[2][1] = H[1][2];

          let refined = false;
          let delta = [0, 0, 0];
          let refinedResponse = v0;
          let refinedLevel = k;
          let refinedRow = r;
          let refinedCol = c;
          let refinedSigma = sigmas[k];

          if (isNegativeDefinite(H)) {
            const sol = solve3(H, grad);
            if (sol && Math.abs(sol[0]) <= 1 &&
                Math.abs(sol[1]) <= 1 && Math.abs(sol[2]) <= 1) {
              refined = true;
              delta = sol;
              refinedLevel = k + sol[0];
              refinedRow = r + sol[1];
              refinedCol = c + sol[2];
              refinedSigma = sigma0 * Math.pow(ratio, refinedLevel);
              const detRefined =
                s0 + 0.5 * (grad[0] * sol[0] + grad[1] * sol[1] +
                  grad[2] * sol[2]);
              refinedResponse = sign * detRefined;
            }
          }

          peaks.push({
            kind,
            level: k,
            row: r,
            col: c,
            response: v0,
            sigma: sigmas[k],
            x: c * dx,
            y: r * dy,
            refined,
            deltaLevel: delta[0],
            deltaRow: delta[1],
            deltaCol: delta[2],
            refinedLevel,
            refinedRow,
            refinedCol,
            refinedX: refinedCol * dx,
            refinedY: refinedRow * dy,
            refinedSigma,
            refinedResponse,
          });
        }
      }
    }
    return peaks;
  }

  function run(params) {
    const volume = computeVolume(params);
    const peaks = detectPeaks(params, volume);
    return { volume, peaks };
  }

  return { buildAxisKernel, computeVolume, detectPeaks, run };
});

  height: null,
  dx: null,
  dy: null,
  image: null,       // Float64Array
  mask: null,        // Uint8Array
  imageName: "",
  maskName: "",
  params: null,      // detection params of last run
  volume: null,
  peaks: [],
  selected: -1,
  view: "image",
  level: 0,
  showSpots: true,
  showMask: true,
  imgMin: 0,
  imgMax: 1,
  respAbsMax: 1,
};

const $ = (id) => document.getElementById(id);
const toastEl = $("toast");
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
}
function setStatus(msg, isErr) {
  const el = $("statusLine");
  el.textContent = msg || "";
  el.classList.toggle("err", !!isErr);
}

/* ============================================================
 * theme
 * ============================================================ */
$("themeToggle").addEventListener("click", () => {
  const root = document.documentElement;
  const darkNow =
    root.dataset.theme === "dark" ||
    (!root.dataset.theme &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.theme = darkNow ? "light" : "dark";
  if (state.view === "response" || state.image) renderCanvas();
});

/* ============================================================
 * numeric inputs / sliders
 * ============================================================ */
const defaults = {
  w: 129, h: 97, dx: 0.6, dy: 1.1,
  sigma0: 1.5, levels: 9, ratio: 1.25,
  brightThr: 0.12, darkThr: 0.12,
};
function setDefaults() {
  $("inW").value = defaults.w;
  $("inH").value = defaults.h;
  $("inDx").value = defaults.dx;
  $("inDy").value = defaults.dy;
  $("inSigma0").value = defaults.sigma0;
  $("inLevels").value = defaults.levels;
  $("inRatio").value = defaults.ratio;
  $("inBrightThr").value = defaults.brightThr;
  $("inDarkThr").value = defaults.darkThr;
  syncReadouts();
}
function syncReadouts() {
  $("sigma0Val").textContent = Number($("inSigma0").value).toFixed(2);
  $("levelsVal").textContent = $("inLevels").value;
  $("ratioVal").textContent = Number($("inRatio").value).toFixed(2);
  $("brightThrVal").textContent = Number($("inBrightThr").value).toFixed(3);
  $("darkThrVal").textContent = Number($("inDarkThr").value).toFixed(3);
}
["inSigma0", "inLevels", "inRatio", "inBrightThr", "inDarkThr"].forEach((id) =>
  $(id).addEventListener("input", syncReadouts)
);
setDefaults();

/* ============================================================
 * file loading
 * ============================================================ */
async function readFileBuffer(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error);
    fr.readAsArrayBuffer(file);
  });
}

$("imgFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await readFileBuffer(file);
    const w = parseInt($("inW").value, 10);
    const h = parseInt($("inH").value, 10);
    if (!Number.isFinite(w) || !Number.isFinite(h) || w < 1 || h < 1) {
      throw new Error("请先填写有效的宽 w 和高 h。");
    }
    if (w > 384 || h > 384) {
      throw new Error("单边不能超过 384 像素。");
    }
    if (buf.byteLength !== w * h * 4) {
      throw new Error(
        `文件大小 ${buf.byteLength} 字节与 w×h×4 = ${w * h * 4} 不符。`
      );
    }
    const dv = new DataView(buf);
    const n = w * h;
    const image = new Float64Array(n);
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < n; i++) {
      const v = dv.getFloat32(i * 4, true);
      if (!Number.isFinite(v)) throw new Error("图像含非有限数值（NaN/Inf）。");
      image[i] = v;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    state.width = w;
    state.height = h;
    state.image = image;
    state.imageName = file.name;
    state.imgMin = lo;
    state.imgMax = hi;
    state.mask = new Uint8Array(n).fill(1);
    state.maskName = "";
    $("imgFileName").textContent = `${file.name} · ${w}×${h}`;
    $("maskFileName").textContent = "未选择（默认全图有效）";
    $("maskFile").value = "";
    resetResults();
    $("runBtn").disabled = false;
    setStatus(`已载入 ${file.name}，值域 [${lo.toFixed(4)}, ${hi.toFixed(4)}]。`);
    renderCanvas();
  } catch (err) {
    setStatus(err.message, true);
  }
});

$("maskFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    if (!state.image) throw new Error("请先载入灰度图。");
    const buf = await readFileBuffer(file);
    const n = state.width * state.height;
    if (buf.byteLength !== n) {
      throw new Error(`掩膜大小应为 ${n} 字节，实际 ${buf.byteLength}。`);
    }
    const u8 = new Uint8Array(buf);
    const mask = new Uint8Array(n);
    for (let i = 0; i < n; i++) mask[i] = u8[i] ? 1 : 0;
    state.mask = mask;
    state.maskName = file.name;
    $("maskFileName").textContent =
      `${file.name} · 有效像素 ${mask.reduce((a, b) => a + b, 0)}/${n}`;
    resetResults();
    renderCanvas();
    setStatus("掩膜已载入，需重新运行检测。");
  } catch (err) {
    setStatus(err.message, true);
  }
});

$("jsonFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const meta = JSON.parse(text);
    const num = (v) => (Number.isFinite(v) ? v : null);
    if (num(meta.w)) $("inW").value = meta.w;
    if (num(meta.h)) $("inH").value = meta.h;
    if (num(meta.dx)) $("inDx").value = meta.dx;
    if (num(meta.dy)) $("inDy").value = meta.dy;
    if (num(meta.sigma0)) $("inSigma0").value = meta.sigma0;
    if (Number.isInteger(meta.levels)) $("inLevels").value = meta.levels;
    if (num(meta.ratio)) $("inRatio").value = meta.ratio;
    if (num(meta.threshold)) {
      $("inBrightThr").value = meta.threshold;
      $("inDarkThr").value = meta.threshold;
    }
    syncReadouts();
    $("jsonFileName").textContent = `${file.name} 已应用`;
    setStatus("参数侧车已填入表单。");
  } catch (err) {
    $("jsonFileName").textContent = "未选择";
    setStatus("参数侧车解析失败：" + err.message, true);
  }
});

function resetResults() {
  state.volume = null;
  state.peaks = [];
  state.selected = -1;
  state.params = null;
  $("exportBtn").disabled = true;
  $("copyBtn").disabled = true;
  $("resultPanel").hidden = true;
  $("detailPanel").hidden = true;
  $("levelSlider").disabled = true;
}

/* ============================================================
 * detection
 * ============================================================ */
function readParams() {
  const w = parseInt($("inW").value, 10);
  const h = parseInt($("inH").value, 10);
  const dx = Number($("inDx").value);
  const dy = Number($("inDy").value);
  const sigma0 = Number($("inSigma0").value);
  const levels = parseInt($("inLevels").value, 10);
  const ratio = Number($("inRatio").value);
  const brightThreshold = Number($("inBrightThr").value);
  const darkThreshold = Number($("inDarkThr").value);
  if (![w, h].every((v) => Number.isInteger(v) && v >= 1 && v <= 384)) {
    throw new Error("宽高需为 1–384 的整数。");
  }
  if (!(dx > 0 && dy > 0)) throw new Error("物理间距必须为正数。");
  if (!(sigma0 > 0)) throw new Error("起始尺度 σ₀ 必须为正数。");
  if (!(ratio > 1)) throw new Error("比例 ratio 必须大于 1。");
  if (!(levels >= 3 && levels <= 16)) throw new Error("尺度数需在 3–16 之间。");
  return {
    width: w, height: h, dx, dy, sigma0, ratio, levels,
    brightThreshold, darkThreshold,
  };
}

$("runBtn").addEventListener("click", () => {
  if (!state.image) {
    setStatus("请先载入灰度图。", true);
    return;
  }
  let params;
  try {
    params = readParams();
  } catch (err) {
    setStatus(err.message, true);
    return;
  }
  setStatus("计算中…");
  $("runBtn").disabled = true;
  // defer so the status text paints before the heavy synchronous pass
  setTimeout(() => {
    try {
      const t0 = performance.now();
      const { volume, peaks } = LogCore.run({
        ...params,
        image: state.image,
        mask: state.mask || new Uint8Array(params.width * params.height).fill(1),
      });
      const elapsed = performance.now() - t0;
      state.volume = volume;
      state.peaks = peaks;
      state.params = params;
      state.level = Math.min(state.level, params.levels - 1);
      $("levelSlider").max = params.levels - 1;
      $("levelSlider").value = state.level;
      $("levelSlider").disabled = false;
      updateLevelLabel();
      // symmetric colour scale from the strongest absolute response
      let amax = 1e-12;
      for (const resp of volume.responses) {
        for (let i = 0; i < resp.length; i++) {
          const a = Math.abs(resp[i]);
          if (a > amax) amax = a;
        }
      }
      state.respAbsMax = amax;
      $("exportBtn").disabled = peaks.length === 0;
      $("copyBtn").disabled = peaks.length === 0;
      populateTable();
      renderCanvas();
      const nb = peaks.filter((p) => p.kind === "bright").length;
      const nd = peaks.length - nb;
      setStatus(
        `完成：${peaks.length} 个斑点（亮 ${nb} / 暗 ${nd}），用时 ${elapsed.toFixed(0)} ms。`
      );
    } catch (err) {
      setStatus("检测失败：" + err.message, true);
    } finally {
      $("runBtn").disabled = false;
    }
  }, 30);
});

/* ============================================================
 * canvas rendering
 * ============================================================ */
const canvas = $("view");
const ctx = canvas.getContext("2d");

function updateLevelLabel() {
  if (!state.volume) return;
  const k = state.level;
  $("levelLabel").textContent =
    `k=${k} · σ=${state.volume.sigmas[k].toFixed(3)}`;
}
$("levelSlider").addEventListener("input", (e) => {
  state.level = parseInt(e.target.value, 10);
  updateLevelLabel();
  renderCanvas();
});
$("viewSeg").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.view = btn.dataset.view;
  [...$("viewSeg").children].forEach((b) =>
    b.classList.toggle("active", b === btn)
  );
  $("respLegend").classList.toggle("hidden", state.view !== "response");
  renderCanvas();
});
$("showSpots").addEventListener("change", (e) => {
  state.showSpots = e.target.checked;
  renderCanvas();
});
$("showMask").addEventListener("change", (e) => {
  state.showMask = e.target.checked;
  renderCanvas();
});

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderCanvas() {
  if (!state.image) return;
  const w = state.width, h = state.height;
  const scale = Math.max(1, Math.floor(384 / Math.max(w, h)));
  canvas.width = w * scale;
  canvas.height = h * scale;
  const img = ctx.createImageData(w, h);
  const data = img.data;

  if (state.view === "image" || !state.volume) {
    const lo = state.imgMin, span = Math.max(1e-12, state.imgMax - lo);
    for (let i = 0; i < w * h; i++) {
      const t = (state.image[i] - lo) / span;
      const g = Math.round(255 * t);
      data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = g;
      data[i * 4 + 3] = 255;
    }
  } else {
    const resp = state.volume.responses[state.level];
    const valid = state.volume.valids[state.level];
    const amax = state.respAbsMax;
    for (let i = 0; i < w * h; i++) {
      const o = i * 4;
      if (!valid[i]) {
        data[o] = data[o + 1] = data[o + 2] = 120;
        data[o + 3] = 255;
        continue;
      }
      const t = Math.max(-1, Math.min(1, resp[i] / amax));
      const [r, g, b] = divergingColor(t);
      data[o] = r; data[o + 1] = g; data[o + 2] = b;
      data[o + 3] = 255;
    }
  }
  // draw 1:1 then upscale with nearest neighbour
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  off.getContext("2d").putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(off, 0, 0, canvas.width, canvas.height);

  if (state.showMask && state.mask) drawMaskHatch(scale);
  if (state.showSpots && state.volume) drawSpots(scale);
}

// positive LoG (bright blobs) -> amber/warm; negative (dark blobs) -> blue/cool
function divergingColor(t) {
  // Neutral warm grey at 0; sqrt curve lifts weak responses above the floor.
  const a = Math.sqrt(Math.max(-1, Math.min(1, Math.abs(t))));
  if (t >= 0) {
    const r = Math.round(232 + (176 - 232) * a);
    const g = Math.round(225 + (74 - 225) * a);
    const b = Math.round(214 + (22 - 214) * a);
    return [r, g, b];
  }
  // steel blue: blue stays high, red/green fall
  const r = Math.round(214 + (38 - 214) * a);
  const g = Math.round(222 + (101 - 222) * a);
  const b = Math.round(228 + (210 - 228) * a);
  return [r, g, b];
}

function drawMaskHatch(scale) {
  const w = state.width, h = state.height;
  ctx.save();
  ctx.fillStyle = "rgba(120,120,120,0.42)";
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      if (!state.mask[r * w + c]) ctx.fillRect(c * scale, r * scale, scale, scale);
    }
  }
  ctx.restore();
}

function drawSpots(scale) {
  const p = state.params;
  ctx.save();
  ctx.lineWidth = Math.max(1.2, scale * 0.7);
  ctx.font = `${Math.max(10, 5 * scale)}px ${cssVar("--mono")}`;
  state.peaks.forEach((spot, idx) => {
    const col = spot.refined ? spot.refinedCol : spot.col;
    const row = spot.refined ? spot.refinedRow : spot.row;
    const sigma = spot.refined ? spot.refinedSigma : spot.sigma;
    const color = spot.kind === "bright" ? cssVar("--bright") : cssVar("--dark");
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    // ellipse: physical sigma in each axis mapped back to pixels
    const rx = sigma / p.dx * scale;
    const ry = sigma / p.dy * scale;
    ctx.beginPath();
    ctx.ellipse((col + 0.5) * scale, (row + 0.5) * scale, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    // centre cross
    const cx = (col + 0.5) * scale, cy = (row + 0.5) * scale;
    const cs = Math.max(2, scale);
    ctx.beginPath();
    ctx.moveTo(cx - cs, cy); ctx.lineTo(cx + cs, cy);
    ctx.moveTo(cx, cy - cs); ctx.lineTo(cx, cy + cs);
    ctx.stroke();
    if (idx === state.selected) {
      ctx.strokeStyle = cssVar("--accent");
      ctx.lineWidth = Math.max(1, scale * 0.4);
      ctx.strokeRect(
        (spot.col - 1.5) * scale, (spot.row - 1.5) * scale,
        3 * scale, 3 * scale
      );
    }
  });
  ctx.restore();
}

/* click on canvas selects the nearest spot within its ellipse */
canvas.addEventListener("click", (e) => {
  if (!state.volume || state.peaks.length === 0) return;
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (canvas.width / rect.width);
  const py = (e.clientY - rect.top) * (canvas.height / rect.height);
  const scale = canvas.width / state.width;
  const col = px / scale - 0.5;
  const row = py / scale - 0.5;
  const p = state.params;
  let best = -1, bestD = Infinity;
  state.peaks.forEach((spot, idx) => {
    const sc = spot.refined ? spot.refinedCol : spot.col;
    const sr = spot.refined ? spot.refinedRow : spot.row;
    const sig = spot.refined ? spot.refinedSigma : spot.sigma;
    const ex = ((col - sc) * p.dx) / sig;
    const ey = ((row - sr) * p.dy) / sig;
    const d = ex * ex + ey * ey;
    if (d <= 1 && d < bestD) { bestD = d; best = idx; }
  });
  if (best >= 0) selectSpot(best);
});

/* ============================================================
 * results table + detail
 * ============================================================ */
function populateTable() {
  const tbody = $("spotTable").querySelector("tbody");
  tbody.innerHTML = "";
  state.peaks.forEach((spot, idx) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${idx + 1}</td>` +
      `<td><span class="pill ${spot.kind}">${spot.kind === "bright" ? "亮" : "暗"}</span></td>` +
      `<td class="mono">${spot.level}</td>` +
      `<td class="mono">${(spot.refined ? spot.refinedSigma : spot.sigma).toFixed(3)}</td>` +
      `<td class="mono">${(spot.refined ? spot.refinedX : spot.x).toFixed(3)}</td>` +
      `<td class="mono">${(spot.refined ? spot.refinedY : spot.y).toFixed(3)}</td>` +
      `<td class="mono">${(spot.refined ? spot.refinedResponse : spot.response).toFixed(4)}</td>` +
      `<td><span class="pill ${spot.refined ? "ok" : "no"}">${spot.refined ? "成功" : "未细化"}</span></td>`;
    tr.addEventListener("click", () => selectSpot(idx));
    tbody.appendChild(tr);
  });
  $("resultPanel").hidden = false;
  const nb = state.peaks.filter((p) => p.kind === "bright").length;
  $("countChip").textContent =
    `${state.peaks.length} 个 · 亮 ${nb} · 暗 ${state.peaks.length - nb}`;
}

function selectSpot(idx) {
  state.selected = idx;
  const spot = state.peaks[idx];
  [...$("spotTable").querySelectorAll("tbody tr")].forEach((tr, i) =>
    tr.classList.toggle("selected", i === idx)
  );
  // jump the level slider to the spot's peak level
  state.level = spot.level;
  $("levelSlider").value = spot.level;
  updateLevelLabel();
  renderCanvas();
  renderDetail(spot, idx);
  $("detailPanel").hidden = false;
  $("detailPanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderDetail(spot, idx) {
  const p = state.params;
  const stats = [
    ["编号", `#${idx + 1}`],
    ["类型", spot.kind === "bright" ? "亮斑（正响应）" : "暗斑（负响应）"],
    ["细化状态", spot.refined ? "成功（负定且 |位移| ≤ 1）" : "未接受（非负定或越界）"],
    ["峰值层 k", `${spot.level} / ${p.levels - 1}`],
    ["像素位置 (列, 行)", `(${spot.col}, ${spot.row})`],
    ["物理中心 (x, y)", spot.refined
      ? `(${spot.refinedX.toFixed(3)}, ${spot.refinedY.toFixed(3)})`
      : `(${spot.x.toFixed(3)}, ${spot.y.toFixed(3)})`],
    ["尺度 σ（物理单位）", spot.refined
      ? spot.refinedSigma.toFixed(4) : spot.sigma.toFixed(4)],
    ["细化层坐标", spot.refined ? spot.refinedLevel.toFixed(4) : "—"],
    ["整数中心响应", spot.response.toFixed(5)],
    ["细化点响应", spot.refined ? spot.refinedResponse.toFixed(5) : "—"],
    ["位移 (Δ层, Δ行, Δ列)", spot.refined
      ? `(${spot.deltaLevel.toFixed(3)}, ${spot.deltaRow.toFixed(3)}, ${spot.deltaCol.toFixed(3)})`
      : "—"],
  ];
  $("detailStats").innerHTML = stats
    .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`)
    .join("");

  // responses across nearby levels, evaluated at the integer peak cell
  const bars = [];
  const k = spot.level;
  for (let kk = Math.max(0, k - 1); kk <= Math.min(p.levels - 1, k + 1); kk++) {
    const v = state.volume.responses[kk][spot.row * p.width + spot.col];
    const valid = state.volume.valids[kk][spot.row * p.width + spot.col];
    bars.push({ level: kk, v, valid, isPeak: kk === k });
  }
  const maxAbs = Math.max(...bars.map((b) => Math.abs(b.v)), 1e-12);
  $("scaleBars").innerHTML = bars
    .map((b) => {
      const pct = Math.round((Math.abs(b.v) / maxAbs) * 100);
      const cls = "bar " + (b.isPeak ? "peak" + (spot.kind === "dark" ? " darkkind" : "") : "");
      const tag = b.isPeak
        ? "当前"
        : b.level < spot.level ? "−1 层" : "+1 层";
      return `<div class="scale-row">
        <span>${b.level}</span>
        <div class="${cls}"><i style="width:${b.valid ? pct : 0}%"></i></div>
        <span>${tag} · ${b.valid ? b.v.toFixed(4) : "无效"}</span>
      </div>`;
    })
    .join("");
}

/* ============================================================
 * CSV export
 * ============================================================ */
function buildCsv() {
  const p = state.params;
  const header = [
    "id", "type", "level", "col_px", "row_px",
    "x_physical", "y_physical", "sigma_physical",
    "response", "refined",
    "refined_level", "refined_col", "refined_row",
    "refined_x_physical", "refined_y_physical",
    "refined_sigma_physical", "refined_response",
    "delta_level", "delta_row", "delta_col",
  ];
  const rows = state.peaks.map((s, i) => [
    i + 1,
    s.kind,
    s.level,
    s.col,
    s.row,
    s.x.toFixed(6),
    s.y.toFixed(6),
    s.sigma.toFixed(6),
    s.response.toFixed(6),
    s.refined ? 1 : 0,
    s.refined ? s.refinedLevel.toFixed(6) : "",
    s.refined ? s.refinedCol.toFixed(6) : "",
    s.refined ? s.refinedRow.toFixed(6) : "",
    s.refined ? s.refinedX.toFixed(6) : "",
    s.refined ? s.refinedY.toFixed(6) : "",
    s.refined ? s.refinedSigma.toFixed(6) : "",
    s.refined ? s.refinedResponse.toFixed(6) : "",
    s.refined ? s.deltaLevel.toFixed(6) : "",
    s.refined ? s.deltaRow.toFixed(6) : "",
    s.refined ? s.deltaCol.toFixed(6) : "",
  ]);
  return [header, ...rows].map((r) => r.join(",")).join("\r\n");
}

function downloadCsv() {
  const csv = buildCsv();
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `log-spots-${state.width}x${state.height}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("CSV 已生成下载。");
}
$("exportBtn").addEventListener("click", downloadCsv);

$("copyBtn").addEventListener("click", async () => {
  const csv = buildCsv();
  try {
    await navigator.clipboard.writeText(csv);
    toast("CSV 已复制到剪贴板。");
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = csv;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      toast("CSV 已复制到剪贴板。");
    } catch (err2) {
      toast("复制失败，请改用导出按钮。");
    }
    ta.remove();
  }
});

/* ============================================================
 * built-in sample (matches samples/physical-log-spots-cases.zip)
 * ============================================================ */
$("loadSampleBtn").addEventListener("click", async () => {
  try {
    setStatus("载入内置样例…");
    const buf = await SAMPLE_ASSETS.getImage();
    const mbuf = await SAMPLE_ASSETS.getMask();
    const meta = SAMPLE_ASSETS.meta;
    const w = meta.w, h = meta.h, n = w * h;
    const dv = new DataView(buf);
    const image = new Float64Array(n);
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < n; i++) {
      const v = dv.getFloat32(i * 4, true);
      image[i] = v;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    const mu8 = new Uint8Array(mbuf);
    const mask = new Uint8Array(n);
    for (let i = 0; i < n; i++) mask[i] = mu8[i] ? 1 : 0;
    state.width = w; state.height = h;
    state.image = image; state.mask = mask;
    state.imageName = "spots.f32（内置样例）";
    state.maskName = "mask.u8（内置样例）";
    state.imgMin = lo; state.imgMax = hi;
    $("inW").value = w; $("inH").value = h;
    $("inDx").value = meta.dx; $("inDy").value = meta.dy;
    $("inSigma0").value = meta.sigma0;
    $("inLevels").value = meta.levels;
    $("inRatio").value = meta.ratio;
    $("inBrightThr").value = meta.threshold;
    $("inDarkThr").value = meta.threshold;
    syncReadouts();
    $("imgFileName").textContent = `spots.f32 · ${w}×${h}（内置）`;
    $("maskFileName").textContent =
      `mask.u8 · 有效 ${mask.reduce((a, b) => a + b, 0)}/${n}（内置）`;
    resetResults();
    $("runBtn").disabled = false;
    setStatus("内置样例已载入，点击“运行检测”。");
    renderCanvas();
  } catch (err) {
    setStatus("样例载入失败：" + err.message, true);
  }
});

/* first paint */
renderCanvas();
</script>
