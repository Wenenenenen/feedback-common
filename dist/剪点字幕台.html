<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>剪点字幕台</title>
<meta name="description" content="按剪辑单裁切字幕、以精确分数重排时间轴，联动追溯源词，导出 WebVTT 与含来源关系的 JSON。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 剪点字幕台 — design tokens and layout
   Layout concept: a broadcast conform desk. Ledger strip of counts on top,
   three adjacent panes (source / edit / conform) sharing one time language,
   and a persistent trace rail at the bottom that ties a result back to a word. */

:root {
  /* Color — cool paper with a signal-red accent; panel hues borrow from
     broadcast slate: source = ink blue, edit = amber, conform = green. */
  --bg: #eef1ec;
  --surface: #f9faf6;
  --surface-2: #e8ece5;
  --surface-3: #dde2da;
  --ink: #141917;
  --ink-2: #414a46;
  --ink-3: #6c7771;
  --line: #d3d9d0;
  --line-2: #b9c3b8;
  --accent: #b4331e;
  --accent-ink: #fff8f5;
  --accent-soft: #f4dcd5;
  --src: #2b5d8c;
  --src-soft: #e0e9f2;
  --clipc: #8a6410;
  --clip-ink: #fffaf0;
  --clip-soft: #f1e7cd;
  --outc: #1c6a4e;
  --out-soft: #dbeae2;
  --danger: #a7241d;
  --danger-soft: #f5ddd9;
  --warn: #7d5300;
  --warn-soft: #f3e9d1;
  --ok: #1c6a4e;
  --shadow: 0 16px 44px rgba(18, 24, 21, 0.15), 0 3px 9px rgba(18, 24, 21, 0.07);
  --shadow-sm: 0 1px 2px rgba(18, 24, 21, 0.06);
  --radius: 8px;
  --radius-sm: 5px;

  /* Type — Plex Sans for UI, Plex Mono carries every timecode and fraction so
     the exact numbers line up as a ledger. Noto Sans SC for CJK body text. */
  --sans: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Noto Sans Mono CJK SC", monospace;
  --size-xs: 10.5px;
  --size-sm: 12px;
  --size-md: 13.5px;
  --size-lg: 16px;
  --size-xl: 21px;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1110;
    --surface: #141917;
    --surface-2: #1a201d;
    --surface-3: #222a26;
    --ink: #e8ece5;
    --ink-2: #b1bbb4;
    --ink-3: #849087;
    --line: #28312c;
    --line-2: #38453e;
    --accent: #ef7358;
    --accent-ink: #1c0c07;
    --accent-soft: #2f1a13;
    --src: #7caddb;
    --src-soft: #16252f;
    --clipc: #d0a145;
    --clip-ink: #1b1404;
    --clip-soft: #2a2314;
    --outc: #6bc5a0;
    --out-soft: #142620;
    --danger: #ef8a80;
    --danger-soft: #2f1714;
    --warn: #dfb05a;
    --warn-soft: #2a2213;
    --ok: #6bc5a0;
    --shadow: 0 16px 44px rgba(0, 0, 0, 0.5), 0 3px 9px rgba(0, 0, 0, 0.35);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1110;
  --surface: #141917;
  --surface-2: #1a201d;
  --surface-3: #222a26;
  --ink: #e8ece5;
  --ink-2: #b1bbb4;
  --ink-3: #849087;
  --line: #28312c;
  --line-2: #38453e;
  --accent: #ef7358;
  --accent-ink: #1c0c07;
  --accent-soft: #2f1a13;
  --src: #7caddb;
  --src-soft: #16252f;
  --clipc: #d0a145;
  --clip-ink: #1b1404;
  --clip-soft: #2a2314;
  --outc: #6bc5a0;
  --out-soft: #142620;
  --danger: #ef8a80;
  --danger-soft: #2f1714;
  --warn: #dfb05a;
  --warn-soft: #2a2213;
  --ok: #6bc5a0;
  --shadow: 0 16px 44px rgba(0, 0, 0, 0.5), 0 3px 9px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--size-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--accent-soft); color: var(--ink); }

.app {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 1680px;
  margin: 0 auto;
  padding-block: 18px 22px;
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark {
  display: grid; place-items: center;
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--bg);
  flex: none;
}
.brand-text { min-width: 0; }
.brand-text h1 {
  margin: 0;
  font-size: var(--size-xl);
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.15;
}
.brand-text p {
  margin: 1px 0 0;
  font-size: var(--size-xs);
  color: var(--ink-3);
  letter-spacing: 0.04em;
}
.doc-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-family: var(--mono);
  font-size: var(--size-xs);
  color: var(--ink-2);
  max-width: 260px;
}
.doc-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.doc-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-chip.is-custom .dot { background: var(--accent); }
.top-actions { margin-left: auto; display: flex; gap: 7px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px;
  padding: 6px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--size-sm);
  font-weight: 500;
  white-space: nowrap;
  transition: background-color .12s, border-color .12s, color .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(0.5px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--line); }
.btn.tiny { min-height: 26px; padding: 3px 9px; font-size: var(--size-xs); }
.btn.icon { padding: 3px 8px; font-size: 15px; line-height: 1; }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }

/* ---------- Ledger ---------- */
.ledger {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.stat {
  background: var(--surface);
  padding: 9px 13px 10px;
  min-width: 0;
}
.stat-label {
  font-size: var(--size-xs);
  color: var(--ink-3);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
}
.stat-value {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-value small { font-size: var(--size-xs); font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.stat.is-bad .stat-value { color: var(--danger); }
.stat.is-warn .stat-value { color: var(--warn); }
.stat.is-ok .stat-value { color: var(--ok); }
.stat.is-click { cursor: pointer; }
.stat.is-click:hover { background: var(--surface-2); }

/* The live problem summary sits in the ledger as a full-width row */
.ledger-summary {
  grid-column: 1 / -1;
  background: var(--surface);
  display: flex; align-items: center; gap: 10px;
  padding: 7px 13px;
  font-size: var(--size-xs);
  color: var(--ink-2);
  flex-wrap: wrap;
}
.ledger-summary .pill { font-size: var(--size-xs); }
.ledger-summary code { font-family: var(--mono); font-size: 9.5px; }

/* ---------- Pane switching for narrow ---------- */
.pane-switch {
  display: none;
  gap: 4px;
  padding: 3px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.pane-switch button {
  flex: 1;
  border: 0;
  background: transparent;
  border-radius: var(--radius-sm);
  padding: 7px 4px;
  font-size: var(--size-sm);
  font-weight: 500;
  color: var(--ink-2);
  min-height: 34px;
}
.pane-switch button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 600; }

/* ---------- Bench ---------- */
.bench {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr) minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}
.panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px 9px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  flex-wrap: wrap;
}
.ph-title { min-width: 0; }
.eyebrow {
  display: block;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  color: var(--ink-3);
}
.panel[data-pane="source"] .eyebrow { color: var(--src); }
.panel[data-pane="clip"] .eyebrow { color: var(--clipc); }
.panel[data-pane="out"] .eyebrow { color: var(--outc); }
.panel-head h2 {
  margin: 0;
  font-size: var(--size-lg);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.25;
}
.panel-tools { margin-left: auto; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.panel-foot {
  padding: 6px 12px;
  border-top: 1px solid var(--line);
  font-size: var(--size-xs);
  color: var(--ink-3);
  min-height: 29px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--mono);
}
.panel-foot .sep { color: var(--line-2); }

/* Source tabs */
.tabs { display: flex; gap: 0; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.tabs:empty { display: none; }
.tab {
  border: 0; background: transparent;
  padding: 6px 13px;
  font-size: var(--size-sm);
  font-family: var(--mono);
  color: var(--ink-2);
  border-right: 1px solid var(--line);
  white-space: nowrap;
  min-height: 30px;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--src); font-weight: 600; box-shadow: inset 0 -2px 0 var(--src); }
.tab .n { font-size: 10px; color: var(--ink-3); }
.tab[aria-selected="true"] .n { color: var(--src); }

/* ---------- Ruler (source + output time axes) ---------- */
.ruler {
  position: relative;
  height: 23px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
  overflow: hidden;
  flex: none;
}
.ruler:empty { display: none; }
.ruler .tick {
  position: absolute;
  top: 0; bottom: 0;
  border-left: 1px solid var(--line-2);
  padding-left: 4px;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink-3);
  line-height: 23px;
  white-space: nowrap;
  pointer-events: none;
}
.ruler .tick.minor { border-left-color: var(--line); }
.ruler .tick.minor span { display: none; }
.ruler .range-band {
  position: absolute; top: 13px; bottom: 0;
  background: color-mix(in srgb, var(--clipc) 42%, transparent);
  border-top: 1.5px solid var(--clipc);
  pointer-events: none;
}
.ruler .ovl-band {
  position: absolute; top: 0; bottom: 0;
  background: color-mix(in srgb, var(--warn) 26%, transparent);
  border-left: 1px solid var(--warn);
  border-right: 1px solid var(--warn);
  pointer-events: none;
}

/* ---------- Virtual list host ---------- */
.vhost {
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  max-height: min(54vh, 560px);
  min-height: 190px;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
.vhost .vspacer { position: relative; }
.vrow { position: absolute; left: 0; right: 0; }
.src-row {
  position: relative;
  display: grid;
  grid-template-columns: 63px minmax(0, 1fr);
  gap: 0 9px;
  padding: 6px 10px 6px 10px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  align-items: start;
}
.src-row:hover { background: var(--surface-2); }
.src-row.is-active { background: var(--src-soft); }
.src-row.is-active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--src);
}
.src-row .tc {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  line-height: 1.35;
  padding-top: 2px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.src-row .tc b { display: block; color: var(--ink-2); font-weight: 500; font-size: 10.5px; }
.src-row .body { min-width: 0; }
.src-row .text { font-size: var(--size-md); line-height: 1.42; word-break: break-word; }
.src-row .text .w { border-radius: 3px; padding: 0 1px; margin: 0 -1px; }
.src-row .text .w.used { box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--src) 45%, transparent); }
.src-row .text .w.sel { background: var(--src); color: var(--surface); box-shadow: none; }
.src-row .text .w.sel.used { box-shadow: none; }
.src-row .meta {
  display: flex; gap: 5px; align-items: center; flex-wrap: wrap;
  margin-top: 2px;
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-3);
}
.chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 0 5px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 16px;
  border: 1px solid var(--line);
  color: var(--ink-3);
  white-space: nowrap;
}
.chip.src { border-color: color-mix(in srgb, var(--src) 35%, var(--line)); color: var(--src); }
.chip.clip { border-color: color-mix(in srgb, var(--clipc) 40%, var(--line)); color: var(--clipc); }
.chip.out { border-color: color-mix(in srgb, var(--outc) 38%, var(--line)); color: var(--outc); }
.chip.bad { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.chip.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.chip.plain { border-color: transparent; background: var(--surface-2); }

/* Inline word timing strip */
.wstrip {
  grid-column: 1 / -1;
  display: flex; flex-wrap: wrap; gap: 3px;
  margin-top: 5px;
  align-content: flex-start;
}
.wchip {
  display: inline-flex; align-items: baseline; gap: 4px;
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink-2);
  white-space: nowrap;
  cursor: pointer;
  line-height: 16px;
}
.wchip:hover { border-color: var(--src); color: var(--src); }
.wchip .wt { font-size: 9px; color: var(--ink-3); }
.wchip.is-sel { background: var(--src); border-color: var(--src); color: var(--surface); }
.wchip.is-sel .wt { color: color-mix(in srgb, var(--surface) 75%, transparent); }
.wchip.is-hit { border-color: color-mix(in srgb, var(--outc) 40%, var(--line)); }
.wchip.is-cut { opacity: .55; text-decoration: line-through; }
.word-picks { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; max-height: 110px; overflow-y: auto; }

/* ---------- Clip rows ---------- */
.clip-row {
  position: relative;
  display: grid;
  grid-template-columns: 94px minmax(0, 1fr);
  gap: 0 8px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  border-left: 3px solid transparent;
  cursor: pointer;
}
.clip-row:hover { background: var(--surface-2); }
.clip-row.is-active { background: var(--clip-soft); border-left-color: var(--clipc); }
.clip-row.is-selected { background: var(--clip-soft); border-left-color: var(--clipc); }
.clip-row.is-gap { background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--ink-3) 8%, transparent) 6px 12px); }
.clip-row.is-bad { border-left-color: var(--danger); background: var(--danger-soft); }
.clip-row.is-hover-src { background: var(--src-soft); }
.clip-row .lead { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.clip-row .mini-select {
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--surface);
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 1px 4px;
  max-width: 92px;
  color: var(--ink);
  min-height: 20px;
}
.clip-row .mini-num {
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--surface);
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 1px 4px;
  width: 62px;
  min-height: 20px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.clip-row .mini-num:focus, .clip-row .mini-select:focus { border-color: var(--clipc); outline: 1px solid var(--clipc); }
.clip-row .mini-num.is-invalid { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.clip-row .num-wrap { display: inline-flex; align-items: center; gap: 2px; }
.clip-row .num-wrap .suffix { font-family: var(--mono); font-size: 9px; color: var(--ink-3); }
.clip-row .speed-fields { display: inline-flex; align-items: center; gap: 3px; }
.clip-row .mini-num.speed { width: 47px; text-align: center; }
.clip-row .ratio {
  font-family: var(--mono); font-size: 9px; color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; line-height: 15px;
  font-variant-numeric: tabular-nums;
}
.clip-row .ratio.fast { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.clip-row .ratio.slow { color: var(--src); border-color: color-mix(in srgb, var(--src) 40%, var(--line)); }
.clip-row.is-flash, .src-row.is-flash { animation: flash-bg 1.3s ease-out; }
@keyframes flash-bg { 0% { background: var(--warn-soft); } 100% { background: transparent; } }
.wchip.is-flash { animation: flash-chip 1.3s ease-out; }
@keyframes flash-chip { 0% { background: var(--warn-soft); border-color: var(--warn); } 100% { } }
.clip-row .ord {
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-3);
  letter-spacing: 0.05em;
}
.clip-row .cid {
  font-family: var(--mono); font-size: 11.5px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.clip-row .dur { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.clip-row .body { min-width: 0; }
.clip-row .line { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; color: var(--ink-2); }
.clip-row .line + .line { margin-top: 2px; }
.clip-row .arr { color: var(--ink-3); }
.clip-row .bar {
  position: relative;
  height: 5px;
  border-radius: 3px;
  background: var(--surface-3);
  margin-top: 5px;
  overflow: hidden;
}
.clip-row .bar > i {
  position: absolute; top: 0; bottom: 0;
  background: var(--clipc);
  opacity: .55;
  border-radius: 2px;
}
.clip-row .bar > i.cut { opacity: 1; }
.clip-row .actions { display: flex; gap: 3px; margin-top: 4px; opacity: .55; transition: opacity .1s; }
.clip-row:hover .actions, .clip-row:focus-within .actions { opacity: 1; }
.clip-row .act {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 3px;
  width: 22px; height: 21px;
  display: grid; place-items: center;
  font-size: 11px; color: var(--ink-2);
  line-height: 1;
}
.clip-row .act:hover { border-color: var(--ink-3); color: var(--ink); }
.clip-row .act.del:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.clip-row .act:disabled { opacity: .3; cursor: not-allowed; }
.gap-swatch {
  display: inline-block; width: 8px; height: 8px; border-radius: 2px;
  border: 1px dashed var(--ink-3);
}

/* ---------- Output rows ---------- */
.out-row {
  position: relative;
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  gap: 0 9px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  align-items: start;
  border-left: 3px solid transparent;
}
.out-row:hover { background: var(--out-soft); }
.out-row.is-active { background: var(--out-soft); border-left-color: var(--outc); }
.out-row.is-overlap { box-shadow: inset 0 -2px 0 var(--warn); }
.out-row .tc {
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-3);
  line-height: 1.4; font-variant-numeric: tabular-nums;
}
.out-row .tc b { display: block; color: var(--outc); font-weight: 500; font-size: 10px; }
.out-row .body { min-width: 0; }
.out-row .text { font-size: var(--size-md); line-height: 1.42; word-break: break-word; }
.out-row .text .w { border-radius: 3px; padding: 0 1px; }
.out-row .text .w.sel { background: var(--outc); color: var(--surface); }
.out-row .sub {
  margin-top: 2px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-3);
}
.out-row .ovflag {
  font-family: var(--mono); font-size: 9px; color: var(--warn);
  border: 1px solid var(--warn); border-radius: 3px; padding: 0 4px; line-height: 15px;
  background: var(--warn-soft);
  white-space: nowrap;
}
.empty-row { padding: 10px 12px; color: var(--ink-3); font-size: var(--size-sm); }
.empty-state { padding: 22px 16px; text-align: center; color: var(--ink-3); font-size: var(--size-sm); line-height: 1.65; }
.empty-state strong { display:block; color: var(--ink-2); font-size: var(--size-md); margin-bottom: 3px; }

/* ---------- Output timeline overview ---------- */
.otimeline {
  position: relative;
  padding: 7px 10px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.otrack {
  position: relative;
  height: 26px;
  border-radius: 4px;
  background: var(--surface-3);
  overflow: hidden;
  cursor: crosshair;
}
.otrack .seg {
  position: absolute; top: 0; bottom: 0;
  border-right: 1px solid color-mix(in srgb, var(--bg) 65%, transparent);
  min-width: 1px;
}
.otrack .seg.gap {
  background: repeating-linear-gradient(135deg, var(--surface-3) 0 5px, color-mix(in srgb, var(--ink-3) 18%, transparent) 5px 10px);
}
.otrack .seg.used { background: color-mix(in srgb, var(--clipc) 55%, var(--surface)); }
.otrack .seg.used[data-src="0"] { filter: hue-rotate(0deg); }
.otrack .seg.is-active { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 2; }
.otrack .seg.is-bad { background: repeating-linear-gradient(45deg, var(--danger-soft) 0 4px, var(--danger) 4px 5px); }
.otrack .playhead { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--accent); pointer-events: none; z-index: 3; }
.otimeline .scale {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 9px; color: var(--ink-3);
  margin-top: 3px; font-variant-numeric: tabular-nums;
}

/* ---------- Trace rail ---------- */
.trace {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  min-height: 118px;
  overflow: hidden;
}
.trace-head {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 8px 13px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.trace-head .eyebrow { font-size: 9.5px; }
.trace-head h3 { margin: 0; font-size: var(--size-sm); font-weight: 600; }
.trace-head .hint { font-size: var(--size-xs); color: var(--ink-3); margin-left: auto; }
.trace-head .spacer { margin-left: auto; }
.trace-tab {
  border: 1px solid transparent;
  background: transparent;
  border-radius: var(--radius-sm);
  padding: 3px 9px;
  font-size: var(--size-sm);
  font-family: var(--mono);
  color: var(--ink-2);
  min-height: 25px;
}
.trace-tab:hover { background: var(--surface-3); }
.trace-tab.is-on { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sm); }
.modal-note {
  margin: 0 0 10px;
  font-size: var(--size-xs);
  color: var(--ink-3);
  line-height: 1.55;
}
.rules { display: flex; flex-direction: column; gap: 0; }
.rule {
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr);
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: var(--size-sm);
}
.rule:last-child { border-bottom: 0; }
.rule-k { font-family: var(--mono); font-size: 10.5px; color: var(--accent); padding-top: 2px; }
.rule-v { line-height: 1.55; }
.trace-body { padding: 11px 13px 13px; }
.chain {
  display: flex;
  align-items: stretch;
  gap: 0;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}
.chain-node {
  flex: none;
  width: 196px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  padding: 7px 9px;
  display: flex; flex-direction: column; gap: 3px;
  min-width: 0;
  position: relative;
}
.chain-node + .chain-node { margin-left: 26px; }
.chain-node + .chain-node::before {
  content: "→";
  position: absolute; left: -20px; top: 50%;
  transform: translateY(-50%);
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 13px;
}
.chain-node .cn-k {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
  color: var(--ink-3); text-transform: uppercase;
}
.chain-node.src { border-top: 2px solid var(--src); }
.chain-node.word { border-top: 2px solid var(--src); }
.chain-node.clip { border-top: 2px solid var(--clipc); }
.chain-node.out { border-top: 2px solid var(--outc); }
.chain-node .cn-t {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chain-node .cn-d {
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  line-height: 1.45;
  word-break: break-all;
}
.chain-node .cn-txt { font-size: var(--size-sm); line-height: 1.35; word-break: break-word; }
.chain-node .cn-frac { font-family: var(--mono); font-size: 9px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chain-node .cn-frac code { background: var(--surface-2); padding: 0 3px; border-radius: 2px; }
.notice {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 13px;
  color: var(--ink-3);
  font-size: var(--size-sm);
}
.notice .nk { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }

/* ---------- Issues ---------- */
.issues { display: flex; flex-direction: column; gap: 0; }
.issue {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: start;
  padding: 7px 13px;
  border-bottom: 1px solid var(--line);
  font-size: var(--size-sm);
  cursor: pointer;
  text-align: left;
  background: transparent;
  border-left: 0; border-right: 0; border-top: 0;
  width: 100%;
}
.issue:hover { background: var(--surface-2); }
.issue:last-child { border-bottom: 0; }
.issue .mk {
  font-family: var(--mono); font-size: 11px; line-height: 1.4;
  width: 17px; height: 17px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--danger); background: var(--danger-soft);
  font-weight: 600;
}
.issue.warn .mk { color: var(--warn); background: var(--warn-soft); }
.issue .msg { min-width: 0; }
.issue .msg .where { font-family: var(--mono); font-size: 10px; color: var(--ink-3); display: block; }
.issue .msg .what { line-height: 1.4; }
.issue .path {
  font-family: var(--mono); font-size: 9px; color: var(--ink-3);
  white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
  align-self: center;
}
.issues-empty {
  padding: 14px 13px; color: var(--ok); font-size: var(--size-sm);
  display: flex; align-items: center; gap: 8px;
}
.issues-empty .tick { width: 17px; height: 17px; border-radius: 50%; background: var(--out-soft); color: var(--ok); display: grid; place-items: center; font-size: 11px; }

/* ---------- Modal / export ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: color-mix(in srgb, #060908 55%, transparent);
  backdrop-filter: blur(2px);
}
.modal {
  position: fixed; z-index: 41;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(860px, calc(100vw - 32px));
  max-height: min(86vh, 900px);
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 11px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}
.modal-head h2 { margin: 0; font-size: var(--size-lg); font-weight: 600; }
.modal-head .sub { font-size: var(--size-xs); color: var(--ink-3); font-family: var(--mono); }
.modal-head .x {
  margin-left: auto; border: 1px solid var(--line); background: var(--surface);
  width: 28px; height: 28px; border-radius: var(--radius-sm); font-size: 15px; line-height: 1;
  display: grid; place-items: center;
}
.modal-head .x:hover { background: var(--surface-2); }
.modal-tabs { display: flex; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.modal-tab {
  border: 1px solid transparent; border-bottom: 0;
  background: transparent; color: var(--ink-2);
  padding: 6px 13px; font-size: var(--size-sm); font-family: var(--mono);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  margin-bottom: -1px;
}
.modal-tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 600; }
.modal-warn {
  display: flex; flex-direction: column; gap: 2px;
  margin: 10px 14px 0;
  padding: 8px 11px;
  border: 1px solid var(--warn);
  background: var(--warn-soft);
  color: var(--warn);
  border-radius: var(--radius-sm);
  font-size: var(--size-xs);
  line-height: 1.5;
}
.modal-warn strong { font-size: var(--size-sm); }
.modal-body { padding: 12px 14px; overflow: auto; min-height: 0; }
.modal-body textarea {
  width: 100%; min-height: 340px; resize: vertical;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--ink);
  padding: 10px; white-space: pre; overflow-wrap: normal; overflow-x: auto;
  tab-size: 2;
}
.modal-body pre.text {
  margin: 0; padding: 10px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
  font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
  max-height: 52vh; overflow: auto; white-space: pre; tab-size: 2;
}
.modal-foot {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  padding: 10px 14px; border-top: 1px solid var(--line);
  background: var(--surface-2);
}
.modal-foot .note { font-size: var(--size-xs); color: var(--ink-3); font-family: var(--mono); }
.modal-foot .spacer { margin-left: auto; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: var(--size-xs); color: var(--ink-3); letter-spacing: .03em; }
.field input, .field select {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); padding: 6px 8px; font-size: var(--size-sm);
  font-family: var(--mono); min-height: 32px; min-width: 0;
}
.field input:focus, .field select:focus { border-color: var(--accent); outline: 1px solid var(--accent); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.seg-ctl button { border: 0; background: var(--surface); padding: 4px 9px; font-size: var(--size-xs); font-family: var(--mono); color: var(--ink-2); }
.seg-ctl button + button { border-left: 1px solid var(--line); }
.seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- Drop + toast ---------- */
.drop-overlay {
  position: fixed; inset: 12px; z-index: 60;
  border: 2px dashed var(--accent); border-radius: 14px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(3px);
  display: grid; place-items: center;
  pointer-events: none;
  text-align: center;
}
.drop-overlay strong { display: block; font-size: var(--size-lg); }
.drop-overlay span { font-family: var(--mono); font-size: var(--size-xs); color: var(--ink-3); }
.toast {
  position: fixed; z-index: 70;
  left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  border-radius: 999px;
  padding: 8px 17px;
  font-size: var(--size-sm);
  box-shadow: var(--shadow);
  max-width: calc(100vw - 32px);
  text-align: center;
}
.toast.bad { background: var(--danger); color: #fff; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .bench { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .panel[data-pane="out"] { grid-column: 1 / -1; }
  .panel[data-pane="out"] .vhost { max-height: min(40vh, 420px); }
}
@media (max-width: 860px) {
  .ledger { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pane-switch { display: flex; }
  .bench { grid-template-columns: minmax(0, 1fr); }
  .app:not([data-pane="source"]) .panel[data-pane="source"],
  .app:not([data-pane="clip"]) .panel[data-pane="clip"],
  .app:not([data-pane="out"]) .panel[data-pane="out"] { display: none; }
  .app[data-pane="out"] .panel[data-pane="out"] { grid-column: auto; }
  .vhost { max-height: none; }
  .top-actions { width: 100%; margin-left: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .top-actions .btn { min-height: 36px; padding-inline: 6px; }
  .top-actions #btnExport { grid-column: 3; }
  .brand-text p { display: none; }
  .doc-chip { order: 4; max-width: none; }
  .chain { flex-direction: column; gap: 0; }
  .chain-node { width: auto; }
  .chain-node + .chain-node { margin-left: 0; margin-top: 22px; }
  .chain-node + .chain-node::before { left: 50%; top: -18px; transform: translateX(-50%) rotate(90deg); }
}
@media (max-width: 480px) {
  .ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat-value { font-size: 16px; }
  .src-row { grid-template-columns: minmax(0, 1fr); }
  .src-row .tc { text-align: left; display: flex; gap: 8px; padding-top: 0; }
  .src-row .tc b { display: inline; }
  .form-grid { grid-template-columns: 1fr; }
  .modal { width: calc(100vw - 16px); max-height: 92vh; }
  .topbar { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<div class="app" id="app" data-pane="source">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="26" height="26" fill="none">
          <rect x="2.5" y="7" width="9" height="14" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="16.5" y="7" width="9" height="14" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11.5 10.5h5M11.5 14h5M11.5 17.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 2.4"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>剪点字幕台</h1>
        <p>按剪辑单裁切字幕 · 精确分数重排</p>
      </div>
    </div>
    <div class="doc-chip" id="docChip" title="当前载入的文档"><span class="dot" aria-hidden="true"></span><span id="docName">demo.json</span></div>
    <div class="top-actions">
      <button class="btn ghost" id="btnImport" type="button">导入 JSON</button>
      <button class="btn ghost" id="btnPaste" type="button">粘贴</button>
      <button class="btn ghost" id="btnSample" type="button">重载示例</button>
      <button class="btn ghost" id="btnRules" type="button">规则</button>
      <button class="btn primary" id="btnExport" type="button">导出</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
    </div>
  </header>

  <section class="ledger" id="ledger" aria-label="项目总览"></section>

  <div class="pane-switch" role="tablist" aria-label="面板切换">
    <button type="button" role="tab" data-goto="source" aria-selected="true">源字幕</button>
    <button type="button" role="tab" data-goto="clip" aria-selected="false">剪辑单</button>
    <button type="button" role="tab" data-goto="out" aria-selected="false">成片字幕</button>
  </div>

  <main class="bench">
    <section class="panel pane" data-pane="source" aria-label="源字幕">
      <header class="panel-head">
        <div class="ph-title"><span class="eyebrow">01 / SOURCE</span><h2>源字幕</h2></div>
        <div class="panel-tools" id="sourceTools"></div>
      </header>
      <div class="tabs" id="sourceTabs" role="tablist" aria-label="源素材"></div>
      <div class="ruler" id="sourceRuler"></div>
      <div class="vhost" id="sourceList" role="listbox" aria-label="源字幕列表"></div>
      <footer class="panel-foot" id="sourceFoot"></footer>
    </section>

    <section class="panel pane" data-pane="clip" aria-label="剪辑单">
      <header class="panel-head">
        <div class="ph-title"><span class="eyebrow">02 / EDIT</span><h2>剪辑单</h2></div>
        <div class="panel-tools">
          <button class="btn tiny" id="btnAddClip" type="button">+ 片段</button>
          <button class="btn tiny" id="btnAddGap" type="button">+ 空白</button>
          <button class="btn tiny icon" id="btnUndo" type="button" title="撤销 (Ctrl+Z)" aria-label="撤销">↶</button>
          <button class="btn tiny icon" id="btnRedo" type="button" title="重做 (Ctrl+Shift+Z)" aria-label="重做">↷</button>
        </div>
      </header>
      <div class="otimeline" id="clipTimeline"></div>
      <div class="vhost" id="clipList" aria-label="片段列表"></div>
      <footer class="panel-foot" id="clipFoot"></footer>
    </section>

    <section class="panel pane" data-pane="out" aria-label="成片字幕">
      <header class="panel-head">
        <div class="ph-title"><span class="eyebrow">03 / CONFORM</span><h2>成片字幕</h2></div>
        <div class="panel-tools" id="outTools"></div>
      </header>
      <div class="ruler oruler" id="outRuler"></div>
      <div class="vhost" id="outList" role="listbox" aria-label="成片字幕列表"></div>
      <footer class="panel-foot" id="outFoot"></footer>
    </section>
  </main>

  <section class="trace" id="trace" aria-live="polite" aria-label="追溯"></section>
</div>

<div class="drop-overlay" id="dropOverlay" hidden><div><strong>松开以载入 JSON</strong><span>sources + clips</span></div></div>
<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* 剪点字幕台 · exact rational conform engine
 * ------------------------------------------------------------------------
 * Runs in the browser (window.CaptionEngine) and in Node (module.exports).
 * Every internal time is an exact reduced fraction of milliseconds; the
 * only float-ish math is the integer screening pass used to find candidate
 * intersections quickly.
 *
 * Package rules implemented:
 *  - source-relative cue × same-source clip positive-length intersection

          cueId: cue.id,
          cueStart: cue.start,
          cueEnd: cue.end,
          clipIn: inMs,
          clipOut: outMs,
          speedP: p,
          speedQ: q,
          clipOutStart: t0,
          clipOutEnd: clipEndOut,
          cutStart: cutStart,
          cutEnd: cutEnd,
          start: t0.add(frac(cutStart - inMs).mul(scale)),
          end: t0.add(frac(cutEnd - inMs).mul(scale)),
          text: hasWords ? words.map(function (x) { return x.text; }).join(" ") : cue.text,
          words: words,
          hasWords: hasWords
        });
      }
      timeline = clipEndOut;
    });

    out.sort(function (a, b) {
      var c = a.start.cmp(b.start);
      if (c !== 0) return c;
      if (a.clipOrder !== b.clipOrder) return a.clipOrder - b.clipOrder;
      return compareCodeUnits(a.cueId, b.cueId);
    });

    var runningMax = null;
    var overlapCount = 0;
    out.forEach(function (r) {
      r.overlapsEarlier = runningMax !== null && r.start.cmp(runningMax) < 0;
      if (r.overlapsEarlier) overlapCount++;
      if (runningMax === null || r.end.cmp(runningMax) > 0) runningMax = r.end;
    });

    return {
      duration: timeline,
      cues: out,
      errors: errors,
      notes: notes,
      blocking: blocking,
      skippedClips: skippedClips,
      usedClips: usedClips,
      sourceById: ctx.byId,
      cueCount: out.length,
      overlapCount: overlapCount,
      spans: spans
    };
  }

  /* ------------------------------------------------------------------ *
   * Export
   * ------------------------------------------------------------------ */

  function pad(n, width) {
    var s = n.toString();
    while (s.length < width) s = "0" + s;
    return s;
  }

  function vttTime(ms) {
    var h = floorDiv(ms, 3600000n);
    var rest = ms - h * 3600000n;
    var m = rest / 60000n;
    rest -= m * 60000n;
    var s = rest / 1000n;
    var milli = rest - s * 1000n;
    return pad(h, 2) + ":" + pad(m, 2) + ":" + pad(s, 2) + "." + pad(milli, 3);
  }

  function sanitizeLine(s) {
    return String(s).replace(/\r\n|\r|\n/g, " ");
  }

  // A cue identifier may not contain "-->" or span lines. Ids are otherwise
  // passed through unchanged, since they are how a result is traced back.
  function sanitizeId(id, index) {
    var s = sanitizeLine(id).replace(/-->/g, "--").trim();
    return s || "cue-" + (index + 1);
  }

  function toWebVTT(result) {
    var lines = ["WEBVTT", ""];
    result.cues.forEach(function (cue, i) {
      lines.push(sanitizeId(cue.id, i));
      lines.push(vttTime(cue.start.floor()) + " --> " + vttTime(cue.end.ceil()));
      lines.push(sanitizeLine(cue.text));
      lines.push("");
    });
    return lines.join("\n");
  }

  function toJSON(result) {
    return {
      duration: result.duration.pair(),
      cues: result.cues.map(function (c) {
        return {
          id: c.id,
          clip_order: c.clipOrder,
          start: c.start.pair(),
          end: c.end.pair(),
          text: c.text,
          words: c.words.map(function (w) {
            return { text: w.text, start: w.start.pair(), end: w.end.pair() };
          })
        };
      })
    };
  }

  return {
    Frac: Frac,
    frac: frac,
    validateDoc: validateDoc,
    conform: conform,
    computeDuration: computeDuration,
    clipOutputLength: clipOutputLength,
    toWebVTT: toWebVTT,
    toJSON: toJSON,
    vttTime: vttTime
  };
});

<script>

 */
(function () {

    ],

      { id: "c1", source: "host", in: 0, out: 4000, speed: [1, 1] },

      { id: "c2", source: "guest", in: 200, out: 3000, speed: [3, 2] },
      { id: "c3", source: "host", in: 3000, out: 6500, speed: [1, 1] },
      { id: "c4", source: "guest", in: 200, out: 3000, speed: [1, 1] },
      { id: "beat", source: null, duration_ms: 500 },
      { id: "c5", source: "host", in: 6000, out: 9000, speed: [4, 3] },
      { id: "c6", source: "guest", in: 5000, out: 8800, speed: [2, 3] }
    ]
  };

  /* ================================================================== *
   * State
   * ================================================================== */

  var state = {
    doc: null,
    docName: "demo.json",
    result: null,
    errors: [],
    notes: [],
    byClip: new Map(),
    byCue: new Map(),
    activeSource: 0,
    activeClip: -1,
    selection: null,
    traceTab: "trace",
    undo: [],
    redo: [],
    lists: {}
  };

  /* ================================================================== *
   * Helpers
   * ================================================================== */

  function $(id) { return document.getElementById(id); }

  function el(tag, opts) {
    var n = document.createElement(tag);
    if (opts) {
      if (opts.class) n.className = opts.class;
      if (opts.text !== undefined && opts.text !== null) n.textContent = String(opts.text);
      if (opts.attrs) for (var a in opts.attrs) if (opts.attrs[a] !== null && opts.attrs[a] !== undefined) n.setAttribute(a, opts.attrs[a]);
      if (opts.style) n.style.cssText = opts.style;
      if (opts.data) for (var d in opts.data) n.dataset[d] = opts.data[d];
      if (opts.on) for (var ev in opts.on) n.addEventListener(ev, opts.on[ev]);
    }
    for (var i = 2; i < arguments.length; i++) append(n, arguments[i]);
    return n;
  }

  function append(n, c) {
    if (c === null || c === undefined) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(n, x); }); return; }
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }

  function clear(node) {
    // replaceChildren detaches in one operation; the old loop can throw when a
    // blur handler re-renders while the browser is still removing a focused node.
    if (typeof node.replaceChildren === "function") node.replaceChildren();

  }
  function pad2(v) { return String(v).padStart(2, "0"); }

  function uiTime(ms) {
    if (ms < 0n) ms = 0n;
    var h = ms / 3600000n;
    var mm = (ms % 3600000n) / 60000n;
    var ss = (ms % 60000n) / 1000n;
    var mmm = ms % 1000n;
    var base = pad2(mm) + ":" + pad2(ss) + "." + String(mmm).padStart(3, "0");

  }

  function floorUi(f) { return uiTime(f.floor()); }
  function ceilUi(f) { return uiTime(f.ceil()); }
  function msUi(ms) { return uiTime(BigInt(ms)); }
  function fracText(f) { return f.n + "/" + f.d; }

  function fracDecimal(f, digits) {
    digits = digits === undefined ? 3 : digits;
    var scale = 1n;
    for (var i = 0; i < digits; i++) scale *= 10n;
    var neg = f.n < 0n;
    var n = neg ? -f.n : f.n;
    var q = (n * scale) / f.d;
    var s = q.toString();
    while (s.length <= digits) s = "0" + s;
    return (neg ? "-" : "") + s.slice(0, s.length - digits) + "." + s.slice(s.length - digits);
  }

  function fracApprox(f) { return "≈" + fracDecimal(f, 3); }

  function sourceAt(si) { return state.doc.sources && state.doc.sources[si]; }
  function sourceLabel(si) {
    var s = sourceAt(si);
    return s && typeof s.id === "string" ? s.id : "源 #" + (si + 1);
  }
  function cueAt(si, ci) {
    var s = sourceAt(si);
    return s && Array.isArray(s.cues) ? s.cues[ci] : null;
  }
  function cueLabel(si, ci) {
    var c = cueAt(si, ci);
    return c && typeof c.id === "string" ? c.id : "#" + (ci + 1);
  }
  function durOf(src) {
    return src && typeof src.duration_ms === "number" && src.duration_ms >= 0 ? src.duration_ms : 0;
  }
  function isPlainObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
  function clone(v) { return JSON.parse(JSON.stringify(v)); }
  function countWords(doc) {
    var n = 0;
    (doc.sources || []).forEach(function (s) {
      if (!s || !Array.isArray(s.cues)) return;
      s.cues.forEach(function (c) { if (c && Array.isArray(c.words)) n += c.words.length; });
    });

  }
  function countCues(doc) {
    var n = 0;
    (doc.sources || []).forEach(function (s) { if (s && Array.isArray(s.cues)) n += s.cues.length; });
    return n;
  }

  /* ================================================================== *
   * Document lifecycle
   * ================================================================== */

  function normalizeDoc(raw) {

    if (!isPlainObj(doc)) throw new Error("根节点不是对象");
    if (!Array.isArray(doc.sources)) doc.sources = [];
    if (!Array.isArray(doc.clips)) doc.clips = [];

  }

  function loadDoc(raw, name, opts) {
    opts = opts || {};
    var doc;
    try { doc = normalizeDoc(raw); }
    catch (e) { toast("JSON 无法使用：" + e.message, true); return false; }
    state.doc = doc;
    state.docName = name || "导入.json";
    state.undo = [];
    state.redo = [];
    state.activeSource = 0;
    state.activeClip = -1;
    state.selection = null;
    state.traceTab = "trace";
    $("docName").textContent = state.docName;
    $("docChip").classList.toggle("is-custom", state.docName !== "demo.json" && state.docName !== "tour.json");
    recompute();
    if (state.result.cues.length) selectOut(0);
    else if (state.doc.clips.length) selectClip(0);
    else if (state.doc.sources.length && sourceAt(0) && Array.isArray(sourceAt(0).cues) && sourceAt(0).cues.length) selectSourceCue(0, 0);

    if (!opts.quiet) {
      var n = state.errors.length;
      toast(n ? "已载入 · " + n + " 个问题待处理" : "已载入 " + state.docName, false);
    }
    persist();
    return true;
  }

  function persist() {
    try {
      localStorage.setItem("caption-conformer:doc", JSON.stringify({ name: state.docName, doc: state.doc }));
    } catch (e) { /* storage unavailable; page still works */ }
  }

  function restore() {
    try {
      var stored = localStorage.getItem("caption-conformer:doc");
      if (!stored) return false;
      var parsed = JSON.parse(stored);
      if (!parsed || !parsed.doc) return false;
      var doc = normalizeDoc(parsed.doc);
      loadDoc(doc, parsed.name || "上次的剪辑单.json", { quiet: true });
      return true;
    } catch (e) { return false; }
  }

  function undoable(fn) {
    state.undo.push(JSON.stringify(state.doc));
    if (state.undo.length > 60) state.undo.shift();
    state.redo.length = 0;
    fn();
    recompute();
    persist();
  }

  function undo() {
    if (!state.undo.length) return;
    state.redo.push(JSON.stringify(state.doc));
    state.doc = JSON.parse(state.undo.pop());
    state.selection = null;
    recompute();
    persist();
    toast("已撤销", false, 1200);
  }

  function redo() {
    if (!state.redo.length) return;
    state.undo.push(JSON.stringify(state.doc));
    state.doc = JSON.parse(state.redo.pop());
    state.selection = null;
    recompute();
    persist();
    toast("已重做", false, 1200);
  }

  function updateUndoButtons() {
    $("btnUndo").disabled = state.undo.length === 0;
    $("btnRedo").disabled = state.redo.length === 0;
  }

  /* ================================================================== *
   * Conform + indexes
   * ================================================================== */

  function recompute() {
    // Remember what the selection pointed at by stable identity, then re-find
    // it: edits can reorder results without the reader having moved.
    var anchor = null;
    var sel = state.selection;
    if (sel) {
      if (sel.type === "out" || sel.type === "word") {
        var prev = state.result && state.result.cues[sel.index];
        if (prev) anchor = { kind: "out", id: prev.id, wordIndex: sel.type === "word" ? sel.wordIndex : undefined };
      } else if (sel.type === "clip") {
        var pc = state.doc.clips[sel.index];
        if (pc && typeof pc.id === "string") anchor = { kind: "clip", id: pc.id };
      }
    }

    state.result = E.conform(state.doc, { tolerant: true });
    state.errors = state.result.errors || [];
    state.notes = state.result.notes || [];
    buildIndexes();

    if (anchor) {
      if (anchor.kind === "out") {
        var found = -1;
        for (var i = 0; i < state.result.cues.length; i++) {
          if (state.result.cues[i].id === anchor.id) { found = i; break; }
        }
        if (found >= 0) {
          state.selection = anchor.wordIndex === undefined
            ? { type: "out", index: found }
            : { type: "word", index: found, wordIndex: anchor.wordIndex };
        } else {
          state.selection = null;
        }
      } else {
        var ci = -1;
        for (var j = 0; j < state.doc.clips.length; j++) {
          if (state.doc.clips[j] && state.doc.clips[j].id === anchor.id) { ci = j; break; }
        }
        state.selection = ci >= 0 ? { type: "clip", index: ci } : null;
        if (ci >= 0) state.activeClip = ci;
      }
