<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Separating Voxel Foundry — 保守体素化与空腔壳层核对</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div>
    <h1>Separating Voxel Foundry</h1>
    <div class="sub">保守体素化 · 6/26 分离 SAT · 对角漏孔定位 · 广义绕数空腔分类</div>
  </div>
  <div class="spacer"></div>
  <select id="sampleSelect" title="加载内置样例"></select>
  <button id="btnLoad">导入 JSON</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
  <button id="btnExport" class="primary">导出统计 JSON</button>
</header>

<main>
  <aside class="sidebar">
    <div class="section">
      <h3>体素化参数</h3>
      <div class="kv">
        <span class="muted">网格 dims</span><b id="kvDims">—</b>
        <span class="muted">物理 spacing</span><b id="kvSpacing">—</b>
        <span class="muted">origin</span><b id="kvOrigin">—</b>
      </div>
      <div class="row">
        <label>分离模式</label>
        <select id="selMode" class="grow">
          <option value="6-separating">6 分离（薄壳 / 6-Minimal）</option>
          <option value="26-separating">26 分离（厚壳 / Supercover）</option>
        </select>
      </div>
      <div class="row">
        <label>漫水连通</label>
        <select id="selFlood" class="grow">
          <option value="6">6 连通</option>
          <option value="26">26 连通</option>
        </select>
      </div>
      <div class="small" id="modeHint"></div>
    </div>

    <div class="section">
      <h3>三角形分组（点击启停）</h3>
      <div class="groups scrollbox" id="groupList"></div>
    </div>

    <div class="section">
      <h3>框选编辑（切片上拖拽）</h3>
      <div class="row">
        <button id="btnCarve" class="grow">挖空 BOX_CARVE</button>
        <button id="btnFill" class="grow">填充 BOX_FILL</button>
      </div>
      <div class="row">
        <label>填充材质</label>
        <input type="number" id="fillMaterial" min="1" max="16" value="1">
        <span class="small">1..16</span>
      </div>
      <div class="row">
        <button id="btnUndo" class="grow">↶ 撤销</button>
        <button id="btnRedo" class="grow">↷ 重做</button>
      </div>
      <div class="row">
        <button id="btnVerify" class="grow tiny">增量/全量一致性自检</button>
      </div>
      <div class="small" id="editStack">操作栈：0 / 0</div>
    </div>

    <div class="section">
      <h3>显示</h3>
      <div class="row checkline"><input type="checkbox" id="chkMat" checked><label style="min-width:0">表面按材质着色</label></div>
      <div class="row checkline"><input type="checkbox" id="chkSurface3d" checked><label style="min-width:0">3D 显示表面</label></div>
      <div class="row checkline"><input type="checkbox" id="chkSolid3d" checked><label style="min-width:0">3D 显示实体内部</label></div>
      <div class="row checkline"><input type="checkbox" id="chkCavity3d" checked><label style="min-width:0">3D 显示嵌套空腔</label></div>
      <div class="row checkline"><input type="checkbox" id="chkWire"><label style="min-width:0">3D 三角形线框</label></div>
      <div class="row checkline"><input type="checkbox" id="chkLeak" checked><label style="min-width:0">标记对角漏孔</label></div>
    </div>

    <div class="section">
      <h3>统计</h3>
      <div class="kv" id="statsBox"></div>
      <div class="small" id="timingBox"></div>
    </div>

    <div class="section">
      <h3>图例</h3>
      <div class="legend">
        <span><i class="swatch" style="background:#e8e2d0"></i>SURFACE</span>
        <span><i class="swatch" style="background:#1b2538"></i>EXTERIOR</span>
        <span><i class="swatch" style="background:#7c6cf0"></i>SOLID</span>
        <span><i class="swatch" style="background:#27c093"></i>CAVITY</span>
        <span><i class="swatch" style="background:#ff5470"></i>漏孔</span>
      </div>
    </div>
  </aside>

  <section class="view">
    <div class="tabs">
      <button data-tab="slice" class="active">三轴切片</button>
      <button data-tab="3d">三维预览</button>
      <button data-tab="comps">封闭连通块 / 漏孔</button>
    </div>
    <div class="view-body">
      <div id="paneSlice" style="position:absolute;inset:0;display:flex;flex-direction:column">
        <div class="row" style="padding:8px 12px;flex:0 0 auto">
          <div class="row" style="margin:0">
            <button class="tiny" data-axis="0">X 切片</button>
            <button class="tiny" data-axis="1">Y 切片</button>
            <button class="tiny active" data-axis="2">Z 切片</button>
          </div>
          <input type="range" id="sliceRange" class="grow" style="flex:1">
          <span class="pill" id="sliceLabel">z = 0</span>
        </div>
        <div style="flex:1;position:relative">
          <canvas id="sliceCanvas"></canvas>
          <div class="slice-hud" id="sliceHud"></div>
          <div class="slice-info" id="sliceInfo" hidden></div>
        </div>
      </div>
      <div id="pane3d" style="position:absolute;inset:0;display:none">
        <canvas id="canvas3d"></canvas>
        <div class="view3d-hud">
          左键拖拽旋转 · Shift+拖拽平移 · 滚轮缩放 · 双击复位<br>
          <span id="renderMode"></span>
        </div>
      </div>
      <div id="paneComps" style="position:absolute;inset:0;display:none;overflow:auto;padding:14px">
        <h3 style="margin:0 0 8px;color:var(--accent2)">封闭连通块（按代表体素字典序）</h3>
        <div class="scrollbox"><table id="compTable"></table></div>
        <h3 style="margin:16px 0 8px;color:var(--accent2)">对角漏孔 diagonalLeaks</h3>
        <div class="small" id="leakSummary"></div>
        <div class="scrollbox" style="margin-top:8px;max-height:300px"><table id="leakTable"></table></div>
      </div>
    </div>
  </section>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script src="data/samples.js"></script>
<script src="js/math3d.js"></script>
<script src="js/validate.js"></script>
<script src="js/engine.js"></script>
<script src="js/sliceview.js"></script>
<script src="js/view3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
