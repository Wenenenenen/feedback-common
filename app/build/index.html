<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>RTS 生产时钟验证器</title>
<style>
/* ---- 设计令牌：指挥台风格，冷灰中性 + 琥珀强调，双主题 ---- */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eef1f4;
  --border: #d6dce2;
  --fg: #1a2330;
  --fg-soft: #55606e;
  --muted: #85909c;
  --accent: #b4631a;          /* 琥珀：主操作/当前进度 */
  --accent-soft: #f3e2cf;
  --teal: #176b6b;            /* 资源/完成 */
  --teal-soft: #d6ecec;
  --danger: #a32d2d;
  --danger-soft: #f3d9d9;
  --warn: #8a6a12;
  --warn-soft: #f4ead0;
  --shadow: 0 1px 2px rgba(20,30,45,.06), 0 4px 14px rgba(20,30,45,.05);
  --mono: "SFMono-Regular", ui-monospace, "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --surface: #1a212a; --surface-2: #222b35; --border: #2e3945;
    --fg: #e6ebf1; --fg-soft: #aeb8c3; --muted: #76818d;
    --accent: #e0954f; --accent-soft: #3a2c1c;
    --teal: #5fc0be; --teal-soft: #16302f;
    --danger: #e08585; --danger-soft: #3a1f1f;
    --warn: #d8b75c; --warn-soft: #332c17;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1a212a; --surface-2: #222b35; --border: #2e3945;
  --fg: #e6ebf1; --fg-soft: #aeb8c3; --muted: #76818d;
  --accent: #e0954f; --teal: #5fc0be; --teal-soft: #16302f;
  --accent-soft: #3a2c1c; --danger: #e08585; --danger-soft: #3a1f1f;
  --warn: #d8b75c; --warn-soft: #332c17;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[data-num], .mono { font-variant-numeric: tabular-nums; font-family: var(--mono); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, select, input { font: inherit; color: inherit; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.warn-text { color: var(--warn); font-weight: 600; }

/* ---- 顶部控制条 ---- */
header.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--border);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-shadow: var(--shadow);
}
.topbar-inner { max-width: 1440px; margin: 0 auto; padding-block: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 180px; }
.brand h1 { font-size: 17px; letter-spacing: .2px; }
.brand .case { font-size: 12px; color: var(--fg-soft); font-family: var(--mono); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tick-readout { display: flex; gap: 14px; align-items: baseline; padding: 6px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
.tick-readout b { font-family: var(--mono); font-size: 18px; color: var(--accent); }
.tick-readout span { font-size: 12px; color: var(--fg-soft); }

.btn { border: 1px solid var(--border); background: var(--surface); color: var(--fg);
  border-radius: 7px; padding: 7px 12px; cursor: pointer; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.teal { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.mini { padding: 4px 9px; font-size: 12.5px; border-radius: 6px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sel, input[type="text"], input[type="number"] {
  border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-width: 0;
}

/* ---- 主体网格 ---- */
main { max-width: 1440px; margin: 0 auto; padding-block: 18px; display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.panel > .panel-h { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.panel > .panel-h h2 { font-size: 14px; letter-spacing: .3px; text-transform: uppercase; color: var(--fg-soft); }
.panel-b { padding: 14px 16px; }

/* ---- 状态条 ---- */
.stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.stat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.stat .v { font-family: var(--mono); font-size: 17px; margin-top: 2px; }
.pop-track { height: 6px; background: var(--surface-2); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.pop-fill { height: 100%; background: var(--teal); transition: width .15s; }
.pop-fill.warn { background: var(--danger); }
#pendingMult { background: var(--warn-soft); color: var(--warn); border-radius: 7px; padding: 6px 10px; font-size: 12.5px; margin-bottom: 10px; }

#resourceGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.res-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; }
.res-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.res-val { font-family: var(--mono); font-size: 18px; margin-top: 1px; }
.res-cap { color: var(--muted); font-size: 12.5px; }
.res-track { height: 5px; background: var(--surface); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.res-fill { height: 100%; background: var(--teal); }

/* ---- 建筑卡片 ---- */
#buildingList { display: grid; gap: 12px; }
.building { border: 1px solid var(--border); border-radius: 11px; background: var(--surface); overflow: hidden; }
.building.paused { border-style: dashed; opacity: .92; }
.building.destroyed { background: var(--surface-2); }
.building > header { display: flex; justify-content: space-between; gap: 10px; align-items: center;
  padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.b-title { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.b-id { font-family: var(--mono); font-weight: 700; font-size: 14.5px; }
.b-speed { font-size: 12px; color: var(--fg-soft); font-family: var(--mono); }
.b-actions { display: flex; gap: 6px; }
.queue { list-style: none; margin: 0; padding: 10px 14px; display: grid; gap: 8px; }
.q-item { border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; background: var(--surface); min-width: 0; }
.q-item.ready { border-color: var(--warn); background: var(--warn-soft); }
.q-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.q-name { font-weight: 600; font-size: 13.5px; }
.q-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-soft); margin-top: 3px; flex-wrap: wrap; }
.q-track { height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 7px; }
.q-fill { height: 100%; background: var(--accent); transition: width .15s; }
.q-item.ready .q-fill { background: var(--warn); }
.q-cost { margin-top: 6px; }
.q-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.chip.muted { background: var(--surface-2); color: var(--muted); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.enq-row { display: flex; gap: 8px; padding: 0 14px 12px; flex-wrap: wrap; }
.enq-row .sel { flex: 1; min-width: 120px; }

/* ---- 侧栏 ---- */
.side { display: grid; gap: 16px; align-content: start; }
#logBody { max-height: 460px; overflow: auto; font-family: var(--mono); font-size: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.log-row { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; padding: 5px 9px; border-bottom: 1px solid var(--border); align-items: baseline; }
.log-row:last-child { border-bottom: 0; }
.log-tick { color: var(--accent); font-weight: 700; }
.log-src { color: var(--muted); }
.log-body { min-width: 0; overflow-wrap: anywhere; }
.k-rej .log-body, .k-block .log-body { color: var(--warn); }
.k-done .log-body b { color: var(--teal); }
.log-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#catBox { display: grid; gap: 6px; max-height: 220px; overflow: auto; }
.cat-line { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; font-size: 12.5px; padding: 5px 8px; background: var(--surface-2); border-radius: 7px; }
.pend-row { font-size: 12.5px; padding: 5px 8px; background: var(--accent-soft); border-radius: 7px; margin-bottom: 5px; }
.world-form { display: grid; gap: 8px; }
.world-form .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.world-form input, .world-form select { flex: 1; min-width: 80px; }

/* ---- toast ---- */
#toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px);
  background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: 88vw; z-index: 50; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.danger { background: var(--danger); color: #fff; }

@media (max-width: 640px) {
  .topbar-inner { flex-direction: column; align-items: stretch; }
  .controls { justify-content: space-between; }
  .log-row { grid-template-columns: auto 1fr; }
  .log-src { display: none; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>RTS 生产时钟验证器</h1>
      <span class="case" id="caseName">—</span>
    </div>
    <div class="tick-readout">
      <div><span>tick</span> <b id="tickVal">0</b></div>
      <div><span>逻辑时间</span> <b id="msVal">0 ms</b></div>
      <div><span>全局倍率</span> <b id="multVal">1</b></div>
      <div><span>人口</span> <b id="popVal">0/0</b>
        <div class="pop-track" style="min-width:90px"><div class="pop-fill" id="popBar" style="width:0%"></div></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="stepBtn" title="推进一个 100ms 逻辑步（空格）">单步 →</button>
      <button class="btn" id="ffBtn">快进 ▶</button>
      <button class="btn" id="run10Btn">+10</button>
      <button class="btn" id="run100Btn">+100</button>
      <button class="btn danger" id="resetBtn">重置</button>
    </div>
  </div>
</header>

<main>
  <section class="col-main">
    <div id="pendingMult" hidden></div>
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-h"><h2>资源账本（当前持有 / 仓上限）</h2></div>
      <div class="panel-b"><div id="resourceGrid"></div></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>建筑与生产队列（按 ID 升序处理）</h2></div>
      <div class="panel-b">
        <div id="buildingList"></div>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="panel">
      <div class="panel-h"><h2>场景与存档</h2></div>
      <div class="panel-b world-form">
        <select class="sel" id="caseSelect"></select>
        <label class="small muted">载入用例 JSON
          <input type="file" id="fileInput" accept=".json,application/json" style="margin-top:4px">
        </label>
        <div class="row">
          <button class="btn mini" id="saveBtn">保存进度</button>
          <button class="btn mini" id="restoreBtn">恢复进度</button>
        </div>
        <div class="row">
          <button class="btn mini teal" id="exportSnapBtn">导出快照 JSON</button>
          <button class="btn mini teal" id="exportLogBtn">导出结算日志</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-h"><h2>世界编辑</h2></div>
      <div class="panel-b world-form">
        <div class="row">
          <input type="text" id="newBid" placeholder="新建筑 ID" style="flex:2">
          <input type="number" id="newSpeedP" placeholder="p" value="1" style="flex:1">
          <span class="mono">/</span>
          <input type="number" id="newSpeedQ" placeholder="q" value="1" style="flex:1">
          <button class="btn mini primary" id="addBuildingBtn">新增建筑</button>
        </div>
        <div class="row">
          <input type="text" id="grantRes" placeholder="资源名" style="flex:1">
          <input type="number" id="grantAmt" placeholder="数量" min="0" style="flex:1">
          <button class="btn mini" id="grantBtn">发放资源</button>
        </div>
        <div class="row">
          <input type="number" id="releaseAmt" placeholder="释放人口" min="0" style="flex:1">
          <button class="btn mini" id="releaseBtn">释放人口</button>
        </div>
        <p class="muted small" id="pendingBox"></p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-h">
        <h2>逐步账本</h2>
        <div class="log-tools">
          <select class="sel mini" id="logFilter" style="padding:4px 8px">
            <option value="all">全部</option>
            <option value="work">工作量</option>
            <option value="resource">资源/人口</option>
            <option value="flow">完成/阻塞/指令</option>
          </select>
          <span class="muted small" id="logCount"></span>
        </div>
      </div>
      <div class="panel-b">
        <div id="logBody"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-h"><h2>项目目录 catalog</h2></div>
      <div class="panel-b"><div id="catalogBox" style="display:grid;gap:6px"></div></div>
    </div>
  </aside>
</main>

<div id="toast"></div>
<script>
(function(){
"use strict";
// ===== fraction.js =====
// 精确有理数：全部工作量/速度/倍率用 BigInt 分数，杜绝浮点近似。
// 分数以最简形式保存，分母恒为正数；零保存为 0/1。

class Fraction {
  constructor(n, d = 1n) {
    if (typeof n === 'number') n = BigInt(n);
    if (typeof d === 'number') d = BigInt(d);
    if (d === 0n) throw new Error('fraction denominator is zero');
    if (n === 0n) d = 1n;
    if (d < 0n) { n = -n; d = -d; }
    if (n !== 0n) {
      const g = gcdAbs(n, d);
      n /= g;
      d /= g;
    }
    this.n = n;
    this.d = d;
  }

  static ZERO = new Fraction(0n, 1n);
  static ONE = new Fraction(1n, 1n);

  static from(x) {
    if (x instanceof Fraction) return x;
    if (Array.isArray(x)) return new Fraction(BigInt(x[0]), BigInt(x[1]));
    if (typeof x === 'bigint') return new Fraction(x, 1n);
    if (typeof x === 'number') return new Fraction(BigInt(x), 1n);
    throw new Error(`cannot make Fraction from ${x}`);
  }

  add(o) {
    o = Fraction.from(o);
    return new Fraction(this.n * o.d + o.n * this.d, this.d * o.d);
  }
  sub(o) {
    o = Fraction.from(o);
    return new Fraction(this.n * o.d - o.n * this.d, this.d * o.d);
  }
  mul(o) {
    o = Fraction.from(o);
    return new Fraction(this.n * o.n, this.d * o.d);
  }
  div(o) {
    o = Fraction.from(o);
    return new Fraction(this.n * o.d, this.d * o.n);
  }
  neg() { return new Fraction(-this.n, this.d); }

  cmp(o) {
    o = Fraction.from(o);
    const l = this.n * o.d, r = o.n * this.d;
    return l < r ? -1 : l > r ? 1 : 0;
  }
  lt(o) { return this.cmp(o) < 0; }
  lte(o) { return this.cmp(o) <= 0; }
  gt(o) { return this.cmp(o) > 0; }
  gte(o) { return this.cmp(o) >= 0; }
  eq(o) { return this.cmp(o) === 0; }
  isZero() { return this.n === 0n; }
  isPositive() { return this.n > 0n; }

  // 向下取整（用于按工作量比例的资源退款）
  floor() {
    let q = this.n / this.d;
    if (this.n < 0n && this.n % this.d !== 0n) q -= 1n;
    return q;
  }

  // 序列化为 [p, q]，数字字符串保证 BigInt 无损
  toJSON() { return [this.n.toString(), this.d.toString()]; }

  // 展示用：精确分数串，以及最多保留若干位的十进制（仅显示用，不参与计算）
  toString() {
    return this.d === 1n ? this.n.toString() : `${this.n}/${this.d}`;
  }
  toDecimal(maxDigits = 6) {
    const neg = this.n < 0n;
    const an = neg ? -this.n : this.n;
    const whole = an / this.d;
    let rem = an % this.d;
    if (rem === 0n) return (neg ? '-' : '') + whole.toString();
    let digits = '';
    let i = 0;
    while (rem !== 0n && i < maxDigits) {
      rem *= 10n;
      digits += (rem / this.d).toString();
      rem %= this.d;
      i++;
    }
    let s = whole.toString() + '.' + digits;
    if (rem !== 0n) s += '…';
    return (neg ? '-' : '') + s;
  }

  // 精确浮点（仅用于进度条等展示，不回写状态）
  toNumber() { return Number(this.n) / Number(this.d); }
}

function gcdAbs(a, b) {
  if (a < 0n) a = -a;
  if (b < 0n) b = -b;
  while (b) { [a, b] = [b, a % b]; }
  return a;
}


// ===== engine.js =====
// RTS 生产队列模拟引擎 —— 固定 100ms 逻辑步、精确有理数账本。
// 规则来源：样例包 说明.txt。所有工作量/速度/倍率均为 Fraction（BigInt），
// 资源与人口为整数 BigInt，分数累计绝不经过浮点。


const MAX_BUILDINGS = 32;
const MAX_QUEUE = 8;

// ---------- 输入校验与构造 ----------

function asInt(v, name) {
  if (typeof v === 'number' && Number.isInteger(v)) return BigInt(v);
  if (typeof v === 'string' && /^-?\d+$/.test(v)) return BigInt(v);
  throw new Error(`参数 ${name} 必须是整数`);
}
function asNonNegInt(v, name) {
  const x = asInt(v, name);
  if (x < 0n) throw new Error(`参数 ${name} 不能为负`);
  return x;
}
function asPosFraction(v, name) {
  const f = Fraction.from(v);
  if (!f.isPositive()) throw new Error(`参数 ${name} 必须为正有理数`);
  return f;
}

class Engine {
  // raw: 用例 JSON（resources/catalog/commands 等）
  constructor(raw) {
    this.events = [];
    this.tick = 0;
    this.commandSeqCounter = new Map(); // tick -> 已用 seq（含预置与实时指令）

    this.resources = new Map();
    this.resourceCaps = new Map();
    for (const [k, v] of Object.entries(raw.resources ?? {})) {
      this.resources.set(k, asInt(v, `resources.${k}`));
    }
    for (const [k, v] of Object.entries(raw.resourceCaps ?? {})) {
      const cap = asNonNegInt(v, `resourceCaps.${k}`);
      this.resourceCaps.set(k, cap);
      if (!this.resources.has(k)) this.resources.set(k, 0n);
      if (this.resources.get(k) > cap) this.resources.set(k, cap);
    }
    this.usedPopulation = asNonNegInt(raw.usedPopulation ?? 0, 'usedPopulation');
    this.populationCap = asNonNegInt(raw.populationCap ?? 0, 'populationCap');
    if (this.usedPopulation > this.populationCap) {
      throw new Error('初始 usedPopulation 超过 populationCap');
    }
    this.speedMultiplier = asPosFraction(raw.speedMultiplier ?? [1, 1], 'speedMultiplier');
    this.pendingMultipliers = []; // 上一步完成的科技，本步指令阶段后乘入

    // catalog
    this.catalog = new Map();
    for (const [id, def] of Object.entries(raw.catalog ?? {})) {
      this.catalog.set(id, this.#parseItemDef(id, def));
    }

    // buildings（按 ID 升序处理，遍历顺序不依赖插入偶然性）
    const ids = Object.keys(Object.fromEntries(
      (raw.buildings ?? []).map(b => [b.id, true])
    ));
    const rawBuildings = [...(raw.buildings ?? [])];
    rawBuildings.sort((a, b) => compareId(a.id, b.id));
    if (rawBuildings.length > MAX_BUILDINGS) {
      throw new Error(`建筑数量超过上限 ${MAX_BUILDINGS}`);
    }
    if (new Set(rawBuildings.map(b => b.id)).size !== rawBuildings.length) {
      throw new Error('建筑 ID 重复');
    }
    this.buildingOrder = [];
    this.buildings = new Map();
    for (const b of rawBuildings) {
      if (typeof b.id !== 'string' || b.id === '') throw new Error('建筑 ID 非法');
      const inst = {
        id: b.id,
        speed: asPosFraction(b.speed, `building.${b.id}.speed`),
        paused: !!b.paused,
        destroyed: false,
        queue: [],
      };
      this.buildingOrder.push(b.id);
      this.buildings.set(b.id, inst);
    }

    // 初始实例：建筑 ID 升序、各队列从前到后分配 1 起递增编号；视为已付款、进度 0
    this.nextInstanceId = 1;
    this.instanceIndex = new Map();
    for (const bid of this.buildingOrder) {
      const b = this.buildings.get(bid);
      const itemIds = rawBuildings.find(x => x.id === bid).queue ?? [];
      if (itemIds.length > MAX_QUEUE) throw new Error(`建筑 ${bid} 队列超过 ${MAX_QUEUE}`);
      for (const itemId of itemIds) {
        this.#addInstance(b, itemId, /*paid*/ true);
      }
    }

    // 预置指令按 tick 归档，seq 登记
    this.commandsByTick = new Map();
    for (const c of raw.commands ?? []) {
      const t = Number(asInt(c.tick, 'command.tick'));
      if (t < 0) throw new Error('指令 tick 不能为负');
      this.#registerSeq(t, asInt(c.seq, 'command.seq'));
      if (!this.commandsByTick.has(t)) this.commandsByTick.set(t, []);
      this.commandsByTick.get(t).push({ ...c });
    }
    for (const list of this.commandsByTick.values()) {
      list.sort((a, b) => Number(a.seq - b.seq) || 0);
    }
  }

  #parseItemDef(id, def) {
    const work = asInt(def.work, `catalog.${id}.work`);
    if (work <= 0n) throw new Error(`catalog.${id}.work 必须为正整数`);
    const cost = new Map();
    for (const [r, v] of Object.entries(def.cost ?? {})) {
      cost.set(r, asNonNegInt(v, `catalog.${id}.cost.${r}`));
    }
    if (def.kind !== 'unit' && def.kind !== 'research') {
      throw new Error(`catalog.${id}.kind 非法`);
    }
    const out = { itemId: id, work, cost, kind: def.kind };
    if (def.kind === 'unit') {
      out.population = asNonNegInt(def.population, `catalog.${id}.population`);
    } else {
      out.multiplier = asPosFraction(def.multiplier, `catalog.${id}.multiplier`);
    }
    return out;
  }

  #registerSeq(tick, seq) {
    const key = `${tick}`;
    const used = this.commandSeqCounter.get(key) ?? new Set();
    if (used.has(seq.toString())) throw new Error(`tick ${tick} seq ${seq} 重复`);
    used.add(seq.toString());
    this.commandSeqCounter.set(key, used);
  }

  #nextSeq(tick) {
    const key = `${tick}`;
    const used = this.commandSeqCounter.get(key) ?? new Set();
    let s = 1n;
    while (used.has(s.toString())) s += 1n;
    used.add(s.toString());
    this.commandSeqCounter.set(key, used);
    return s;
  }

  #addInstance(b, itemId, paid) {
    const def = this.catalog.get(itemId);
    if (!def) throw new Error(`未知项目 ${itemId}`);
    if (b.queue.length >= MAX_QUEUE) throw new Error(`建筑 ${b.id} 队列已满`);
    const inst = {
      instanceId: this.nextInstanceId++,
      itemId,
      def,
      progress: Fraction.ZERO,
      workApplied: false,
      ready: false,
    };
    b.queue.push(inst);
    this.instanceIndex.set(inst.instanceId, inst);
    return inst;
  }

  // ---------- 资源/人口小工具（全部留痕） ----------

  #getResource(r) { return this.resources.get(r) ?? 0n; }

  #changeResource(r, delta, source, reason) {
    const before = this.#getResource(r);
    let after = before + delta;
    let clamped = false;
    const cap = this.resourceCaps.get(r);
    if (cap !== undefined && after > cap) { after = cap; clamped = true; }
    if (after < 0n) { after = 0n; clamped = true; }
    this.resources.set(r, after);
    this.events.push({
      tick: this.tick, source, kind: 'resource', resource: r,
      before: before.toString(), after: after.toString(),
      delta: (after - before).toString(),
      intendedDelta: delta.toString(), reason,
      clamped,
    });
    return after;
  }

  #changePopulation(delta, source, reason) {
    const before = this.usedPopulation;
    const after = before + delta;
    this.usedPopulation = after;
    this.events.push({
      tick: this.tick, source, kind: 'population',
      before: before.toString(), after: after.toString(),
      delta: delta.toString(), reason,
    });
  }

  #canAfford(cost) {
    for (const [r, v] of cost) {
      if (this.#getResource(r) < v) return false;
    }
    return true;
  }

  // ---------- 指令 ----------

  // 实时编辑（界面操作）：登记到当前 tick 的指令表，下一次 step() 的指令阶段执行。
  // 编辑只发生在 tick 边界（暂停态），tick+seq 使保存/恢复与回放完全确定。
  scheduleLive(command) {
    const t = this.tick;
    const seq = this.#nextSeq(t);
    const entry = { ...command, tick: t, seq: Number(seq) };
    if (!this.commandsByTick.has(t)) this.commandsByTick.set(t, []);
    this.commandsByTick.get(t).push(entry);
    this.commandsByTick.get(t).sort((a, b) => Number(a.seq - b.seq));
    return entry;
  }

  #executeCommand(c) {
    const source = { seq: c.seq.toString(), op: c.op };
    const reject = (reason) => {
      this.events.push({ tick: this.tick, source, kind: 'command', op: c.op, accepted: false, reason });
    };
    try {
      switch (c.op) {
        case 'enqueue': {
          const b = this.buildings.get(c.building);
          if (!b || b.destroyed) return reject('建筑不存在或已摧毁');
          const def = this.catalog.get(c.item);
          if (!def) return reject('未知项目');
          if (b.queue.length >= MAX_QUEUE) return reject('队列已满（8）');
          if (!this.#canAfford(def.cost)) return reject('资源不足');
          for (const [r, v] of def.cost) this.#changeResource(r, -v, source, 'enqueue');
          const inst = this.#addInstance(b, c.item, false);
          this.events.push({
            tick: this.tick, source, kind: 'command', op: 'enqueue', accepted: true,
            building: b.id, instance: inst.instanceId, item: c.item,
          });
          break;
        }
        case 'cancel': {
          const instId = Number(asInt(c.instance, 'instance'));
          const inst = this.instanceIndex.get(instId);
          if (!inst) return reject('实例不存在');
          const owner = this.#findOwner(instId);
          if (!owner) return reject('实例不存在');
          if (inst.ready) {
            // ready 不退，直接移除
            this.#removeInstance(owner, inst);
            this.events.push({
              tick: this.tick, source, kind: 'command', op: 'cancel', accepted: true,
              building: owner.id, instance: instId, item: inst.itemId, refunded: false,
            });
            break;
          }
          // 逐资源退款 floor(cost * (work - progress) / work)，再按仓库上限截断
          const remainingRatio = Fraction.from(inst.def.work).sub(inst.progress)
            .div(Fraction.from(inst.def.work));
          const refunds = [];
          for (const [r, cost] of inst.def.cost) {
            const exact = Fraction.from(cost).mul(remainingRatio);
            const refund = exact.floor(); // BigInt，精确向下取整
            this.#changeResource(r, refund, source, 'cancel');
            refunds.push({ resource: r, refund: refund.toString() });
          }
          this.#removeInstance(owner, inst);
          this.events.push({
            tick: this.tick, source, kind: 'command', op: 'cancel', accepted: true,
            building: owner.id, instance: instId, item: inst.itemId, refunded: true, refunds,
          });
          break;
        }
        case 'reorder': {
          const b = this.buildings.get(c.building);
          if (!b || b.destroyed) return reject('建筑不存在或已摧毁');
          if (!Array.isArray(c.order)) return reject('order 必须是实例编号数组');
          const waiting = b.queue.filter(x => !x.workApplied && !x.ready);
          const wanted = [];
          const seen = new Set();
          for (const v of c.order) {
            const id = Number(asInt(v, 'order[]'));
            const inst = this.instanceIndex.get(id);
            if (!inst || !b.queue.includes(inst)) return reject('重排包含不属于该队列的实例');
            if (inst.workApplied || inst.ready) return reject('只允许重排尚未取得工作量的非 ready 实例');
            if (seen.has(id)) return reject('重排顺序存在重复实例');
            seen.add(id);
            wanted.push(inst);
          }
          if (wanted.length !== waiting.length ||
              waiting.some(x => !seen.has(x.instanceId))) {
            return reject('重排必须是等待实例的完整新顺序');
          }
          // 固定实例（已取得工作量或 ready）位置不动，等待槽位按新顺序填入
          let wi = 0;
          b.queue = b.queue.map(x => (x.workApplied || x.ready) ? x : wanted[wi++]);
          this.events.push({
            tick: this.tick, source, kind: 'command', op: 'reorder', accepted: true,
            building: b.id,
            order: b.queue.map(x => x.instanceId),
          });
          break;
        }
        case 'pause': {
          const b = this.buildings.get(c.building);
          if (!b || b.destroyed) return reject('建筑不存在或已摧毁');
          if (typeof c.paused !== 'boolean') return reject('paused 必须是布尔值');
          b.paused = c.paused;
          this.events.push({
            tick: this.tick, source, kind: 'command', op: 'pause', accepted: true,
            building: b.id, paused: b.paused,
          });
          break;
        }
        case 'destroy': {
          const b = this.buildings.get(c.building);
          if (!b || b.destroyed) return reject('建筑不存在或已摧毁');
          const removed = b.queue.map(x => x.instanceId);
          for (const inst of b.queue) this.instanceIndex.delete(inst.instanceId);
          b.queue = [];
          b.destroyed = true;
          this.events.push({
            tick: this.tick, source, kind: 'command', op: 'destroy', accepted: true,
            building: b.id, removed,
          });
          break;
        }
        case 'grant': {
          const amount = asNonNegInt(c.amount, 'amount');
          if (typeof c.resource !== 'string' || c.resource === '') return reject('resource 非法');
          this.#changeResource(c.resource, amount, source, 'grant');
          this.events.push({
            tick: this.tick, source, kind: 'command', op: 'grant', accepted: true,
            resource: c.resource, amount: amount.toString(),
          });
          break;
        }
        case 'release': {
          const amount = asNonNegInt(c.amount, 'amount');
          if (amount > this.usedPopulation) return reject('释放人口超过已用人口');
          if (amount > 0n) this.#changePopulation(-amount, source, 'release');
          this.events.push({
            tick: this.tick, source, kind: 'command', op: 'release', accepted: true,
            amount: amount.toString(),
          });
          break;
        }
        default:
          return reject(`未知指令 ${c.op}`);
      }
    } catch (e) {
      reject(e.message);
    }
  }

  #findOwner(instanceId) {
    for (const bid of this.buildingOrder) {
      const b = this.buildings.get(bid);
      if (b.queue.some(x => x.instanceId === instanceId)) return b;
    }
    return null;
  }

  #removeInstance(b, inst) {
    const i = b.queue.indexOf(inst);
    if (i >= 0) b.queue.splice(i, 1);
    this.instanceIndex.delete(inst.instanceId);
  }

  // ---------- 单步推进 ----------

  step() {
    const tick = this.tick;

    // 1) 按 seq 执行本 tick 指令
    const cmds = this.commandsByTick.get(tick) ?? [];
    for (const c of cmds) this.#executeCommand(c);

    // 2) 应用上步完成的科技（乘入全局倍率，本步生效）
    if (this.pendingMultipliers.length) {
      const before = this.speedMultiplier;
      for (const m of this.pendingMultipliers) {
        this.speedMultiplier = this.speedMultiplier.mul(m);
      }
      this.events.push({
        tick, source: { system: true }, kind: 'speedMultiplier',
        before: before.toJSON(), after: this.speedMultiplier.toJSON(),
        applied: this.pendingMultipliers.map(m => m.toJSON()),
      });
      this.pendingMultipliers = [];
    }

    // 3) 按建筑 ID 升序处理
    for (const bid of this.buildingOrder) {
      const b = this.buildings.get(bid);
      if (b.destroyed || b.paused) continue;

      // 3a) 先尝试交付队首 ready 成品，能交付才继续
      if (b.queue.length && b.queue[0].ready) {
        if (!this.#tryDeliver(b, b.queue[0])) continue; // 人口卡住：本步结束
      }

      // 3b) 本步预算 = 建筑 speed * 全局倍率；不保留跨 tick 预算
      let budget = b.speed.mul(this.speedMultiplier);

      while (budget.isPositive() && b.queue.length) {
        const inst = b.queue[0];
        if (inst.ready) {
          // 队首 ready 且无法交付：丢弃本步剩余预算
          this.events.push({
            tick, source: { building: b.id, instance: inst.instanceId },
            kind: 'blocked', item: inst.itemId, reason: 'population',
            discardedBudget: budget.toJSON(),
          });
          break;
        }
        const remaining = Fraction.from(inst.def.work).sub(inst.progress);
        const source = { building: b.id, instance: inst.instanceId };
        let delta;
        if (budget.lt(remaining)) {
          delta = budget;
          inst.progress = inst.progress.add(delta);
          inst.workApplied = true;
          budget = Fraction.ZERO;
        } else {
          delta = remaining;
          inst.progress = Fraction.from(inst.def.work);
          inst.workApplied = true;
          budget = budget.sub(remaining);
        }
        this.events.push({
          tick, source, kind: 'work', item: inst.itemId,
          delta: delta.toJSON(),
          progressBefore: inst.progress.sub(delta).toJSON(),
          progressAfter: inst.progress.toJSON(),
          work: inst.def.work.toString(),
          budgetAfter: budget.toJSON(),
        });

        if (!inst.progress.eq(Fraction.from(inst.def.work))) break; // 未完成，预算耗尽

        // 完成
        if (inst.def.kind === 'research') {
          // research 立即移除，倍率累积到下一 tick
          this.pendingMultipliers.push(inst.def.multiplier);
          this.events.push({
            tick, source, kind: 'complete', item: inst.itemId,
            itemKind: 'research', multiplier: inst.def.multiplier.toJSON(),
            takesEffectTick: tick + 1,
          });
          this.#removeInstance(b, inst);
          // 剩余预算给下一项
        } else {
          // unit：能交付则移除并把剩余预算给下一项；超人口则保留 ready、丢弃剩余预算
          if (this.#canDeliver(inst)) {
            this.#deliver(b, inst);
            // 剩余预算继续循环
          } else {
            inst.ready = true;
            this.events.push({
              tick, source, kind: 'ready', item: inst.itemId, reason: 'population',
              usedPopulation: this.usedPopulation.toString(),
              populationCap: this.populationCap.toString(),
              discardedBudget: budget.toJSON(),
            });
            this.events.push({
              tick, source, kind: 'blocked', item: inst.itemId, reason: 'population',
              discardedBudget: budget.toJSON(),
            });
            break;
          }
        }
      }
    }

    this.tick += 1;
  }

  #canDeliver(inst) {
    return this.usedPopulation + inst.def.population <= this.populationCap;
  }

  #tryDeliver(b, inst) {
    if (this.#canDeliver(inst)) {
      this.#deliver(b, inst);
      return true;
    }
    this.events.push({
      tick: this.tick, source: { building: b.id, instance: inst.instanceId },
      kind: 'blocked', item: inst.itemId, reason: 'population',
      usedPopulation: this.usedPopulation.toString(),
      populationCap: this.populationCap.toString(),
    });
    return false;
  }

  #deliver(b, inst) {
    this.#changePopulation(inst.def.population,
      { building: b.id, instance: inst.instanceId }, 'deliver');
    this.events.push({
      tick: this.tick, source: { building: b.id, instance: inst.instanceId },
      kind: 'complete', item: inst.itemId, itemKind: 'unit',
      population: inst.def.population.toString(),
    });
    this.#removeInstance(b, inst);
  }

  runTo(tick) {
    while (this.tick < tick) this.step();
  }

  // ---------- 状态快照（保存/恢复，无损） ----------

  snapshot() {
    return JSON.stringify(serialize(this));
  }

  #serialize() {
    return {
      version: 1,
      tick: this.tick,
      resources: Object.fromEntries([...this.resources].map(([k, v]) => [k, v.toString()])),
      resourceCaps: Object.fromEntries([...this.resourceCaps].map(([k, v]) => [k, v.toString()])),
      usedPopulation: this.usedPopulation.toString(),
      populationCap: this.populationCap.toString(),
      speedMultiplier: this.speedMultiplier.toJSON(),
      pendingMultipliers: this.pendingMultipliers.map(m => m.toJSON()),
      catalog: [...this.catalog].map(([id, d]) => [id, {
        work: d.work.toString(),
        cost: Object.fromEntries([...d.cost].map(([r, v]) => [r, v.toString()])),
        kind: d.kind,
        population: d.population?.toString(),
        multiplier: d.multiplier?.toJSON(),
      }]),
      buildings: this.buildingOrder.map(bid => {
        const b = this.buildings.get(bid);
        return {
          id: b.id, speed: b.speed.toJSON(), paused: b.paused, destroyed: b.destroyed,
          queue: b.queue.map(i => ({
            instanceId: i.instanceId, itemId: i.itemId,
            progress: i.progress.toJSON(), workApplied: i.workApplied, ready: i.ready,
          })),
        };
      }),
      nextInstanceId: this.nextInstanceId,
      commandsByTick: [...this.commandsByTick.entries()].map(([t, list]) => [t, list]),
      commandSeqCounter: [...this.commandSeqCounter.entries()].map(([k, set]) => [k, [...set]]),
      events: this.events,
    };
  }

  static restore(json) {
    return restoreSnapshot(JSON.parse(json));
  }
}

function serialize(eng) {
  return {
    version: 1,
    tick: eng.tick,
    resources: Object.fromEntries([...eng.resources].map(([k, v]) => [k, v.toString()])),
    resourceCaps: Object.fromEntries([...eng.resourceCaps].map(([k, v]) => [k, v.toString()])),
    usedPopulation: eng.usedPopulation.toString(),
    populationCap: eng.populationCap.toString(),
    speedMultiplier: eng.speedMultiplier.toJSON(),
    pendingMultipliers: eng.pendingMultipliers.map(m => m.toJSON()),
    catalog: [...eng.catalog].map(([id, d]) => [id, {
      work: d.work.toString(),
      cost: Object.fromEntries([...d.cost].map(([r, v]) => [r, v.toString()])),
      kind: d.kind,
      population: d.population?.toString(),
      multiplier: d.multiplier?.toJSON(),
    }]),
    buildings: eng.buildingOrder.map(bid => {
      const b = eng.buildings.get(bid);
      return {
        id: b.id, speed: b.speed.toJSON(), paused: b.paused, destroyed: b.destroyed,
        queue: b.queue.map(i => ({
          instanceId: i.instanceId, itemId: i.itemId,
          progress: i.progress.toJSON(), workApplied: i.workApplied, ready: i.ready,
        })),
      };
    }),
    nextInstanceId: eng.nextInstanceId,
    commandsByTick: [...eng.commandsByTick.entries()].map(([t, list]) => [t, list]),
    commandSeqCounter: [...eng.commandSeqCounter.entries()].map(([k, set]) => [k, [...set]]),
    events: eng.events,
  };
}

function restoreSnapshot(s) {
  const eng = Object.create(Engine.prototype);
  eng.events = s.events;
  eng.tick = s.tick;
  eng.resources = new Map(Object.entries(s.resources).map(([k, v]) => [k, BigInt(v)]));
  eng.resourceCaps = new Map(Object.entries(s.resourceCaps).map(([k, v]) => [k, BigInt(v)]));
  eng.usedPopulation = BigInt(s.usedPopulation);
  eng.populationCap = BigInt(s.populationCap);
  eng.speedMultiplier = Fraction.from(s.speedMultiplier);
  eng.pendingMultipliers = s.pendingMultipliers.map(Fraction.from);
  eng.catalog = new Map(s.catalog.map(([id, d]) => [id, {
    itemId: id,
    work: BigInt(d.work),
    cost: new Map(Object.entries(d.cost).map(([r, v]) => [r, BigInt(v)])),
    kind: d.kind,
    population: d.population !== undefined ? BigInt(d.population) : undefined,
    multiplier: d.multiplier ? Fraction.from(d.multiplier) : undefined,
  }]));
  eng.buildingOrder = s.buildings.map(b => b.id);
  eng.buildings = new Map();
  eng.instanceIndex = new Map();
  eng.nextInstanceId = s.nextInstanceId;
  for (const bs of s.buildings) {
    const b = {
      id: bs.id, speed: Fraction.from(bs.speed), paused: bs.paused,
      destroyed: bs.destroyed, queue: [],
    };
    for (const is of bs.queue) {
      const def = eng.catalog.get(is.itemId);
      const inst = {
        instanceId: is.instanceId, itemId: is.itemId, def,
        progress: Fraction.from(is.progress),
        workApplied: is.workApplied, ready: is.ready,
      };
      b.queue.push(inst);
      eng.instanceIndex.set(inst.instanceId, inst);
    }
    eng.buildings.set(b.id, b);
  }
  eng.commandsByTick = new Map(s.commandsByTick.map(([t, list]) => [Number(t), list]));
  eng.commandSeqCounter = new Map(
    s.commandSeqCounter.map(([k, arr]) => [k, new Set(arr)])
  );
  return eng;
}

function compareId(a, b) {
  // 代码点升序，与 locale 无关
  if (a === b) return 0;
  return a < b ? -1 : 1;
}


// ===== ui.js =====
// 网页控制层：负责渲染与交互，所有模拟逻辑都在 engine.js（已通过 Node 样例验证）。

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const STORAGE_KEY = 'rts-production-clock-save-v1';
const BUILTIN_CASES = [
  ['fraction.json', '分数工作量（2/3 速度）'],
  ['research.json', '科技加速（下一步生效）'],
  ['blocked.json', '人口卡住队首'],
  ['refund.json', '取消按比例退款'],
  ['stress.json', '32 建筑 × 8 队列压测'],
];

const state = {
  engine: null,
  raw: null,              // 当前用例原始 JSON（用于重开/导出）
  caseName: '',
  logFilter: 'all',
  ffTimer: null,
  pendingEdits: [],       // 当前 tick 已登记、尚未执行的实时指令
};

// ---------- 数字/分数展示 ----------

function frac(x) { return Fraction.from(x); }
function fShort(x) {
  const f = frac(x);
  return f.d === 1n ? f.n.toString() : `${f.n}/${f.d}`;
}
function fDec(x, digits = 4) { return frac(x).toDecimal(digits); }
function pct(progress, work) {
  const f = frac(progress).div(Fraction.from(work));
  return Math.min(100, Math.max(0, f.toNumber() * 100));
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function nowMs(tick) { return (tick * 100).toLocaleString('en-US') + ' ms'; }

// ---------- 载入用例 ----------

function loadCase(raw, name) {
  stopFastForward();
  state.raw = raw;
  state.caseName = name;
  state.engine = new Engine(JSON.parse(JSON.stringify(raw)));
  state.pendingEdits = [];
  state.logFilter = 'all';
  $('#caseName').textContent = name;
  renderAll();
  toast(`已载入 ${name}`);
}

async function loadBuiltin(file) {
  try {
    const res = await fetch(`cases/${file}`);
    if (!res.ok) throw new Error(res.status);
    const raw = await res.json();
    loadCase(raw, file);
  } catch (e) {
    toast(`内置用例加载失败：${e.message}`, true);
  }
}

function loadJsonText(text, name) {
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { toast('JSON 解析失败：' + e.message, true); return; }
  try {
    loadCase(raw, name);
  } catch (e) {
    toast('用例非法：' + e.message, true);
  }
}

// ---------- 操作 ----------

function doStep() {
  if (!state.engine) return;
  state.engine.step();
  state.pendingEdits = state.pendingEdits.filter(e => e.tick >= state.engine.tick);
  renderAll();
}

function runSteps(n) {
  if (!state.engine) return;
  for (let i = 0; i < n; i++) state.engine.step();
  state.pendingEdits = [];
  renderAll();
}

function startFastForward() {
  if (!state.engine || state.ffTimer) return;
  $('#ffBtn').classList.add('active');
  state.ffTimer = setInterval(() => {
    const eng = state.engine;
    const anyQueued = eng.buildingOrder.some(id => eng.buildings.get(id).queue.length);
    const maxScheduled = Math.max(-1, ...eng.commandsByTick.keys());
    if (!anyQueued && eng.tick > maxScheduled && eng.pendingMultipliers.length === 0) {
      stopFastForward();
      renderAll();
      return;
    }
    eng.step();
    renderAll();
  }, 120);
}
function stopFastForward() {
  if (state.ffTimer) clearInterval(state.ffTimer);
  state.ffTimer = null;
  $('#ffBtn')?.classList.remove('active');
}

function resetCase() {
  if (!state.raw) return;
  stopFastForward();
  state.engine = new Engine(JSON.parse(JSON.stringify(state.raw)));
  state.pendingEdits = [];
  renderAll();
  toast('已重置为用例初始状态');
}

// 实时编辑：登记到当前 tick，下一步指令阶段执行
function live(command, label) {
  const eng = state.engine;
  if (!eng) return;
  try {
    const entry = eng.scheduleLive(command);
    state.pendingEdits.push({ ...entry, _label: label });
    renderPending();
    toast(`${label} 已登记，将在 tick ${entry.tick}（下一步）按 seq ${entry.seq} 执行`);
  } catch (e) {
    toast('指令被拒绝：' + e.message, true);
  }
}

// ---------- 渲染 ----------

function renderAll() {
  renderHeader();
  renderResources();
  renderBuildings();
  renderPending();
  renderLog();
  renderCatalogHint();
}

function renderHeader() {
  const eng = state.engine;
  $('#tickVal').textContent = eng.tick;
  $('#msVal').textContent = nowMs(eng.tick);
  $('#multVal').textContent = fShort(eng.speedMultiplier);
  $('#popVal').textContent = `${eng.usedPopulation} / ${eng.populationCap}`;
  const popPct = eng.populationCap === 0n ? 0 :
    Number(eng.usedPopulation * 100n / eng.populationCap);
  $('#popBar').style.width = Math.min(100, popPct) + '%';
  $('#popBar').classList.toggle('warn', eng.usedPopulation >= eng.populationCap);
  $('#pendingMult').hidden = eng.pendingMultipliers.length === 0;
  if (eng.pendingMultipliers.length) {
    $('#pendingMult').textContent =
      '待生效科技 ×' + eng.pendingMultipliers.map(fShort).join(' × ') +
      `（tick ${eng.tick + 1} 起）`;
  }
}

function renderResources() {
  const eng = state.engine;
  const wrap = $('#resourceGrid');
  const names = [...new Set([...eng.resources.keys(), ...eng.resourceCaps.keys()])].sort();
  wrap.innerHTML = names.map(r => {
    const v = eng.resources.get(r) ?? 0n;
    const cap = eng.resourceCaps.get(r);
    const capText = cap === undefined ? '∞' : cap.toString();
    const p = cap === undefined || cap === 0n ? 0 : Number(v * 100n / cap);
    return `<div class="res-card">
      <div class="res-label">${esc(r)}</div>
      <div class="res-val" data-num>${v.toString()}<span class="res-cap"> / ${capText}</span></div>
      <div class="res-track"><div class="res-fill" style="width:${Math.min(100, p)}%"></div></div>
    </div>`;
  }).join('') || '<p class="muted">无资源</p>';
}

function renderBuildings() {
  const eng = state.engine;
  const wrap = $('#buildingList');
  if (!eng.buildingOrder.length) {
    wrap.innerHTML = '<p class="muted">没有建筑。用下方“新增建筑”创建。</p>';
    return;
  }
  wrap.innerHTML = eng.buildingOrder.map(bid => {
    const b = eng.buildings.get(bid);
    const rows = b.queue.map((inst, idx) => queueRow(b, inst, idx)).join('');
    return `<article class="building ${b.destroyed ? 'destroyed' : ''} ${b.paused ? 'paused' : ''}">
      <header>
        <div class="b-title">
          <span class="b-id">${esc(b.id)}</span>
          <span class="b-speed">速度 ${fShort(b.speed)} → 本步预算 ${fShort(b.speed.mul(eng.speedMultiplier))}</span>
        </div>
        <div class="b-actions">
          ${b.destroyed ? '<span class="chip danger">已摧毁</span>' : `
            <button class="btn mini" data-act="pause" data-bid="${esc(b.id)}">${b.paused ? '恢复' : '暂停'}</button>
            <button class="btn mini danger" data-act="destroy" data-bid="${esc(b.id)}">摧毁</button>`}
        </div>
      </header>
      ${b.destroyed ? '<p class="muted small">队列已清空，不退款。</p>' :
        `<ol class="queue">${rows}</ol>
         ${enqueueRow(b)}`}
    </article>`;
  }).join('');
}

function queueRow(b, inst, idx) {
  const def = inst.def;
  const isHead = idx === 0;
  const p = pct(inst.progress, def.work);
  const status = inst.ready
    ? '<span class="chip warn">ready·人口阻塞</span>'
    : inst.workApplied
      ? (isHead ? '<span class="chip">生产中</span>' : '<span class="chip muted">等待中</span>')
      : '<span class="chip muted">未开工</span>';
  const kindIcon = def.kind === 'research' ? '🔬' : '⚙️';
  const canReorder = !inst.workApplied && !inst.ready;
  return `<li class="q-item ${inst.ready ? 'ready' : ''}">
    <div class="q-head">
      <span class="q-name">#${inst.instanceId} ${kindIcon} ${esc(inst.itemId)}</span>
      ${status}
    </div>
    <div class="q-meta">
      <span data-num>进度 ${fShort(inst.progress)} / ${def.work.toString()}（${fDec(inst.progress.div(Fraction.from(def.work)).mul(100), 2)}%）</span>
      <span class="muted">${def.kind === 'unit' ? `占人口 ${def.population}` : `倍率 ×${fShort(def.multiplier)}`}</span>
    </div>
    <div class="q-track"><div class="q-fill" style="width:${p}%"></div></div>
    <div class="q-cost">${costText(def)}</div>
    <div class="q-actions">
      <button class="btn mini" data-act="cancel" data-iid="${inst.instanceId}">取消（退款）</button>
      ${canReorder ? `
        <button class="btn mini" data-act="up" data-iid="${inst.instanceId}" ${idx === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn mini" data-act="down" data-iid="${inst.instanceId}"
          ${idx === b.queue.length - 1 || b.queue[idx + 1].workApplied || b.queue[idx + 1].ready ? 'disabled' : ''}>↓</button>` : ''}
    </div>
  </li>`;
}

function costText(def) {
  const parts = [...def.cost].map(([r, v]) => `${esc(r)} ${v.toString()}`);
  return '<span class="muted small">造价 ' + (parts.join('、') || '无') + '</span>';
}

function enqueueRow(b) {
  const eng = state.engine;
  const full = b.queue.length >= 8;
  const opts = [...eng.catalog.keys()].map(id =>
    `<option value="${esc(id)}">${esc(id)}</option>`).join('');
  return `<div class="enq-row">
    <select class="sel" data-enq-item="${esc(b.id)}" ${full ? 'disabled' : ''}>${opts}</select>
    <button class="btn mini primary" data-act="enqueue" data-bid="${esc(b.id)}" ${full ? 'disabled' : ''}>
      ${full ? '队列已满（8）' : '入队（立即扣款）'}
    </button>
  </div>`;
}

function renderCatalogHint() {
  const eng = state.engine;
  $('#catalogBox').innerHTML = [...eng.catalog.values()].map(d => `
    <div class="cat-line">
      <strong>${esc(d.itemId)}</strong>
      <span class="muted">${d.kind === 'unit' ? `unit·pop ${d.population}` : 'research'}</span>
      <span data-num>work ${d.work.toString()}</span>
      <span class="muted">${[...d.cost].map(([r, v]) => `${r} ${v}`).join(' ') || '无造价'}</span>
      ${d.kind === 'research' ? `<span class="muted">×${fShort(d.multiplier)}</span>` : ''}
    </div>`).join('');
}

function renderPending() {
  const box = $('#pendingBox');
  if (!state.pendingEdits.length) {
    box.innerHTML = '<p class="muted small">当前 tick 无待执行指令。编辑会在你点“单步”时于指令阶段生效。</p>';
    return;
  }
  box.innerHTML = state.pendingEdits.map(e =>
    `<div class="pend-row"><span class="chip">tick ${e.tick} · seq ${e.seq}</span> ${esc(e._label)}</div>`
  ).join('');
}

function renderLog() {
  const eng = state.engine;
  const filter = state.logFilter;
  const all = eng.events;
  const filtered = all.filter(e => {
    if (filter === 'all') return true;
    if (filter === 'work') return e.kind === 'work';
    if (filter === 'resource') return e.kind === 'resource' || e.kind === 'population';
    if (filter === 'flow') return ['complete', 'ready', 'blocked', 'speedMultiplier', 'command'].includes(e.kind);
    return true;
  }).slice(-300);
  $('#logCount').textContent = `${filtered.length} / ${all.length} 条（仅显示最近 300）`;
  $('#logBody').innerHTML = filtered.map(logRow).join('') ||
    '<p class="muted">暂无事件</p>';
  $('#logBody').scrollTop = $('#logBody').scrollHeight;
}

function logRow(e) {
  const src = e.source?.seq != null
    ? `seq ${e.source.seq}`
    : e.source?.building ? `${e.source.building}${e.source.instance ? ` #${e.source.instance}` : ''}`
    : '系统';
  let body = '';
  let cls = '';
  switch (e.kind) {
    case 'work':
      cls = 'k-work';
      body = `<b>工作</b> ${esc(e.item)} 增量 <b data-num>${fShort(e.delta)}</b>` +
        `（${fShort(e.progressBefore)} → ${fShort(e.progressAfter)}，剩余预算 ${fShort(e.budgetAfter)}）`;
      break;
    case 'resource':
      cls = 'k-res';
      body = `<b>资源</b> ${esc(e.resource)} ${e.before} → ${e.after}` +
        `（Δ ${e.delta}${e.intendedDelta !== e.delta ? `，应计 ${e.intendedDelta}` : ''}${e.clamped ? '，<span class="warn-text">触顶截断</span>' : ''}）`;
      break;
    case 'population':
      cls = 'k-pop';
      body = `<b>人口</b> ${e.before} → ${e.after}（Δ ${e.delta}，${esc(e.reason)}）`;
      break;
    case 'complete':
      cls = 'k-done';
      body = e.itemKind === 'research'
        ? `<b>科技完成</b> ${esc(e.item)}，倍率 ×${fShort(e.multiplier)} 将于 tick ${e.takesEffectTick} 生效`
        : `<b>单位交付</b> ${esc(e.item)}，占用人口 ${e.population}`;
      break;
    case 'ready':
      cls = 'k-block';
      body = `<b>成品就绪但人口不足</b> ${esc(e.item)}，保留队首并丢弃本步剩余预算 ${fShort(e.discardedBudget)}`;
      break;
    case 'blocked':
      cls = 'k-block';
      body = `<b>阻塞</b> ${esc(e.item ?? '')}：${e.reason === 'population' ? '人口上限' : esc(e.reason)}` +
        (e.discardedBudget ? `，丢弃预算 ${fShort(e.discardedBudget)}` : '');
      break;
    case 'speedMultiplier':
      cls = 'k-mult';
      body = `<b>全局倍率</b> ${fShort(e.before)} → <b>${fShort(e.after)}</b>` +
        `（应用 ${e.applied.map(fShort).join(' × ')}）`;
      break;
    case 'command': {
      cls = e.accepted === false ? 'k-rej' : 'k-cmd';
      const detail = e.accepted === false
        ? `<span class="warn-text">拒绝：${esc(e.reason)}</span>`
        : commandDetail(e);
      body = `<b>指令</b> ${esc(e.op)} ${detail}`;
      break;
    }
    default:
      body = esc(e.kind);
  }
  return `<div class="log-row ${cls}">
    <span class="log-tick" data-num>t${e.tick}</span>
    <span class="log-src">${src}</span>
    <span class="log-body">${body}</span>
  </div>`;
}

function commandDetail(e) {
  switch (e.op) {
    case 'enqueue': return `${esc(e.building)} 入队 #${e.instance}（${esc(e.item)}），已扣款`;
    case 'cancel': return e.refunded
      ? `${esc(e.building)} 取消 #${e.instance}，退款 ` +
        e.refunds.map(r => `${esc(r.resource)} ${r.refund}`).join('、')
      : `${esc(e.building)} 取消 ready 实例 #${e.instance}，不退款`;
    case 'reorder': return `${esc(e.building)} 重排为 [${e.order.join(', ')}]`;
    case 'pause': return `${esc(e.building)} ${e.paused ? '暂停' : '恢复'}`;
    case 'destroy': return `${esc(e.building)} 摧毁，移除 ${e.removed.length} 个实例，不退款`;
    case 'grant': return `发放 ${esc(e.resource)} ${e.amount}`;
    case 'release': return `释放人口 ${e.amount}`;
    default: return '';
  }
}

// ---------- 保存 / 恢复 / 导出 ----------

function saveLocal() {
  try {
    const payload = {
      savedAt: new Date().toISOString(),
      caseName: state.caseName,
      snapshot: state.engine.snapshot(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    toast('已保存到浏览器本地');
  } catch (e) { toast('保存失败：' + e.message, true); }
}

function restoreLocal() {
  try {
    const text = localStorage.getItem(STORAGE_KEY);
    if (!text) { toast('没有已保存的进度', true); return; }
    const payload = JSON.parse(text);
    stopFastForward();
    state.engine = Engine.restore(payload.snapshot);
    state.raw = null;
    state.caseName = payload.caseName + '（已恢复）';
    state.pendingEdits = [];
    $('#caseName').textContent = state.caseName;
    renderAll();
    toast('已恢复保存的进度');
  } catch (e) { toast('恢复失败：' + e.message, true); }
}

function exportSnapshot() {
  downloadText(
    `rts-snapshot-t${state.engine.tick}.json`,
    JSON.stringify({ caseName: state.caseName, snapshot: JSON.parse(state.engine.snapshot()) }, null, 2),
    'application/json'
  );
}

function exportSettlementLog() {
  const eng = state.engine;
  const lines = [];
  lines.push('# RTS 生产队列结算日志');
  lines.push(`# 用例: ${state.caseName}`);
  lines.push(`# 导出 tick: ${eng.tick}（${nowMs(eng.tick)}）`);
  lines.push(`# 全局倍率: ${fShort(eng.speedMultiplier)}`);
  lines.push(`# 人口: ${eng.usedPopulation}/${eng.populationCap}`);
  lines.push('# 资源: ' + [...eng.resources].map(([k, v]) => `${k}=${v}`).join(', '));
  lines.push('tick\tsource\tkind\tdetail');
  for (const e of eng.events) {
    const src = e.source?.seq != null ? `seq${e.source.seq}`
      : e.source?.building ? `${e.source.building}${e.source.instance ? '#' + e.source.instance : ''}`
      : 'system';
    lines.push(`${e.tick}\t${src}\t${e.kind}\t${JSON.stringify(e)}`);
  }
  // 账本对账汇总
  const resDelta = new Map();
  for (const e of eng.events.filter(x => x.kind === 'resource')) {
    resDelta.set(e.resource, (resDelta.get(e.resource) ?? 0n) + BigInt(e.delta));
  }
  lines.push('');
  lines.push('# 资源净变化（事件 delta 之和）:');
  for (const [r, d] of resDelta) lines.push(`#   ${r}: ${d >= 0n ? '+' : ''}${d}`);
  const popDelta = eng.events.filter(x => x.kind === 'population')
    .reduce((a, e) => a + BigInt(e.delta), 0n);
  lines.push(`# 人口净变化: ${popDelta}`);
  const totalWork = eng.events.filter(x => x.kind === 'work')
    .reduce((a, e) => a.add(Fraction.from(e.delta)), Fraction.ZERO);
  lines.push(`# 累计工作量（精确分数）: ${totalWork.toString()}`);
  downloadText(`rts-settlement-t${eng.tick}.tsv`, lines.join('\n'), 'text/tab-separated-values');
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('已导出 ' + filename);
}

// ---------- 建筑/世界编辑 ----------

function addBuilding(id, speedP, speedQ) {
  const eng = state.engine;
  if (eng.buildings.has(id)) { toast('建筑 ID 已存在', true); return false; }
  if (eng.buildingOrder.length >= 32) { toast('建筑数已达 32 上限', true); return false; }
  // 建筑属于世界结构：从当前引擎状态反向生成场景定义后重建。
  // 已产生的事件轨迹不保留，故 tick>0 时明确提示。
  if (eng.tick > 0) toast('结构变更会重建场景，已清空事件轨迹', true);
  const raw = buildRawFromEngine();
  raw.buildings.push({ id, speed: [Number(speedP), Number(speedQ)], paused: false, queue: [] });
  loadCase(raw, state.caseName || '自定义场景');
  return true;
}

// 从当前引擎状态反向生成 raw（用于结构编辑后重建），事件轨迹不保留
function buildRawFromEngine() {
  const eng = state.engine;
  return {
    resources: Object.fromEntries([...eng.resources].map(([k, v]) => [k, Number(v)])),
    resourceCaps: Object.fromEntries([...eng.resourceCaps].map(([k, v]) => [k, Number(v)])),
    usedPopulation: Number(eng.usedPopulation),
    populationCap: Number(eng.populationCap),
    speedMultiplier: eng.speedMultiplier.toJSON().map(Number),
    buildings: eng.buildingOrder.map(bid => {
      const b = eng.buildings.get(bid);
      return {
        id: b.id, speed: b.speed.toJSON().map(Number), paused: b.paused,
        queue: b.queue.map(i => i.itemId),
      };
    }),
    catalog: Object.fromEntries([...eng.catalog].map(([id, d]) => [id, {
      work: Number(d.work),
      cost: Object.fromEntries([...d.cost].map(([r, v]) => [r, Number(v)])),
      kind: d.kind,
      ...(d.kind === 'unit' ? { population: Number(d.population) } : { multiplier: d.multiplier.toJSON().map(Number) }),
    }])),
    commands: [],
  };
}

// ---------- toast ----------

let toastTimer;
function toast(msg, danger = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('danger', danger);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ---------- 事件绑定 ----------

function bind() {
  $('#stepBtn').addEventListener('click', doStep);
  $('#ffBtn').addEventListener('click', () => state.ffTimer ? stopFastForward() : startFastForward());
  $('#run10Btn').addEventListener('click', () => runSteps(10));
  $('#run100Btn').addEventListener('click', () => runSteps(100));
  $('#resetBtn').addEventListener('click', resetCase);
  $('#saveBtn').addEventListener('click', saveLocal);
  $('#restoreBtn').addEventListener('click', restoreLocal);
  $('#exportSnapBtn').addEventListener('click', exportSnapshot);
  $('#exportLogBtn').addEventListener('click', exportSettlementLog);

  $('#caseSelect').addEventListener('change', e => {
    if (e.target.value) loadBuiltin(e.target.value);
  });
  $('#fileInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => loadJsonText(reader.result, f.name);
    reader.readAsText(f);
  });

  $('#logFilter').addEventListener('change', e => {
    state.logFilter = e.target.value;
    renderLog();
  });

  // 建筑列表事件委托
  $('#buildingList').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    const eng = state.engine;
    if (act === 'pause') {
      const b = eng.buildings.get(btn.dataset.bid);
      live({ op: 'pause', building: b.id, paused: !b.paused },
        `${b.id} ${b.paused ? '恢复' : '暂停'}`);
    } else if (act === 'destroy') {
      const bid = btn.dataset.bid;
      live({ op: 'destroy', building: bid }, `摧毁 ${bid}`);
    } else if (act === 'enqueue') {
      const bid = btn.dataset.bid;
      const sel = $(`select[data-enq-item="${CSS.escape(bid)}"]`);
      live({ op: 'enqueue', building: bid, item: sel.value }, `${bid} 入队 ${sel.value}`);
    } else if (act === 'cancel') {
      live({ op: 'cancel', instance: Number(btn.dataset.iid) }, `取消 #${btn.dataset.iid}`);
    } else if (act === 'up' || act === 'down') {
      const iid = Number(btn.dataset.iid);
      const owner = eng.buildingOrder.map(id => eng.buildings.get(id))
        .find(b => b.queue.some(i => i.instanceId === iid));
      const idx = owner.queue.findIndex(i => i.instanceId === iid);
      const swap = act === 'up' ? idx - 1 : idx + 1;
      const order = owner.queue.map(i => i.instanceId);
      [order[idx], order[swap]] = [order[swap], order[idx]];
      live({ op: 'reorder', building: owner.id, order },
        `${owner.id} 重排 [${order.join(',')}]`);
    }
    renderAll();
  });

  // 世界编辑：新增建筑 / grant / release
  $('#addBuildingBtn').addEventListener('click', () => {
    const id = $('#newBid').value.trim();
    const p = $('#newSpeedP').value;
    const q = $('#newSpeedQ').value || '1';
    if (!id) { toast('建筑 ID 不能为空', true); return; }
    if (!/^\d+$/.test(p) || !/^\d+$/.test(q) || BigInt(p) <= 0n || BigInt(q) <= 0n) {
      toast('速度必须是正整数 p/q', true); return;
    }
    if (addBuilding(id, p, q)) { $('#newBid').value = ''; }
  });
  $('#grantBtn').addEventListener('click', () => {
    const r = $('#grantRes').value.trim();
    const n = $('#grantAmt').value;
    if (!r || !/^\d+$/.test(n)) { toast('资源名与非负整数数量必填', true); return; }
    live({ op: 'grant', resource: r, amount: Number(n) }, `发放 ${r} ${n}`);
    renderAll();
  });
  $('#releaseBtn').addEventListener('click', () => {
    const n = $('#releaseAmt').value;
    if (!/^\d+$/.test(n)) { toast('释放数量必须是非负整数', true); return; }
    live({ op: 'release', amount: Number(n) }, `释放人口 ${n}`);
    renderAll();
  });

  // 键盘：空格单步
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); doStep(); }
  });
}

// ---------- 启动 ----------

function start() {
  bind();
  $('#caseSelect').innerHTML =
    '<option value="">选择内置用例…</option>' +
    BUILTIN_CASES.map(([f, label]) => `<option value="${f}">${esc(label)}（${f}）</option>`).join('');
  // 默认载入 fraction 用例；若 fetch 不可用则给一个最小内联场景
  loadBuiltin('fraction.json').catch(() => {
    loadCase({
      resources: { ore: 100 }, resourceCaps: { ore: 100 },
      usedPopulation: 0, populationCap: 10, speedMultiplier: [1, 1],
      buildings: [{ id: 'b', speed: [2, 3], paused: false, queue: ['u', 'u'] }],
      catalog: {
        u: { work: 1, cost: { ore: 10 }, kind: 'unit', population: 1 },
      },
      commands: [],
    }, '内联示例（fetch 不可用）');
  });
}

start();

})();

</script>
