<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>逐帧指纹对版台</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #5b8def;
    --match: #3fa66e;
    --missing: #e0a13c;
    --extra: #d9635c;
    --lock: #b07cf0;
    --select: #2b3a5e;
    --danger: #e05c5c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa; --panel: #ffffff; --panel-2: #f0f2f7; --line: #d9dee8;
      --text: #1a1d24; --muted: #5d6573; --accent: #2f63d8; --match: #1f8a52;
      --missing: #b9740f; --extra: #c23b34; --lock: #7d3fd0; --select: #d6e2fb;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 12.5px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type="file"] { display: none; }
  .file-label {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px dashed var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer;
  }
  .file-label.loaded { border-style: solid; border-color: var(--match); }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .statusbar {
    padding: 7px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted);
  }
  .statusbar b { color: var(--text); font-weight: 650; }
  .chip { padding: 1px 7px; border-radius: 10px; font-size: 11.5px; }
  .chip.match { background: color-mix(in srgb, var(--match) 18%, transparent); color: var(--match); }
  .chip.missing { background: color-mix(in srgb, var(--missing) 18%, transparent); color: var(--missing); }
  .chip.extra { background: color-mix(in srgb, var(--extra) 18%, transparent); color: var(--extra); }
  .chip.lock { background: color-mix(in srgb, var(--lock) 18%, transparent); color: var(--lock); }

  /* 差异条 */
  .diffstrip-wrap { padding: 8px 16px 4px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .diffstrip-label { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .diffstrip {
    position: relative; height: 30px; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer;
  }
  .diff-seg {
    position: absolute; top: 0; bottom: 0; min-width: 2px;
    border-right: 1px solid rgba(0,0,0,.25);
  }
  .diff-seg.missing { background: color-mix(in srgb, var(--missing) 70%, transparent); }
  .diff-seg.extra { background: color-mix(in srgb, var(--extra) 70%, transparent); }
  .diff-seg:hover { outline: 2px solid #fff; outline-offset: -2px; }
  .diff-tooltip {
    position: fixed; pointer-events: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
    font-size: 11.5px; z-index: 30; display: none; white-space: nowrap;
  }

  /* 双轨 */
  .tracks { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; gap: 0; }
  .track { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .track:last-child { border-right: none; }
  .track-head {
    padding: 6px 12px; font-size: 12px; color: var(--muted);
    background: var(--panel-2); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between;
  }
  .scroll { flex: 1; overflow: auto; position: relative; }
  .row {
    display: grid; grid-template-columns: 64px 1fr 62px; gap: 8px;
    height: 28px; align-items: center; padding: 0 12px;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
    cursor: pointer; white-space: nowrap;
  }
  .row:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .row.selected { background: var(--select); }
  .row.locked { box-shadow: inset 3px 0 0 var(--lock); }
  .row .idx { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .fp { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .row .tag { font-size: 11px; text-align: right; }
  .tag.m { color: var(--match); }
  .tag.x { color: var(--missing); }
  .tag.y { color: var(--extra); }
  .tag.lock { color: var(--lock); }
  .spacer { height: 28px; }

  .progress {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: center; justify-content: center; z-index: 40;
  }
  .progress.show { display: flex; }
  .progress .box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 22px 28px; width: 320px; text-align: center;
  }
  .bar { height: 8px; background: var(--panel-2); border-radius: 5px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--danger);
    border-radius: 8px; padding: 10px 16px; max-width: 720px; z-index: 50; display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  .toast.show { display: block; }
  .toast.info { border-left-color: var(--accent); }
  .toast.ok { border-left-color: var(--match); }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); }
  .legend span::before { content: "●"; margin-right: 3px; }
  .legend .lm::before { color: var(--match); }
  .legend .lx::before { color: var(--missing); }
  .legend .ly::before { color: var(--extra); }
  .legend .ll::before { color: var(--lock); }
  .settings-input { width: 64px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
</style>
</head>
<body>
<header>
  <h1>逐帧指纹对版台</h1>
  <div class="toolbar">
    <label class="file-label" id="masterLabel">
      主版 master.json
      <input type="file" id="masterFile" accept=".json,application/json" />
    </label>
    <label class="file-label" id="deliveryLabel">
      交付版 delivery.json
      <input type="file" id="deliveryFile" accept=".json,application/json" />
    </label>
    <label class="file-label" id="settingsLabel">
      settings.json（可选）
      <input type="file" id="settingsFile" accept=".json,application/json" />
    </label>
    <button class="primary" id="alignBtn" disabled>开始对齐</button>
    <button id="exportBtn" disabled>导出 JSON</button>
    <button id="clearLockBtn" disabled>清空锁点</button>
  </div>
</header>

<div class="statusbar" id="statusbar">
  <span>主版 <b id="statN">–</b> 帧</span>
  <span>交付版 <b id="statM">–</b> 帧</span>
  <span>总费用 <b id="statFee">–</b></span>
  <span>缺多段数 <b id="statSeg">–</b></span>
  <span>配对 <b id="statMatch">–</b></span>
  <span>锁点 <b id="statLock">0</b></span>
  <span class="legend">
    <span class="lm">配对</span><span class="lx">缺帧(missing)</span>
    <span class="ly">多帧(extra)</span><span class="ll">锁点</span>
  </span>
  <span style="margin-left:auto">阈值
    <input class="settings-input" id="setMaxD" placeholder="maxDistance" />
    开段 <input class="settings-input" id="setOpen" placeholder="gapOpen" />
    延长 <input class="settings-input" id="setExt" placeholder="gapExtend" />
  </span>
</div>

<div class="diffstrip-wrap">
  <div class="diffstrip-label">差异条（点击区间跳到该段首帧及对侧边界）</div>
  <div class="diffstrip" id="diffstrip"></div>
</div>

<main>
  <div class="tracks">
    <div class="track">
      <div class="track-head"><span>主版（master）</span><span id="masterScrollInfo"></span></div>
      <div class="scroll" id="masterScroll">
        <div class="spacer" id="masterSpacerTop"></div>
        <div id="masterRows"></div>
        <div class="spacer" id="masterSpacerBottom"></div>
      </div>
    </div>
    <div class="track">
      <div class="track-head"><span>交付版（delivery）</span><span id="deliveryScrollInfo"></span></div>
      <div class="scroll" id="deliveryScroll">
        <div class="spacer" id="deliverySpacerTop"></div>
        <div id="deliveryRows"></div>
        <div class="spacer" id="deliverySpacerBottom"></div>
      </div>
    </div>
  </div>
</main>

<div class="progress" id="progressMask">
  <div class="box">
    <div id="progressText">正在对齐…</div>
    <div class="bar"><i id="progressBar"></i></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="diff-tooltip" id="diffTooltip"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
