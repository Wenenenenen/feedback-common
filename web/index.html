<title>分级地形接缝检查器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* 布局：左视口右控制面板，窄屏堆叠。配色为地图/测绘工具的冷灰蓝 + 拓扑等高线暖色强调。 */
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --bg-scene: #dfe5ec;
    --fg: #16202c;
    --muted: #5d6b7c;
    --line: #cdd6e0;
    --accent: #2563c9;
    --accent-soft: #e3edfb;
    --good: #1f9d63;
    --bad: #d64045;
    --wire: #2a3644;
    --terrain-solid: #b9c6d4;
    --seam: #ffd23b;
    --shadow: 0 1px 3px rgba(20, 30, 45, .10), 0 6px 18px rgba(20, 30, 45, .06);
    --radius: 12px;
    --font-head: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-data: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141b; --panel: #171d27; --bg-scene: #0d1118; --fg: #e6ebf2;
      --muted: #93a1b3; --line: #2a3442; --accent: #6ea3ff; --accent-soft: #1b2740;
      --good: #46d392; --bad: #ff6b70; --wire: #9fb2c8; --terrain-solid: #3a4657;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141b; --panel: #171d27; --bg-scene: #0d1118; --fg: #e6ebf2;
    --muted: #93a1b3; --line: #2a3442; --accent: #6ea3ff; --accent-soft: #1b2740;
    --good: #46d392; --bad: #ff6b70; --wire: #9fb2c8; --terrain-solid: #3a4657;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 14px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; }
  .app {
    display: grid; grid-template-columns: minmax(0, 1fr) 360px;
    gap: 16px; padding-block: max(16px, env(safe-area-inset-top, 0px)) 16px;
    height: 100%;
  }
  .stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar h1 { font-size: 19px; letter-spacing: -.01em; }
  .topbar .sub { color: var(--muted); font-size: 12.5px; }
  #viewport {
    position: relative; flex: 1; min-height: 320px; border-radius: var(--radius);
    overflow: hidden; background: var(--bg-scene); box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  #viewport canvas { display: block; }
  .legend {
    position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px);
    font-size: 12px;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; margin-block: 3px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); }
  .seam-dot { width: 16px; height: 3px; border-radius: 2px; background: var(--seam); }
  .cam-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff3b6b; }
  .validity {
    border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); background: var(--panel);
  }
  .validity.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .validity.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 6px; text-align: center;
  }
  .stat b { display: block; font-family: var(--font-data); font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .group { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  #samples { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button, .file-btn {
    font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); padding: 8px 10px; transition: background .15s, border-color .15s;
  }
  button:hover, .file-btn:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .file-btn { display: block; text-align: center; font-size: 13px; }
  .file-btn input { display: none; }
  label.control { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .pe-val { font-family: var(--font-data); min-width: 42px; text-align: right; color: var(--accent); font-weight: 600; }
  .checks { display: flex; flex-direction: column; gap: 7px; }
  .checks label { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .checks input { accent-color: var(--accent); width: 16px; height: 16px; }
  .cam-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cam-grid div { display: flex; flex-direction: column; gap: 3px; }
  .cam-grid label { font-size: 11px; color: var(--muted); }
  .cam-grid input {
    width: 100%; font-family: var(--font-data); font-variant-numeric: tabular-nums;
    padding: 6px 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .exports { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .exports button { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); color: var(--accent); font-weight: 600; }
  #blockInfo { min-height: 80px; }
  #blockInfo .muted, .muted { color: var(--muted); font-size: 12.5px; }
  dl.info { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 12.5px; }
  dl.info dt { color: var(--muted); white-space: nowrap; }
  dl.info dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; min-width: 0; }
  .pill { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; font-family: var(--font-body); }
  .src-error { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .src-balance { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .src-kept, .src-root { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .nb { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-family: var(--font-body) !important; }
  #errorBar {
    background: color-mix(in srgb, var(--bad) 14%, var(--panel)); color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line));
    border-radius: 10px; padding: 9px 12px; font-size: 13px;
  }
  .hint { font-size: 11.5px; color: var(--muted); }
  @media (max-width: 880px) {
    body { height: auto; }
    .app { grid-template-columns: 1fr; height: auto; }
    #viewport { min-height: 46vh; }
    .stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>

<div class="app">
  <div class="stage">
    <div class="topbar">
      <h1>分级地形接缝检查器</h1>
      <span class="sub">四叉树 LOD · 真共享顶点扇形接缝 · 无裙边</span>
    </div>
    <div id="viewport">
      <div class="legend">
        <div class="row"><span class="seam-dot"></span> 接缝（不同层级共享边，已焊接）</div>
        <div id="levelLegend"></div>
      </div>
    </div>
    <div class="validity" id="validity">等待求解…</div>
    <div class="stats" id="stats"></div>
  </div>

  <aside class="panel">
    <div class="group">
      <h2>样例工况</h2>
      <div id="samples">
        <button data-sample="flat.json">平地 flat</button>
        <button data-sample="peak.json">山峰 peak</button>
        <button data-sample="ridge.json">山脊 ridge</button>
        <button data-sample="capacity.json">容量 128²</button>
      </div>
      <label class="file-btn">加载自定义高度场 JSON
        <input type="file" id="fileInput" accept=".json,application/json">
      </label>
      <div id="errorBar" hidden></div>
    </div>

    <div class="group">
      <h2>像素误差阈值</h2>
      <label class="control">
        <input type="range" id="pixelError" min="0.1" max="16" step="0.1" value="4">
        <span class="pe-val" id="peVal">4</span>
      </label>
      <span class="hint">ρ = E·f / max(D, near) 超过阈值且块大于 2×2 即拆分</span>
    </div>

    <div class="group">
      <h2>显示</h2>
      <div class="checks">
        <label><input type="checkbox" id="togWire" checked> 线框</label>
        <label><input type="checkbox" id="togLevel" checked> 层级颜色</label>
        <label><input type="checkbox" id="togSeam" checked> 接缝标记</label>
      </div>
    </div>

    <div class="group">
      <h2>相机位置（拖动视口同步）</h2>
      <div class="cam-grid">
        <div><label>X</label><input id="camX" type="number" step="0.5"></div>
        <div><label>Y</label><input id="camY" type="number" step="0.5"></div>
        <div><label>Z</label><input id="camZ" type="number" step="0.5"></div>
      </div>
      <span class="hint">左键旋转 · 右键平移 · 滚轮缩放；移动即重算 LOD</span>
    </div>

    <div class="group">
      <h2>块信息（点选）</h2>
      <div id="blockInfo"><p class="muted">点击地形上的任意块，查看误差、距离与拆分原因。</p></div>
    </div>

    <div class="group">
      <h2>导出</h2>
      <div class="exports">
        <button id="exportObj">导出 OBJ</button>
        <button id="exportJson">叶块/邻接 JSON</button>
      </div>
      <span class="hint">OBJ 为全局焊接顶点、逆时针朝上；JSON 含每块 E、D、屏幕误差、拆分来源与四邻。</span>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="js/app.js"></script>
