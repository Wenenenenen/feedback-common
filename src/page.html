<title>出线推演台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*__STYLES__*/
</style>

<div class="shell">
  <header class="mast">
    <div class="mast-top">
      <div style="min-width:0">
        <p class="eyebrow">League cutline witness</p>
        <h1>出线推演台</h1>
        <p class="lede">把剩下的比赛逐组展开，精确数出每支队伍出线、未出线的完整赛果。同分时先按组内交手积分、组内局差重算，分组里排掉第三队后再接着算——榜首有时就在这一步换人。赛前拿它给解说报可能的赛果。</p>
      </div>
      <div class="mast-actions">
        <button class="btn" data-act="rules">规则</button>
        <button class="btn" data-act="import-open">导入数据</button>
        <button class="btn primary" id="export-btn" data-act="export">导出统计与赛果</button>
      </div>
    </div>
  </header>

  <main>
    <section class="tiles" aria-label="总览"></section>

    <section class="controls" aria-label="控制">
      <span class="ctl-label">出线名额</span>
      <div class="stepper">
        <button id="q-minus" aria-label="减少出线名额">−</button>
        <span class="val" id="q-val" aria-live="polite">2</span>
        <button id="q-plus" aria-label="增加出线名额">+</button>
      </div>
      <button class="btn sm" id="unlock-all" data-act="unlock-all">解除全部锁定</button>
      <span class="ctl-sep" aria-hidden="true"></span>
      <div class="progress">
        <span class="status" id="status">等待计算</span>
        <div class="progress-bar" aria-hidden="true"><i></i></div>
      </div>
      <span class="mono-note" id="dataset-note">示例数据</span>
    </section>

    <section class="grid">
      <div class="ledger">
        <div class="card">
          <div class="card-head">
            <h2>出线统计</h2>
            <span class="hint">完整赛果精确计数 · 点右侧按钮看该类的第一组可复演赛果</span>
          </div>
          <ul class="team-list" id="team-list" aria-live="polite"></ul>
        </div>
        <div class="card" style="margin-top:16px">
          <div class="card-head">
            <h2>已结束的比赛</h2>
            <span class="hint">总榜与小榜都只统计列出的比赛</span>
          </div>
          <div class="card-body" style="padding-top:10px">
            <div class="fixtures" id="fixture-list"></div>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="card">
          <div class="card-head">
            <h2>锁定比分</h2>
            <span class="hint">点候选比分即锁；再点一次解除</span>
          </div>
          <div class="card-body" style="padding-top:8px">
            <div class="lock-list" id="lock-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="card scenario" id="scenario" aria-live="polite"></section>

    <p class="mono-note" style="text-align:right">枚举在本机完成，不上传任何数据。候选用“比赛编号 · 候选位置”记录，位置从 0 开始。</p>
  </main>
</div>

<div class="overlay hidden" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-hidden="true">
  <div class="modal">
    <div class="modal-head">
      <h2 id="dlg-title">导入数据</h2>
      <button class="btn sm" data-close aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="dlg-body"></div>
    <div class="modal-foot" id="dlg-foot"></div>
  </div>
</div>

window.SAMPLE_DATA = /*__SAMPLE__*/;
window.SAMPLE_FLIP = /*__SAMPLE_FLIP__*/;
</script>
