<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>切缝展开 · Cut Chart Parameterizer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2360a5fa' stroke-width='3'/%3E%3Cpath d='M16 3v26M5 10l22 12' stroke='%23f59e0b' stroke-width='2.5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.2" />
            <path d="M16 3v26M5 10l22 12" stroke="var(--accent)" stroke-width="2.2" />
          </svg>
          <div class="brand-text">
            <h1>切缝展开参数化</h1>
            <p>Cut-Chart Parameterizer</p>
          </div>
        </div>

        <div class="toolbar">
          <label class="field">
            <span>样例</span>
            <select id="sample-select">
              <option value="">— 选择样例 —</option>
              <option value="cylinder-cut">圆柱（已切缝）</option>
              <option value="cylinder-uncut">圆柱（未切缝 · 应失败）</option>
              <option value="obtuse-disk">钝角圆盘</option>
              <option value="bowtie">蝴蝶顶点</option>
              <option value="nonmanifold">非流形边</option>
              <option value="degenerate">退化面</option>
            </select>
          </label>
          <button class="btn" id="btn-import">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            导入 JSON
          </button>
          <input type="file" id="file-input" accept=".json,application/json" hidden />
          <button class="btn primary" id="btn-export">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0l3.5-3.5M8 10L4.5 6.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            导出诊断 JSON
          </button>
        </div>
      </header>

      <main>
        <aside class="sidebar" id="sidebar">
          <section class="card" id="sec-overview">
            <header class="card-head">
              <h2>概览</h2>
              <span class="badge" id="validity-badge">未载入</span>
            </header>
            <div class="stats" id="stats"></div>
            <div class="mesh-meta" id="mesh-meta"></div>
          </section>

          <section class="card" id="sec-seams">
            <header class="card-head">
              <h2>切缝</h2>
              <span class="count" id="seam-count">0</span>
            </header>
            <p class="hint">在三维视图中左键点击边即可增删切缝；Shift + 点击选择面。</p>
            <div class="seam-list" id="seam-list"><p class="empty">暂无切缝</p></div>
            <div class="row-btns">
              <button class="btn small" id="btn-clear-seams">清空切缝</button>
              <button class="btn small" id="btn-auto-seam" title="沿最短测地路径连接两个极值点">自动切缝</button>
            </div>
          </section>

          <section class="card" id="sec-inspect">
            <header class="card-head">
              <h2>检查器</h2>
              <span class="count" id="inspect-tag">—</span>
            </header>
            <div class="inspect" id="inspect"><p class="empty">在三维视图或 UV 视图中选择一个面</p></div>
          </section>

          <section class="card" id="sec-charts">
            <header class="card-head">
              <h2>图表</h2>
              <span class="count" id="chart-count">0</span>
            </header>
            <div class="chart-list" id="chart-list"><p class="empty">暂无图表</p></div>
          </section>

          <section class="card grow" id="sec-diagnostics">
            <header class="card-head">
              <h2>诊断</h2>
              <span class="count" id="diag-count">0</span>
            </header>
            <div class="diag-list" id="diag-list"><p class="empty">暂无诊断</p></div>
          </section>

          <section class="card" id="sec-export">
            <header class="card-head"><h2>导出</h2></header>
            <p class="hint">JSON 内含逐角 UV、拆分顶点对应关系、图表拓扑、方程残差与诊断定位。</p>
            <div class="row-btns">
              <button class="btn small" id="btn-export-2">下载 JSON</button>
              <button class="btn small" id="btn-copy-uv">复制逐角 UV</button>
            </div>
            <div class="export-summary" id="export-summary"></div>
          </section>
        </aside>

        <section class="panel view3d">
          <header class="panel-head">
            <h2>三维预览</h2>
            <div class="toggles">
              <label class="toggle"><input type="checkbox" id="tg-wire" /> 线框</label>
              <label class="toggle"><input type="checkbox" id="tg-chart" checked /> 分图表着色</label>
              <label class="toggle"><input type="checkbox" id="tg-boundary" /> 图表边界</label>
              <label class="toggle"><input type="checkbox" id="tg-split" /> 拆分点</label>
              <label class="toggle"><input type="checkbox" id="tg-residual" /> 残差</label>
              <button class="btn icon" id="btn-fit3d" title="适配视图">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
            </div>
          </header>
          <div class="canvas-wrap" id="wrap3d">
            <canvas id="view3d"></canvas>
            <div class="hud" id="hud3d"></div>
            <div class="legend" id="legend3d"></div>
            <div class="empty-state" id="empty3d">导入网格或选择样例开始</div>
          </div>
          <footer class="panel-foot" id="foot3d">左键点击边：切换切缝 · Shift+点击：选择面 · 拖拽旋转 · 滚轮缩放</footer>
        </section>

        <section class="panel viewuv">
          <header class="panel-head">
            <h2>UV 视图</h2>
            <div class="toggles">
              <label class="toggle"><input type="checkbox" id="tg-uvgrid" checked /> 分栏显示</label>
              <label class="toggle"><input type="checkbox" id="tg-uvres" /> 残差着色</label>
              <button class="btn icon" id="btn-fituv" title="适配视图">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
            </div>
          </header>
          <div class="canvas-wrap" id="wrapuv">
            <canvas id="viewuv"></canvas>
            <div class="hud" id="huduv"></div>
            <div class="legend" id="legenduv"></div>
            <div class="empty-state" id="emptyuv">暂无 UV</div>
          </div>
          <footer class="panel-foot" id="footuv">每图表独立放到单位圆 · 导出保留各自单位圆坐标，分栏仅为显示</footer>
        </section>
      </main>

      <footer class="statusbar">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">就绪</span>
        <span class="spacer"></span>
        <span id="status-timing"></span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
