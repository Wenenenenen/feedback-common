<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铁路编组场调度</title>
<style>
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel-2: #f0f3f8;
    --text: #1c2433;
    --text-dim: #5b6678;
    --border: #d6dce6;
    --accent: #2563eb;
    --accent-soft: #dbe7fe;
    --good: #15803d;
    --good-soft: #dcfce7;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --bad: #b91c1c;
    --bad-soft: #fee2e2;
    --track: #94a3b8;
    --shadow: 0 1px 3px rgba(15, 23, 42, .12), 0 4px 14px rgba(15, 23, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141d;
      --panel: #171e2b;
      --panel-2: #1f2838;
      --text: #e6ebf4;
      --text-dim: #94a0b4;
      --border: #2c384c;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --good: #4ade80;
      --good-soft: #14361f;
      --warn: #fbbf24;
      --warn-soft: #3d2f0e;
      --bad: #f87171;
      --bad-soft: #451a1a;
      --track: #475569;
      --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 4px 14px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  .step-badge {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    border-radius: 8px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  button {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  select {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 8px;
  }
  main { flex: 1; display: flex; min-height: 0; }
  #board-wrap { flex: 1; min-width: 0; position: relative; background: var(--bg); }
  #board { width: 100%; height: 100%; display: block; }
  #sidebar {
    width: 360px;
    min-width: 300px;
    max-width: 420px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  @media (max-width: 860px) {
    main { flex-direction: column; overflow-y: auto; }
    #board-wrap { min-height: 420px; }
    #sidebar { width: 100%; max-width: none; border-left: none; border-top: 1px solid var(--border); }
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .card h2 {
    font-size: 13px;
    margin: 0 0 8px;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: .04em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .count { font-weight: 400; }
  .switch-row { display: flex; flex-direction: column; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .switch-row:last-child { border-bottom: none; }
  .switch-meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
  .switch-id { font-weight: 700; }
  .lock-tag { font-size: 12px; border-radius: 6px; padding: 2px 8px; }
  .lock-tag.locked { background: var(--bad-soft); color: var(--bad); }
  .lock-tag.free { background: var(--good-soft); color: var(--good); }
  .pos-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .pos-btn { position: relative; padding: 5px 10px; }
  .pos-btn.current { outline: 2px solid var(--good); }
  .pos-btn.pending { outline: 2px dashed var(--accent); background: var(--accent-soft); }
  .switch-note { font-size: 12px; color: var(--text-dim); }
  .train-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent;
  }
  .train-item:hover { background: var(--accent-soft); }
  .train-item.selected { border-color: var(--accent); background: var(--accent-soft); }
  .train-dot { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  .train-item .name { font-weight: 700; }
  .train-item .status { margin-left: auto; font-size: 12px; color: var(--text-dim); text-align: right; }
  .status.moved { color: var(--good); }
  .status.waiting { color: var(--warn); }
  .status.arrived { color: var(--accent); }
  #train-detail { font-size: 13px; line-height: 1.7; }
  #train-detail .kv { color: var(--text-dim); }
  .reason-box {
    border-radius: 8px; padding: 8px 10px; margin-top: 6px;
    background: var(--warn-soft); color: var(--warn);
    border: 1px solid var(--warn);
  }
  .reason-box.ok { background: var(--good-soft); color: var(--good); border-color: var(--good); }
  .route-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip {
    font-size: 12px; border-radius: 6px; padding: 1px 7px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .chip.head { border-color: var(--good); color: var(--good); font-weight: 700; }
  #log { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .log-row {
    font-size: 12px; padding: 5px 8px; border-radius: 6px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border);
    line-height: 1.5;
  }
  .log-row:hover { border-color: var(--accent); }
  .log-row.current { border-color: var(--accent); background: var(--accent-soft); }
  .log-row .n { font-weight: 700; color: var(--accent); }
  .tag { font-size: 11px; border-radius: 5px; padding: 0 6px; margin: 0 2px; }
  .tag.ok { background: var(--good-soft); color: var(--good); }
  .tag.no { background: var(--bad-soft); color: var(--bad); }
  textarea {
    width: 100%; min-height: 110px; resize: vertical;
    font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  .load-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #msg {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 16px; box-shadow: var(--shadow);
    font-weight: 700; z-index: 5; display: none; max-width: 80%;
  }
  #msg.show { display: block; }
  #msg.bad { border-color: var(--bad); color: var(--bad); }
  #msg.good { border-color: var(--good); color: var(--good); }
  #msg.warn { border-color: var(--warn); color: var(--warn); }
  .verdict-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .verdict-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .svg-edge { stroke: var(--track); stroke-width: 3; fill: none; }
  .svg-block { fill: var(--panel); stroke: var(--track); stroke-width: 2; }
  .svg-block.switch { stroke: var(--accent); }
  .svg-block-label { fill: var(--text); font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .svg-switch-tag { fill: var(--accent); font-size: 9px; text-anchor: middle; font-weight: 700; }
  .svg-route { fill: none; stroke-width: 2.5; stroke-dasharray: 7 5; opacity: .85; }
  .svg-route-num { font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #fff; }
  .svg-marker { font-size: 10px; font-weight: 800; text-anchor: middle; dominant-baseline: central; fill: #fff; }
  .wait-target-ring { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 4 3; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .file-label { position: relative; overflow: hidden; }
  .file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  kbd {
    background: var(--panel); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 5px; padding: 0 5px; font-size: 11px; font-family: inherit;
  }
</style>
</head>
<body>
<header>
  <h1>铁路编组场调度</h1>
  <span class="step-badge" id="step-badge">第 0 步</span>
  <span id="arrived-badge" class="step-badge" style="background:var(--panel-2);color:var(--text-dim)">到站 0/0</span>
  <div class="toolbar">
    <button id="btn-step" class="primary" title="快捷键：空格">单步推进</button>
    <button id="btn-run" title="连续运行，再次点击暂停">连续运行</button>
    <select id="speed" title="连续运行速度">
      <option value="1200">慢速</option>
      <option value="700" selected>常速</option>
      <option value="300">快速</option>
    </select>
    <button id="btn-back" title="回到上一步">← 上一步</button>
    <button id="btn-reset" class="danger" title="快捷键：R">重来</button>
    <button id="btn-check">检查到站</button>
    <button id="btn-export">导出记录</button>
  </div>
</header>
<main>
  <div id="board-wrap">
    <div id="msg"></div>
    <svg id="board" role="img" aria-label="轨道示意图"></svg>
  </div>
  <aside id="sidebar">
    <div class="card">
      <h2>道岔控制 <span class="hint" id="switch-hint">点击方向挂起请求，下一步步首检查</span></h2>
      <div id="switch-panel"><div class="hint">无关卡数据</div></div>
    </div>
    <div class="card">
      <h2>列车 <span class="count" id="train-count"></span></h2>
      <div id="train-list"></div>
      <div id="train-detail" class="hint" style="margin-top:8px">点击列车或图上车身，查看本步动作与等待原因。</div>
    </div>
    <div class="card">
      <h2>逐步日志</h2>
      <div id="log"><div class="hint">尚未推进。</div></div>
    </div>
    <div class="card">
      <h2>载入关卡 / 操作表（JSON）</h2>
      <textarea id="json-input" spellcheck="false" placeholder='{"edges":[...],"switches":[...],"trains":[...],"commands":[[步号,"道岔","方向"],...]}'></textarea>
      <div class="load-row">
        <button id="btn-load-text">载入文本</button>
        <button class="file-label">选择文件<input type="file" id="file-input" accept=".json,application/json"></button>
        <button id="btn-load-sample">载入样例</button>
      </div>
      <div id="load-msg" class="hint" style="margin-top:8px"></div>
      <p class="hint" style="margin-bottom:0">
        约束：最多 80 个轨道块、16 列车。可选 <code>positions</code> 字段给轨道块指定坐标，如
        <code>{"A0":[80,120]}</code>；不提供则自动布局。
      </p>
    </div>
  </aside>
</main>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
