<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-Fail 阴影体逐像素校验</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f26; --panel2: #23262f; --line: #33363f;
    --fg: #d7dae0; --dim: #8a8f9a; --accent: #5b9dff; --bad: #ff5555; --ok: #4cc38a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 "SF Mono", "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
    display: grid; grid-template-columns: 250px 1fr 330px; gap: 10px; padding: 10px;
    min-height: 100vh;
  }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; color: var(--dim); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .row label { flex: 0 0 62px; color: var(--dim); }
  input[type=number], select {
    width: 100%; background: var(--panel2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit;
  }
  input[type=number] { width: 64px; }
  .xyz { display: flex; gap: 4px; flex: 1; }
  .xyz input { width: 100%; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; margin: 2px 4px 2px 0;
  }
  button:hover { border-color: var(--accent); }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; padding: 6px 10px; }
  legend { color: var(--dim); padding: 0 4px; }
  label.radio { display: block; margin: 3px 0; cursor: pointer; }
  #stage { overflow: auto; text-align: center; }
  #view { image-rendering: pixelated; background: #000; cursor: crosshair; border: 1px solid var(--line); }
  #status { margin-top: 8px; color: var(--dim); white-space: pre-wrap; text-align: left; }
  #status .bad { color: var(--bad); } #status .ok { color: var(--ok); }
  table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px; }
  th, td { border: 1px solid var(--line); padding: 2px 6px; text-align: right; }
  th { color: var(--dim); font-weight: normal; }
  td.l, th.l { text-align: left; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px; }
  .pill.side { background: #4a3a10; color: #ffd76a; }
  .pill.capNear { background: #0e3a4a; color: #6ad9ff; }
  .pill.capFar { background: #4a1040; color: #ff6ae0; }
  .verdict { padding: 6px 8px; border-radius: 6px; margin: 6px 0; }
  .verdict.ok { background: #10321f; color: var(--ok); }
  .verdict.bad { background: #3a1414; color: var(--bad); }
  .hint { color: var(--dim); font-size: 12px; }
  #inspNone { color: var(--dim); }
</style>
</head>
<body>
  <div class="panel" id="controls">
    <h1>Z-Fail 阴影体逐像素校验</h1>
    <div class="row"><label>场景文件</label><input type="file" id="file" accept=".json" style="flex:1;font-size:11px"></div>
    <div class="row"><button id="reset">重置为样例</button><span class="hint" id="sceneInfo"></span></div>

    <h2>光源</h2>
    <div class="row"><label>位置</label><div class="xyz">
      <input type="number" id="lx" step="0.1"><input type="number" id="ly" step="0.1"><input type="number" id="lz" step="0.1">
    </div></div>

    <h2>相机</h2>
    <div class="row"><label>机位</label><div class="xyz">
      <input type="number" id="ex" step="0.1"><input type="number" id="ey" step="0.1"><input type="number" id="ez" step="0.1">
    </div></div>
    <div class="row"><label>目标</label><div class="xyz">
      <input type="number" id="tx" step="0.1"><input type="number" id="ty" step="0.1"><input type="number" id="tz" step="0.1">
    </div></div>
    <div class="row"><label>fovy / near</label>
      <input type="number" id="fovy" step="1" style="width:60px">
      <input type="number" id="near" step="0.05" min="0.001" style="width:70px">
    </div>

    <h2>分辨率</h2>
    <div class="row"><label>宽 × 高</label>
      <input type="number" id="rw" min="1" max="192" style="width:60px">
      <input type="number" id="rh" min="1" max="144" style="width:60px">
    </div>

    <h2>视图</h2>
    <fieldset><legend>模式</legend>
      <label class="radio"><input type="radio" name="view" value="shaded" checked> 阴影(光照)</label>
      <label class="radio"><input type="radio" name="view" value="depth"> 深度</label>
      <label class="radio"><input type="radio" name="view" value="stencil"> 模板计数</label>
      <label class="radio"><input type="radio" name="view" value="diff"> 差异(对照射线)</label>
      <label class="radio"><input type="radio" name="view" value="wire"> 体积线框</label>
    </fieldset>
    <div class="row"><label><input type="checkbox" id="overlayWire"> 叠加线框</label></div>
    <div class="row"><label>缩放</label><select id="zoom">
      <option value="0">自动</option><option>2</option><option>4</option><option>6</option>
      <option>8</option><option>10</option><option>12</option><option>16</option>
    </select></div>

    <h2>导出</h2>
    <div class="row">
      <button id="dlStencil">模板值 CSV</button>
      <button id="dlDiff">差异图 PNG</button>
      <button id="dlView">当前视图 PNG</button>
    </div>
    <h2>校验</h2>
    <div class="row"><button id="jumpBad">跳到第一个不一致像素</button></div>
  </div>

  <div class="panel" id="stage">
    <canvas id="view"></canvas>
    <div id="status"></div>
  </div>

  <div class="panel" id="inspector">
    <h1>像素检查</h1>
    <div id="inspNone">点击画面像素,查看参与计数的侧面/封盖,并与到光源的遮挡射线对照。</div>
    <div id="inspBody" style="display:none">
      <div class="row"><label>像素</label><span id="iPix"></span></div>
      <div class="row"><label>世界坐标</label><span id="iPos"></span></div>
      <div class="row"><label>深度/模板</label><span id="iDS"></span></div>
      <div id="iVerdict"></div>
      <h2>体积三角形贡献</h2>
      <div id="iContribs"></div>
      <h2>遮挡射线(点 → 光源)</h2>
      <div id="iRay"></div>
    </div>
  </div>

  <script src="zfail-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
