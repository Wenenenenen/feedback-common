<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局部频谱修复</title>
<style>
  :root {
    --bg: #14171c; --panel: #1d2129; --panel2: #232834; --border: #333a47;
    --text: #d8dee9; --dim: #8a93a5; --accent: #4f9cf9; --accent2: #f9a44f;
    --danger: #e05c5c; --ok: #58c98b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin-right: 12px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #infoBar { padding: 4px 12px; background: var(--panel); border-bottom: 1px solid var(--border); color: var(--dim); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  #infoBar .warn { color: var(--accent2); }
  #transport { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #progressWrap { flex: 1; max-width: 300px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; display: none; }
  #progressBar { height: 100%; background: var(--accent); width: 0%; }
  #statusText { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  #sidebar h2 { font-size: 12px; color: var(--dim); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: 1px; }
  #boxList { flex: 1; overflow-y: auto; padding: 0 8px; }
  .boxItem { padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 5px; cursor: pointer; font-size: 12px; }
  .boxItem.selected { border-color: var(--accent); background: var(--panel2); }
  .boxItem .off { color: var(--dim); }
  #editor { border-top: 1px solid var(--border); padding: 10px; }
  #editor .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #editor label { width: 62px; color: var(--dim); flex-shrink: 0; font-size: 12px; }
  #editor input[type=number] { width: 70px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 3px; padding: 2px 5px; font-size: 12px; }
  #editor input[type=range] { flex: 1; }
  #display { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #waveWrap { height: 110px; border-bottom: 1px solid var(--border); position: relative; }
  #specWrap { flex: 1; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #specCanvas { cursor: crosshair; }
  #hint { padding: 4px 12px; color: var(--dim); font-size: 11px; background: var(--panel); border-top: 1px solid var(--border); }
  #emptyTip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 14px; pointer-events: none; }
  .chk { display: flex; align-items: center; gap: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>局部频谱修复</h1>
  <button id="btnImport">导入 WAV</button>
  <button id="btnSaveProj" disabled>保存工程</button>
  <button id="btnLoadProj">载入工程</button>
  <span style="flex:1"></span>
  <button id="btnUndo" disabled>撤销</button>
  <button id="btnRedo" disabled>重做</button>
  <button id="btnExport" class="primary" disabled>导出 WAV</button>
  <input type="file" id="fileWav" accept=".wav,audio/wav" hidden>
  <input type="file" id="fileProj" accept=".json" hidden>
</header>
<div id="infoBar"><span id="fileInfo">未加载音频（支持 44.1/48kHz、16/24 位 PCM、单/双声道、≤60 秒）</span></div>
<div id="transport">
  <button id="btnPlayOrig" disabled>▶ 原音</button>
  <button id="btnPlayProc" disabled>▶ 处理后</button>
  <button id="btnStop" disabled>■ 停止</button>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <span id="statusText"></span>
</div>
<main>
  <div id="sidebar">
    <h2>修复选框</h2>
    <div id="boxList"></div>
    <div id="editor" style="display:none">
      <div class="row"><label>启用</label><input type="checkbox" id="edEnabled"></div>
      <div class="row"><label>时间 (s)</label><input type="number" id="edStart" step="0.01" min="0"> — <input type="number" id="edEnd" step="0.01" min="0"></div>
      <div class="row"><label>频率 (Hz)</label><input type="number" id="edLow" step="1" min="0"> — <input type="number" id="edHigh" step="1" min="0"></div>
      <div class="row"><label>衰减</label><input type="range" id="edAtten" min="0" max="60" step="0.5"><input type="number" id="edAttenNum" min="0" max="60" step="0.5" style="width:56px"> dB</div>
      <div class="row" id="chanRow"><label>声道</label><span id="edChans"></span></div>
      <div class="row"><button id="btnDelBox" style="color:var(--danger)">删除选框</button></div>
    </div>
  </div>
  <div id="display">
    <div id="waveWrap"><canvas id="waveCanvas"></canvas></div>
    <div id="specWrap"><canvas id="specCanvas"></canvas><div id="emptyTip">导入 WAV 后，在频谱图上拖拽框选哨音区域</div></div>
  </div>
</main>
<div id="hint">滚轮：时间缩放（指向位置）· Shift+滚轮：时间平移 · Alt+滚轮：频率缩放 · 拖拽空白：新建选框 · 拖拽框体/边缘：移动/缩放 · Delete：删除选中框</div>
<script src="dsp.js"></script>
<script src="app.js"></script>
</body>
</html>
