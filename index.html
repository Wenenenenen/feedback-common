<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crease Subdivision Lab — 带折痕的 Catmull-Clark 细分预览</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Crease Subdivision Lab</h1>
  <span class="sub">带折痕的 Catmull-Clark 细分预览 · 自实现 · 无几何库</span>
</header>
<main>
  <aside id="panel">
    <section>
      <h2>导入网格</h2>
      <div id="drop-zone">拖拽 JSON 文件到这里，或
        <label class="btn">选择文件<input type="file" id="file-input" accept=".json" hidden></label>
      </div>
      <label class="row">内置样例
        <select id="example-select"></select>
      </label>
      <div id="messages"></div>
    </section>

    <section>
      <h2>细分级别</h2>
      <div id="level-buttons" class="btn-row">
        <button data-level="0">0 控制网格</button>
        <button data-level="1">1</button>
        <button data-level="2">2</button>
        <button data-level="3">3</button>
      </div>
    </section>

    <section>
      <h2>显示</h2>
      <label class="row"><input type="checkbox" id="opt-shaded" checked> 着色</label>
      <label class="row"><input type="checkbox" id="opt-wireframe" checked> 线框</label>
      <label class="row"><input type="checkbox" id="opt-control" checked> 控制网格</label>
      <label class="row"><input type="checkbox" id="opt-control-top" checked> 控制网格置顶</label>
    </section>

    <section>
      <h2>统计</h2>
      <table id="stats-table" class="stats"></table>
      <h3>非流形边报告</h3>
      <div id="nonmanifold"></div>
    </section>

    <section>
      <h2>顶点信息</h2>
      <div id="vertex-info"><p class="dim">点击网格顶点查看其计算规则</p></div>
    </section>

    <section>
      <h2>导出</h2>
      <div class="btn-row">
        <button id="export-obj">导出 OBJ</button>
        <button id="export-json">导出顶点来源 JSON</button>
      </div>
    </section>
  </aside>
  <div id="viewport">
    <canvas id="view"></canvas>
    <div id="hint">左键旋转 · Shift/右键平移 · 滚轮缩放 · 点击顶点查看规则</div>
  </div>
</main>
<script src="js/cc.js"></script>
<script src="js/examples.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
