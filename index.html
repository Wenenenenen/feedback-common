<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作组屏障回放器</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2638; --line: #2a3550;
    --fg: #dbe4f5; --dim: #8b98b5; --accent: #5aa2ff; --ok: #4cc38a;
    --err: #f06a6a; --warn: #e8b64c; --hl: #3a2f14;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "SF Mono", Consolas, "Courier New", monospace; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
  main { padding: 16px 20px; max-width: 1280px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--dim); }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: bold; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=number], input[type=text] { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; width: 90px; }
  select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  textarea { width: 100%; min-height: 90px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 monospace; padding: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stat { color: var(--dim); } .stat b { color: var(--fg); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; }
  .badge.ok { background: #14351f; color: var(--ok); }
  .badge.err { background: #3d1a1a; color: var(--err); }
  .badge.dim { background: var(--panel2); color: var(--dim); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  th { background: var(--panel2); color: var(--dim); font-weight: normal; }
  td.hl { background: var(--hl); color: var(--warn); font-weight: bold; }
  .errbox { background: #2a1416; border: 1px solid var(--err); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
  .errbox h2 { color: var(--err); }
  .errbox code { color: var(--warn); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .scroll { overflow-x: auto; }
  .muted { color: var(--dim); font-size: 12px; }
  .conflict-item { border: 1px solid var(--warn); border-radius: 6px; padding: 8px 12px; margin: 6px 0; background: #241d10; }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>工作组屏障回放器</h1>
  <p>确定性回放计算着色器工作组: 阶段化提交 · 冲突检测 · 屏障一致性 · 越界/超限定位。上限: 2048 组 × 32 线程, 累计 200 万条指令。</p>
</header>
<main>
  <section>
    <h2>1. 导入程序</h2>
    <div class="row">
      <input type="file" id="file" accept=".json,application/json">
      <button id="loadSample">载入示例</button>
      <button id="runBtn" class="primary">运行</button>
    </div>
    <details>
      <summary>或直接粘贴 JSON(格式见 samples/workgroup-reel.json)</summary>
      <textarea id="paste" spellcheck="false" placeholder='{"groups":2,"lanes":2,"sharedWords":2,"outputWords":2,"program":[...]}'></textarea>
    </details>
    <div id="importMsg" class="muted"></div>
  </section>

  <section id="statusSec" hidden>
    <h2>2. 运行结果</h2>
    <div class="row">
      <span id="verdict"></span>
      <span class="stat">指令: <b id="stInstr"></b></span>
      <span class="stat">完成组: <b id="stGroups"></b></span>
      <span class="stat">耗时: <b id="stTime"></b></span>
    </div>
  </section>

  <div id="errBox" class="errbox" hidden></div>

  <section id="explorer" hidden>
    <h2>3. 按组查看</h2>
    <div class="row">
      <label>组 <input type="number" id="groupIdx" min="0" value="0"></label>
      <button id="grpPrev">← 上一组</button>
      <button id="grpNext">下一组 →</button>
      <span id="grpStatus" class="badge dim"></span>
      <label>阶段 <select id="phaseSel"></select></label>
      <button id="dlGroup">下载本组输出</button>
      <button id="dlAll">下载全部组输出</button>
    </div>

    <div class="grid2">
      <div>
        <h3>线程停点(本阶段结束时)</h3>
        <div class="scroll"><table id="stopTable">
          <thead><tr><th>线程</th><th>状态</th><th>PC</th><th>指令</th></tr></thead>
          <tbody></tbody>
        </table></div>
      </div>
      <div>
        <h3>冲突地址</h3>
        <div id="conflictList" class="muted">无</div>
        <h3>本阶段提交的写入</h3>
        <div id="commitList" class="muted">无</div>
      </div>
    </div>

    <h3>提交后的内存</h3>
    <div class="row">
      <label>区 <select id="memRegion"><option value="0">shared(共享区)</option><option value="1">output(输出区)</option></select></label>
      <label>起始地址 <input type="number" id="memOff" min="0" value="0"></label>
      <label>进制 <select id="memFmt"><option value="hex">十六进制</option><option value="dec">十进制</option></select></label>
      <span class="muted">黄色 = 本阶段提交写入的地址</span>
    </div>
    <div class="scroll"><table id="memTable">
      <thead><tr><th>地址</th><th>值</th><th>地址</th><th>值</th><th>地址</th><th>值</th><th>地址</th><th>值</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>
</main>

<script src="reel.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var result = null;
  var curGroup = 0;
  var curPhase = 0; // 索引进 phases; 等于 phases.length 时表示失败阶段
  var MEM_ROWS = 32; // 每页 32 行 x 4 列 = 128 字

  var SAMPLE_FALLBACK = '{"groups":2,"lanes":2,"sharedWords":2,"outputWords":2,"program":[["set","r0","lane"],["store","shared","lane","r0"],["barrier"],["xor","r1","lane",1],["load","r2","shared","r1"],["store","output","lane","r2"],["halt"]],"说明":"组号、线程号、字地址和指令号从0起。操作数为u32字面量、r加十进制编号的寄存器、group或lane。add和xor参数为目标、左、右。jz参数为值、绝对指令号。load参数为目标、区、地址，store为区、地址、值。set参数为目标、值。"}';

  var KIND_NAMES = {
    'invalid-program': '程序格式错误',
    'jump-oob': '跳转越界',
    'mem-oob': '访存越界',
    'barrier-diverge': '屏障不一致',
    'conflict': '访存冲突',
    'limit': '指令数超限'
  };
  var ST_NAMES = ['屏障', '已结束', '错误', '未运行'];

  function setImportMsg(t, isErr) {
    var el = $('importMsg');
    el.textContent = t;
    el.style.color = isErr ? 'var(--err)' : 'var(--dim)';
  }

  function runSpec(spec, sourceName) {
    try {
      result = Reel.run(spec);
    } catch (e) {
      setImportMsg('运行异常: ' + (e && e.message), true);
      return;
    }
    curGroup = 0; curPhase = 0;
    renderAll(sourceName);
  }

  function loadJSONText(text, sourceName) {
    var spec;
    try { spec = JSON.parse(text); }
    catch (e) { setImportMsg('JSON 解析失败: ' + e.message, true); return; }
    runSpec(spec, sourceName);
  }

  $('file').addEventListener('change', function (ev) {
    var f = ev.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { loadJSONText(String(rd.result), f.name); };
    rd.onerror = function () { setImportMsg('读取文件失败', true); };
    rd.readAsText(f);
  });

  $('loadSample').addEventListener('click', function () {
    if (typeof fetch === 'function') {
      fetch('samples/workgroup-reel.json').then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.text();
      }).then(function (t) { loadJSONText(t, 'samples/workgroup-reel.json'); })
       .catch(function () { loadJSONText(SAMPLE_FALLBACK, '内置示例'); });
    } else {
      loadJSONText(SAMPLE_FALLBACK, '内置示例');
    }
  });

  $('runBtn').addEventListener('click', function () {
    var t = $('paste').value.trim();
    if (!t) { setImportMsg('请先选择文件、载入示例或粘贴 JSON', true); return; }
    loadJSONText(t, '粘贴内容');
  });

  // ---------- 渲染 ----------

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  function instText(pc) {
    if (!result || !result.config) return '';
    var texts = result.config.programTexts;
    if (pc >= 0 && pc < texts.length) return pc + ': ' + texts[pc];
    return pc + ': (程序末尾)';
  }

  function renderAll(sourceName) {
    var r = result;
    setImportMsg('已运行: ' + sourceName, false);
    $('statusSec').hidden = false;
    var v = $('verdict');
    if (r.ok) { v.innerHTML = '<span class="badge ok">成功</span>'; }
    else { v.innerHTML = '<span class="badge err">失败: ' + esc(KIND_NAMES[r.error.kind] || r.error.kind) + '</span>'; }
    $('stInstr').textContent = r.instructionsExecuted.toLocaleString() + ' / ' + (r.config ? r.config.maxInstructions.toLocaleString() : '?');
    $('stGroups').textContent = r.groupsCompleted + ' / ' + (r.config ? r.config.groups : 0);
    $('stTime').textContent = r.elapsedMs.toFixed(1) + ' ms';

    renderError();
    var hasGroups = r.groups.length > 0;
    $('explorer').hidden = !hasGroups;
    if (hasGroups) {
      var gi = $('groupIdx');
      gi.max = r.groups.length - 1;
      gi.value = 0;
      renderGroup();
    }
  }

  function renderError() {
    var e = result.error;
    var box = $('errBox');
    if (!e) { box.hidden = true; box.innerHTML = ''; return; }
    var h = '<h2>失败详情</h2><div>';
    h += '<div>类型: <code>' + esc(KIND_NAMES[e.kind] || e.kind) + '</code> — ' + esc(e.message || '') + '</div>';
    if (e.group !== undefined) h += '<div>组: <code>' + e.group + '</code> 阶段: <code>' + e.phase + '</code></div>';
    if (e.lane !== undefined) h += '<div>线程: <code>' + e.lane + '</code> 指令: <code>' + esc(instText(e.pc)) + '</code></div>';
    if (e.kind === 'barrier-diverge' && e.locations) {
      h += '<div>各停点:</div><ul>';
      e.locations.forEach(function (loc) {
        h += '<li>' + esc(ST_NAMES[loc.state]) + ' @ ' + esc(instText(loc.pc)) + ' — 线程 ' + loc.lanes.join(', ') + '</li>';
      });
      h += '</ul>';
    }
    if (e.kind === 'conflict' && e.conflicts) {
      h += '<div>冲突地址 ' + e.conflicts.length + ' 个(详见下方"冲突地址")</div>';
    }
    h += '<div class="muted">已保留上次成功提交的输出; 出错阶段未提交。</div></div>';
    box.innerHTML = h;
    box.hidden = false;
  }

  function groupResult() { return result.groups[curGroup]; }

  function phaseCount() {
    var g = groupResult();
    return g.phases.length + (g.failedPhase ? 1 : 0);
  }

  function currentPhase() {
    var g = groupResult();
    if (curPhase < g.phases.length) return { ph: g.phases[curPhase], committed: true };
    return { ph: g.failedPhase, committed: false };
  }

  function renderGroup() {
    var g = groupResult();
    if (!g) return;
    var st = $('grpStatus');
    if (g.completed) { st.textContent = '已完成 · ' + g.phases.length + ' 个阶段'; st.className = 'badge ok'; }
    else { st.textContent = '失败于阶段 ' + g.failedPhase.index; st.className = 'badge err'; }

    var sel = $('phaseSel');
    sel.innerHTML = '';
    for (var i = 0; i < phaseCount(); i++) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = (i < g.phases.length) ? ('阶段 ' + i + '(已提交)') : ('阶段 ' + i + '(失败, 未提交)');
      sel.appendChild(opt);
    }
    if (curPhase >= phaseCount()) curPhase = phaseCount() - 1;
    if (g.failedPhase) curPhase = phaseCount() - 1; // 默认跳到失败阶段
    sel.value = curPhase;
    renderPhase();
  }

  function renderPhase() {
    var g = groupResult();
    var cur = currentPhase();
    var ph = cur.ph;
    if (!ph) return;

    // 线程停点
    var tb = $('stopTable').querySelector('tbody');
    tb.innerHTML = '';
    for (var lane = 0; lane < g.lanes; lane++) {
      var tr = document.createElement('tr');
      var st = ph.stopStates[lane];
      tr.innerHTML = '<td>' + lane + '</td><td>' + esc(ST_NAMES[st]) + '</td><td>' + ph.stopPCs[lane] +
        '</td><td>' + esc(instText(ph.stopPCs[lane])) + '</td>';
      if (st === Reel.ST.ERROR) tr.style.color = 'var(--err)';
      tb.appendChild(tr);
    }

    // 冲突地址
    var cl = $('conflictList');
    var conflicts = ph.conflicts || [];
    if (conflicts.length === 0) {
      cl.textContent = '无'; cl.className = 'muted';
    } else {
      cl.className = '';
      cl.innerHTML = conflicts.map(function (c) {
        var h = '<div class="conflict-item"><b>' + Reel.REGION_NAMES[c.region] + '[' + c.addr + ']</b>';
        h += '<br>写入: ' + c.writers.map(function (w) {
          return '线程' + w.lane + ' @ ' + esc(instText(w.pc)) + ' = 0x' + (w.value >>> 0).toString(16);
        }).join('; ');
        if (c.readers.length) h += '<br>读取: ' + c.readers.map(function (rd) { return '线程' + rd.lane + ' @ ' + esc(instText(rd.pc)); }).join('; ');
        return h + '</div>';
      }).join('');
    }

    // 本阶段提交的写入
    var cm = $('commitList');
    if (!cur.committed) {
      cm.textContent = '本阶段未提交(失败前保留上次成功输出)'; cm.className = 'muted';
    } else {
      var items = [];
      for (var rg = 0; rg < 2; rg++) {
        var ca = ph.commits[rg].addr, cv = ph.commits[rg].value;
        for (var j = 0; j < ca.length && items.length < 200; j++) {
          items.push(Reel.REGION_NAMES[rg] + '[' + ca[j] + '] = 0x' + (cv[j] >>> 0).toString(16));
        }
      }
      var total = ph.commits[0].addr.length + ph.commits[1].addr.length;
      cm.className = items.length ? '' : 'muted';
      cm.innerHTML = items.length
        ? '<div class="scroll">' + items.join('<br>') + (total > items.length ? '<br>… 共 ' + total + ' 条' : '') + '</div>'
        : '无写入';
    }

    renderMemory();
  }

  function renderMemory() {
    var g = groupResult();
    var cur = currentPhase();
    // 失败阶段显示的是上次成功提交后的内存
    var memPhaseIdx = cur.committed ? curPhase : curPhase - 1;
    var mem = Reel.memoryAt(result.config, g, memPhaseIdx);
    var region = +$('memRegion').value;
    var data = region === 0 ? mem.shared : mem.output;
    var hex = $('memFmt').value === 'hex';
    var off = Math.max(0, Math.min(+$('memOff').value || 0, Math.max(0, data.length - 1)));
    // 本阶段提交写入的地址(高亮)
    var hl = {};
    if (cur.committed) {
      var ca = cur.ph.commits[region].addr;
      for (var j = 0; j < ca.length; j++) hl[ca[j]] = true;
    }
    var tb = $('memTable').querySelector('tbody');
    tb.innerHTML = '';
    if (data.length === 0) {
      tb.innerHTML = '<tr><td colspan="8" class="muted">该区大小为 0</td></tr>';
      return;
    }
    var perRow = 4, shown = 0;
    for (var row = 0; row < MEM_ROWS && off + row * perRow < data.length; row++) {
      var tr = document.createElement('tr');
      var h = '';
      for (var c = 0; c < perRow; c++) {
        var a = off + row * perRow + c;
        if (a >= data.length) { h += '<td></td><td></td>'; continue; }
        var v = data[a];
        var txt = hex ? '0x' + ('0000000' + (v >>> 0).toString(16)).slice(-8) : String(v);
        h += '<td' + (hl[a] ? ' class="hl"' : '') + '>' + a + '</td><td' + (hl[a] ? ' class="hl"' : '') + '>' + txt + '</td>';
        shown++;
      }
      tr.innerHTML = h;
      tb.appendChild(tr);
    }
  }

  // ---------- 事件 ----------

  $('groupIdx').addEventListener('change', function () {
    var v = Math.floor(+$('groupIdx').value);
    if (!isFinite(v)) v = 0;
    curGroup = Math.max(0, Math.min(v, result.groups.length - 1));
    $('groupIdx').value = curGroup;
    curPhase = 0;
    renderGroup();
  });
  $('grpPrev').addEventListener('click', function () { if (curGroup > 0) { curGroup--; $('groupIdx').value = curGroup; curPhase = 0; renderGroup(); } });
  $('grpNext').addEventListener('click', function () { if (curGroup < result.groups.length - 1) { curGroup++; $('groupIdx').value = curGroup; curPhase = 0; renderGroup(); } });
  $('phaseSel').addEventListener('change', function () { curPhase = +$('phaseSel').value; renderPhase(); });
  ['memRegion', 'memFmt'].forEach(function (id) { $(id).addEventListener('change', renderMemory); });
  $('memOff').addEventListener('change', renderMemory);

  function download(name, obj) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function groupOutput(g) {
    return {
      group: g.index,
      completed: g.completed,
      phases: g.phases.length,
      outputWords: result.config.outputWords,
      output: Array.from(g.output),
      sharedWords: result.config.sharedWords,
      shared: Array.from(g.shared)
    };
  }

  $('dlGroup').addEventListener('click', function () {
    if (!result) return;
    download('group-' + curGroup + '-output.json', groupOutput(groupResult()));
  });
  $('dlAll').addEventListener('click', function () {
    if (!result) return;
    download('all-groups-output.json', result.groups.map(groupOutput));
  });
})();
</script>
</body>
</html>
