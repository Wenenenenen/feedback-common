<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ogg Opus 无重编码裁切台</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --panel2:#1b222c; --line:#28313d; --line2:#36414f;
    --fg:#e8edf3; --dim:#9aa7b6; --faint:#66727f;
    --accent:#4c9be8; --accent2:#2b6fb5;
    --ok:#3fb984; --warn:#e0a13c; --bad:#e05b52; --info:#8a7fe8;
    --mono:"JetBrains Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  input{font:inherit}
  ::selection{background:#2f5f92;color:#fff}

  header{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  header h1{font-size:15px;margin:0 10px 0 0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  header h1 .sub{color:var(--faint);font-weight:400;font-size:12px;margin-left:6px}
  .spacer{flex:1}
  .btn{
    background:var(--panel2);border:1px solid var(--line2);border-radius:7px;
    padding:5px 11px;font-size:12.5px;transition:.12s;
  }
  .btn:hover{background:#232c38;border-color:#45515f}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--accent2);border-color:#3a7fc4}
  .btn.primary:hover{background:#3479c2}
  .btn.ghost{background:transparent}
  .filebtn{position:relative;overflow:hidden}
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

  .pill{
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;
    padding:3px 10px;font-size:12px;border:1px solid var(--line2);color:var(--dim);
    white-space:nowrap;
  }
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .pill.ok{border-color:#265c44;color:#8fd9b8;background:#123024}
  .pill.ok .dot{background:var(--ok)}
  .pill.warn{border-color:#6a5222;color:#ecc27f;background:#2e2410}
  .pill.warn .dot{background:var(--warn)}
  .pill.bad{border-color:#6e312d;color:#f0a09a;background:#351715}
  .pill.bad .dot{background:var(--bad)}

  main{padding:14px 16px 40px;max-width:1500px;margin:0 auto}
  .drop{
    border:1.5px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;
    background:linear-gradient(180deg,#141a21,#12161c);color:var(--dim);transition:.15s;
  }
  .drop.drag{border-color:var(--accent);background:#132030;color:var(--fg)}
  .drop b{color:var(--fg)}
  .drop .hint{font-size:12px;color:var(--faint);margin-top:6px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .card .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
  .card .v{font:600 19px/1.3 var(--mono);margin-top:3px}
  .card .v small{font-size:11px;color:var(--dim);font-weight:400;margin-left:4px}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 0;flex-wrap:wrap}
  .tab{
    background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
    padding:8px 14px;font-size:13px;margin-bottom:-1px;border-radius:6px 6px 0 0;
  }
  .tab:hover{color:var(--fg);background:#1a212a}
  .tab.active{color:var(--fg);border-bottom-color:var(--accent)}
  .tab .badge{font-size:10.5px;color:var(--faint);margin-left:5px}
  .pane{display:none;padding-top:14px}
  .pane.active{display:block}

  table.grid{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
  table.grid th{
    position:sticky;top:0;background:var(--panel2);color:var(--dim);text-align:right;
    font-weight:500;padding:7px 9px;border-bottom:1px solid var(--line2);
    font-family:var(--sans);font-size:11.5px;white-space:nowrap;z-index:2;
  }
  table.grid th:first-child,table.grid td:first-child{text-align:left}
  table.grid td{padding:5px 9px;border-bottom:1px solid #1e2530;text-align:right;white-space:nowrap}
  table.grid tbody tr:hover{background:#1a212b}
  table.grid td.l{text-align:left}
  .tw{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .grow{color:var(--ok)} .gclamp{color:var(--warn)} .gbad{color:var(--bad)}

  .tag{display:inline-block;font-family:var(--sans);font-size:10.5px;padding:1px 6px;border-radius:4px;
    background:#202a36;color:var(--dim);border:1px solid #2b3644;white-space:nowrap}
  .tag.eos{color:#e6a;border-color:#5a2e46;background:#2b1620}
  .tag.bos{color:#8cf;border-color:#2e4a63;background:#14222e}
  .tag.cont{color:#ea6;border-color:#5a462a;background:#2a2113}

  .empty{color:var(--faint);padding:26px;text-align:center;font-family:var(--sans)}
  .pager{gap:10px;margin-top:10px;align-items:center}
  .pager .btn{padding:3px 10px}
  .mono{font-family:var(--mono)}
  .dim{color:var(--dim)} .faint{color:var(--faint)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}

  .locrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .fl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
  input[type=text],input[type=number],select{
    background:#0e1319;color:var(--fg);border:1px solid var(--line2);border-radius:7px;
    padding:5px 9px;font-family:var(--mono);font-size:12.5px;
  }
  input[type=text]{width:170px}
  input[type=number]{width:130px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}

  .locout{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:12.5px}
  .kv .k{color:var(--dim)}
  .kv .v{font-family:var(--mono)}

  .planbox{display:flex;flex-direction:column;gap:12px}
  .planhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .note{font-size:12.5px;color:var(--dim);background:#141a21;border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;line-height:1.6}
  .note code{font-family:var(--mono);color:#bcd}

  .diag{display:flex;flex-direction:column;gap:6px}
  .diagitem{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:6px 10px;
    border-radius:7px;background:var(--panel);border:1px solid var(--line);border-left-width:3px}
  .diagitem.bad{border-left-color:var(--bad)} .diagitem.warn{border-left-color:var(--warn)}
  .diagitem.info{border-left-color:var(--info)} .diagitem.ok{border-left-color:var(--ok)}
  .diagitem .off{font-family:var(--mono);color:var(--dim);white-space:nowrap}
  .diagitem .msg{flex:1}

  .progress{position:fixed;inset:0;background:#0b0e12cc;display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
  .progress.show{display:flex}
  .progress .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:22px 30px;text-align:center;min-width:280px}
  .bar{height:5px;background:#0e1319;border-radius:3px;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s}

  .sec-title{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px}
  details.raw{margin-top:10px}
  details.raw summary{cursor:pointer;color:var(--dim);font-size:12.5px}
  details.raw pre{background:#0e1319;border:1px solid var(--line);border-radius:8px;padding:10px;
    overflow:auto;max-height:300px;font-family:var(--mono);font-size:11.5px;color:#b7c3d0}
  .chaincard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .chaincard.bad{border-color:#5a2b28}
  .chaincard h3{margin:0 0 8px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11.5px;background:#131922;border:1px solid var(--line);
    border-radius:6px;padding:2px 8px;color:var(--dim)}
  .chip b{color:var(--fg);font-weight:600}
  .axisbar{height:20px;border-radius:5px;background:#0e1319;border:1px solid var(--line);
    position:relative;overflow:hidden;margin-top:8px}
  .axisbar .seg{position:absolute;top:0;bottom:0;border-right:1px solid #0b0e12}
  .axisbar .seg span{position:absolute;left:6px;top:2px;font-family:var(--mono);font-size:10px;color:#0b0e12cc;font-weight:600}
  .axisbar .play{position:absolute;top:0;bottom:0;background:#3fb98433;border-left:1px solid #3fb984;border-right:1px solid #3fb984}
  .axisbar .sel{position:absolute;top:0;bottom:0;background:#4c9be855;border-left:1.5px solid #4c9be8;border-right:1.5px solid #4c9be8}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <h1>Ogg Opus 无重编码裁切台<span class="sub">容器 / 成帧自读·自写</span></h1>
  <label class="btn filebtn primary">导入 Ogg Opus<input type="file" id="file" accept=".opus,.ogg,.oga,audio/ogg,application/ogg"></label>
  <button class="btn" id="demoBtn">载入样例</button>
  <button class="btn" id="demoMultiBtn">载入多链样例</button>
  <div class="spacer"></div>
  <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">等待导入</span></span>
</header>

<main>
  <div class="drop" id="drop">
    <div>把 Ogg Opus 文件拖到这里，或点上方 <b>导入</b>。可用 <b>载入样例</b> 先看效果。</div>
    <div class="hint" id="dropHint">最大 512 MiB · 最多 400 万页 · 顺序连接的多条逻辑流（序列号互异）</div>
  </div>

  <div class="cards" id="cards" hidden>
    <div class="card"><div class="k">逻辑流</div><div class="v" id="cChains">—</div></div>
    <div class="card"><div class="k">可播总长</div><div class="v" id="cPlay">—</div></div>
    <div class="card"><div class="k">音频包</div><div class="v" id="cPackets">—</div></div>
    <div class="card"><div class="k">页</div><div class="v" id="cPages">—</div></div>
    <div class="card"><div class="k">文件大小</div><div class="v" id="cBytes">—</div></div>
    <div class="card"><div class="k">解析耗时</div><div class="v" id="cMs">—</div></div>
  </div>

  <div id="work" hidden>
    <div class="tabs" id="tabs">
      <button class="tab active" data-pane="chains">链<span class="badge" id="bChains"></span></button>
      <button class="tab" data-pane="pages">页索引<span class="badge" id="bPages"></span></button>
      <button class="tab" data-pane="packets">包索引<span class="badge" id="bPackets"></span></button>
      <button class="tab" data-pane="locate">定位</button>
      <button class="tab" data-pane="cut">剪选导出</button>
      <button class="tab" data-pane="diag">诊断<span class="badge" id="bDiag"></span></button>
    </div>

    <section class="pane active" id="pane-chains">
      <div class="planbox"><div id="chainList"></div></div>
    </section>

    <section class="pane" id="pane-pages">
      <div id="pageFilter" class="locrow"></div>
      <div class="tw" id="pageWrap"><table class="grid" id="pageTable"></table></div>
      <div class="locrow pager" id="pagePager"></div>
    </section>

    <section class="pane" id="pane-packets">
      <div id="packetFilter" class="locrow"></div>
      <div class="tw" id="packetWrap"><table class="grid" id="packetTable"></table></div>
      <div class="locrow pager" id="packetPager"></div>
    </section>

    <section class="pane" id="pane-locate">
      <div class="locrow">
        <label class="fl">按样本(48k)<input type="number" id="locSample" min="0" step="1" placeholder="0"></label>
        <button class="btn" id="locGo">定位</button>
        <span class="faint" id="locRange"></span>
      </div>
      <div class="locout" id="locOut"><div class="empty">输入 48 kHz 样本位置，查看落在哪条链、哪一页、哪个包。</div></div>
    </section>

    <section class="pane" id="pane-cut">
      <div class="planbox">
        <div class="locrow">
          <label class="fl">起点 S<input type="number" id="cutS" min="0" step="1" value="0"></label>
          <label class="fl">终点 T<input type="number" id="cutT" min="0" step="1" value="0"></label>
          <span class="fl faint">半开区间 [S, T) · 单位 48 kHz 样本</span>
          <div class="spacer"></div>
          <button class="btn" id="cutAll">全选</button>
          <button class="btn" id="cutGo">计算</button>
          <button class="btn primary" id="cutDl" disabled>下载 Ogg</button>
        </div>
        <div class="note" id="cutNote"></div>
        <div id="cutPlans"></div>
      </div>
    </section>

    <section class="pane" id="pane-diag">
      <div class="diag" id="diagList"></div>
    </section>
  </div>
</main>

<div class="progress" id="prog"><div class="box"><div id="progText">读取…</div><div class="bar"><i id="progBar"></i></div></div></div>

<script src="opus-core.js"></script>
<script src="app.js"></script>
</body>
</html>
