<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸格合边复核台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M3 9h7M10 9v12M10 15h11M15 3v6" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="titles">
        <h1>纸格合边复核台</h1>
        <p>逐边代价 · 全表最优矩形铺排 · 锁定与反证</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="btn file-btn" title="导入 zip 或选择样本文件夹（scan.pgm / mask.pgm / grid.json）">
        <input id="fileInput" type="file" accept=".zip,.pgm,.json,application/zip" multiple hidden>
        导入样本
      </label>
      <label class="btn ghost file-btn" title="选择包含样本文件的文件夹">
        <input id="dirInput" type="file" webkitdirectory directory multiple hidden>
        选择文件夹
      </label>
      <button id="btnSample" class="btn ghost" type="button">载入内置示例</button>
      <button id="btnFull" class="btn ghost" type="button" title="生成 24 行 8 列的满额表并计时求解">满额演示</button>
      <button id="btnTheme" class="btn icon-btn" type="button" aria-label="切换深浅色" title="切换深浅色">◐</button>
    </div>
  </header>

  <div id="caseBar" class="case-bar" hidden>
    <span class="case-bar-label">样本</span>
    <div id="caseTabs" class="case-tabs" role="tablist"></div>
  </div>

  <main class="workspace">
    <section class="stage-panel" aria-label="图像与识别边">
      <div class="stage-toolbar">
        <div class="overlay-toggles" role="group" aria-label="叠加层">
          <label class="chk"><input id="ovEdges" type="checkbox" checked> 识别边</label>
          <label class="chk"><input id="ovRects" type="checkbox" checked> 矩形</label>
          <label class="chk"><input id="ovGuides" type="checkbox" checked> 格线</label>
          <label class="chk"><input id="ovMask" type="checkbox"> 掩膜</label>
          <label class="chk"><input id="ovIndex" type="checkbox"> 索引</label>
        </div>
        <div class="stage-tools">
          <button id="btnFit" class="btn ghost small" type="button">适应窗口</button>
          <span id="zoomLabel" class="dim mono">100%</span>
        </div>
      </div>
      <div id="stage" class="stage">
        <canvas id="canvas"></canvas>
        <div id="stageEmpty" class="stage-empty">
          <p>导入 <code>scan.pgm</code>、可选的 <code>mask.pgm</code> 与 <code>grid.json</code>，或载入内置示例。</p>
        </div>
        <div id="hoverTip" class="hover-tip" hidden></div>
      </div>
      <div class="legend">
        <span class="legend-item"><i class="swatch keep"></i>保留（矩形分界）</span>
        <span class="legend-item"><i class="swatch remove"></i>去掉（矩形内部）</span>
        <span class="legend-item"><i class="swatch rect"></i>识别矩形</span>
        <span class="legend-item"><i class="swatch lock"></i>已锁定</span>
        <span class="legend-spacer"></span>
        <span class="dim">滚轮缩放 · 拖动平移 · 点边查看</span>
      </div>
    </section>

    <aside class="inspector" aria-label="复核面板">
      <div id="conflictBanner" class="banner danger" hidden></div>

      <section class="card case-card">
        <h2>样本概览</h2>
        <dl class="kv">
          <dt>名称</dt><dd id="infoName">—</dd>
          <dt>图像</dt><dd id="infoImage">—</dd>
          <dt>基础网格</dt><dd id="infoGrid">—</dd>
          <dt>掩膜</dt><dd id="infoMask">—</dd>
          <dt>内部短边</dt><dd id="infoEdges">—</dd>
        </dl>
      </section>

      <section class="card result-card">
        <h2>全表最优</h2>
        <div class="result-head">
          <div class="metric">
            <span class="metric-label">总损失</span>
            <span id="resLoss" class="metric-value">—</span>
          </div>
          <div class="metric">
            <span class="metric-label">矩形数</span>
            <span id="resCount" class="metric-value">—</span>
          </div>
          <div class="metric">
            <span class="metric-label">求解耗时</span>
            <span id="resTime" class="metric-value small">—</span>
          </div>
        </div>
        <p id="resNote" class="result-note"></p>
        <div class="export-row">
          <button id="btnExport" class="btn primary" type="button" disabled>导出 JSON</button>
          <button id="btnCopy" class="btn ghost" type="button" disabled>复制</button>
        </div>
        <p id="exportNote" class="hint"></p>
      </section>

      <section class="card edge-card">
        <h2>短边详情</h2>
        <div id="edgeEmpty" class="empty-note">在图上或下表点击一条内部短边。</div>
        <div id="edgeDetail" hidden>
          <div class="edge-head">
            <span id="edgeId" class="edge-id mono"></span>
            <span id="edgeDecision" class="pill"></span>
          </div>
          <dl class="kv tight">
            <dt>样本像素</dt><dd id="edgeSamples">—</dd>
            <dt>保留损失</dt><dd id="edgeKeep" class="num keep-text">—</dd>
            <dt>去掉损失</dt><dd id="edgeRemove" class="num remove-text">—</dd>
            <dt>锁定</dt><dd id="edgeLock">—</dd>
          </dl>
          <div class="lock-row">
            <button id="lockKeep" class="btn ghost small" type="button">锁定保留</button>
            <button id="lockRemove" class="btn ghost small" type="button">锁定去掉</button>
            <button id="lockClear" class="btn ghost small" type="button">解除锁定</button>
          </div>
          <div class="force-box">
            <div class="force-title">若强制相反决定</div>
            <div id="forceResult" class="force-result">—</div>
          </div>
        </div>
      </section>

      <section class="card table-card">
        <h2>逐边一览 <span id="edgeCount" class="dim"></span></h2>
        <div class="table-wrap">
          <table class="edge-table">
            <thead>
              <tr><th>短边</th><th class="num">保留</th><th class="num">去掉</th><th>决定</th><th>锁</th></tr>
            </thead>
            <tbody id="edgeBody"></tbody>
          </table>
        </div>
      </section>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="statusPill" class="pill">就绪</span>
    <span id="statusText" class="status-text">等待导入样本</span>
    <span class="status-spacer"></span>
    <span id="solverBadge" class="mono dim">自研轮廓 DP</span>
  </footer>
</div>

<script src="src/solver.js"></script>
<script src="src/core.js"></script>
<script src="src/sample-data.js"></script>
<script src="src/app.js"></script>
</body>
</html>
