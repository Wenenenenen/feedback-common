<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磷光扫描拍屏预览</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2c313a;
    --fg: #d7dbe0; --dim: #8b929c; --accent: #5fd0a5; --warn: #e0a458;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #timing { color: var(--accent); }
  #timing.over { color: var(--warn); }
  main { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; align-items: flex-start; }
  .stage { flex: 1 1 520px; min-width: 320px; }
  aside { flex: 0 1 420px; min-width: 300px; display: flex; flex-direction: column; gap: 12px; }
  canvas#view {
    width: 100%; max-width: 768px; image-rendering: pixelated;
    background: #000; border: 1px solid var(--line); cursor: crosshair; display: block;
  }
  fieldset { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); margin: 0; }
  legend { color: var(--dim); padding: 0 6px; }
  label { display: block; margin: 6px 0; }
  input[type=number] {
    width: 160px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit;
  }
  textarea {
    width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 6px;
  }
  button {
    background: #2a3038; color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 12px; margin: 4px 4px 4px 0; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  #err { color: #e06c75; white-space: pre-wrap; margin-top: 4px; }
  #meta, .hint { color: var(--dim); font-size: 12px; margin-top: 4px; }
  table { border-collapse: collapse; margin: 6px 0; font-size: 12px; width: 100%; }
  th, td { border: 1px solid var(--line); padding: 2px 8px; text-align: right; }
  th { color: var(--dim); font-weight: normal; }
  td.l, th.l { text-align: left; }
  #pixInfo { margin-top: 10px; max-width: 768px; overflow-x: auto; }
  #pixInfo h2 { font-size: 13px; margin: 8px 0 4px; color: var(--accent); font-weight: 600; }
  .row { margin: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>磷光扫描拍屏预览</h1>
  <span id="timing"></span>
  <span id="mean" class="hint"></span>
</header>
<main>
  <section class="stage">
    <canvas id="view"></canvas>
    <div class="hint">点击画面查看该像素的锁页时刻与积分分段。扫描时刻保留分数；同刻换页先于扫描、同刻多条取文件最后一条；一行只用自己的扫描时刻锁页。</div>
    <div class="row">
      <button id="dlPng">下载 PNG</button>
      <button id="dlRec">下载该像素记录 (JSON)</button>
    </div>
    <div id="pixInfo"></div>
  </section>
  <aside>
    <fieldset>
      <legend>数据（samples/phosphor-scanout.json 格式）</legend>
      <input type="file" id="file" accept=".json,application/json">
      <div class="row">
        <button id="btnSample">载入内置样例</button>
        <button id="btnFull">生成满额测试</button>
      </div>
      <div id="meta"></div>
    </fieldset>
    <fieldset>
      <legend>相机（整数微秒）</legend>
      <label>起点 start <input id="camStart" type="number" step="1" min="0"></label>
      <label>曝光长度 duration（&gt;0） <input id="camDur" type="number" step="1" min="1"></label>
      <label>行偏移 rowDelay（≥0） <input id="camRow" type="number" step="1" min="0"></label>
    </fieldset>
    <fieldset>
      <legend>换页 switches — [[t微秒, 页], …]</legend>
      <textarea id="swText" rows="8" spellcheck="false"></textarea>
      <div class="row"><button id="apply">应用并重算</button></div>
      <div id="err"></div>
    </fieldset>
  </aside>
</main>
<script src="engine.js"></script>
<script>
'use strict';
const SAMPLE = {"format":"pages为行优先u8灰度数组，switches为[t微秒,page索引]按时间排序，同刻保留文件次序。j从0起，行y扫描时刻为P*(j+y/H)；只需处理j至10亿的查询。P、tau为正整数微秒，P至1000000、tau至1000000000。换页、相机起点、曝光长度和非负行偏移均为整数微秒，曝光长大于0。首扫前驱动和发光为0，G=锁定页像素/255。恒定驱动长度s内，初值L到G+(L-G)*exp(-s/tau)，积分G*s+(L-G)*tau*(1-exp(-s/tau))。相机行y积分窗为[start+y*rowDelay,start+y*rowDelay+duration)，除以duration再乘255四舍五入为PNG值，平均亮度对照容差1e-7。像素记录给出相关锁页时间、驱动、各积分段和平均值，可省略曝光之前的重复扫描但保留曝光起点亮度。满额测试：256×144，32页颜色分别为0、1直到30及255，P=997、tau=2000，把20000个换页依次放在t=1009*i，页为i%32，i从0起，曝光从997乘10亿开始，长度100，行偏移1。","size":[2,2],"P":8,"tau":3,"pages":[[0,0,0,0],[255,51,51,255]],"switches":[[0,0],[3,1]],"camera":{"start":4,"duration":12,"rowDelay":1}};

const $ = (id) => document.getElementById(id);
const view = $('view'), ctx = view.getContext('2d');
const clean = document.createElement('canvas'), cleanCtx = clean.getContext('2d');
const state = { raw: null, model: null, cam: null, img: null, sel: { x: 0, y: 0 }, rec: null };

const fmt = (v) => Number.isInteger(v) ? String(v) : String(parseFloat(v.toPrecision(9)));

function parseSwitches(text) {
  text = text.trim();
  if (!text) return [];
  try {
    const v = JSON.parse(text);
    if (Array.isArray(v)) return v;
  } catch (e) { /* 尝试逐行解析 */ }
  const out = [];
  for (const line of text.split('\n')) {
    const s = line.trim();
    if (!s) continue;
    const m = s.match(/^\[?\s*(-?\d+)\s*[,\s]\s*(\d+)\s*\]?$/);
    if (!m) throw new Error('换页行无法解析: ' + s);
    out.push([Number(m[1]), Number(m[2])]);
  }
  return out;
}

function readCamera() {
  const start = Number($('camStart').value);
  const duration = Number($('camDur').value);
  const rowDelay = Number($('camRow').value);
  if (!Number.isInteger(start) || start < 0) throw new Error('相机起点须为非负整数微秒');
  if (!Number.isInteger(duration) || duration <= 0) throw new Error('曝光长度须为正整数微秒');
  if (!Number.isInteger(rowDelay) || rowDelay < 0) throw new Error('行偏移须为非负整数微秒');
  return { start, duration, rowDelay };
}

function setData(data) {
  const model = PhosphorEngine.makeModel(data); // 先校验
  state.raw = data;
  state.model = model;
  $('swText').value = JSON.stringify(data.switches || []);
  const cam = data.camera || { start: 0, duration: Math.max(1, data.P | 0), rowDelay: 0 };
  $('camStart').value = cam.start;
  $('camDur').value = cam.duration;
  $('camRow').value = cam.rowDelay;
  $('meta').textContent =
    `${model.W}×${model.H}，${model.pages.length} 页，${(data.switches || []).length} 条换页，` +
    `P=${fmt(model.P)} µs，tau=${fmt(model.tau)} µs`;
  $('err').textContent = '';
  recompute();
}

function recompute() {
  $('err').textContent = '';
  try {
    const cam = readCamera();
    const switches = parseSwitches($('swText').value);
    const model = PhosphorEngine.makeModel({
      size: [state.model.W, state.model.H],
      P: state.model.P, tau: state.model.tau,
      pages: state.raw.pages, switches,
    });
    const t0 = performance.now();
    const img = PhosphorEngine.render(model, cam);
    const ms = performance.now() - t0;
    state.model = model; state.cam = cam; state.img = img;
    const el = $('timing');
    el.textContent = `重算 ${ms.toFixed(1)} ms`;
    el.className = ms > 5000 ? 'over' : '';
    let mean = 0;
    for (const v of img) mean += v;
    $('mean').textContent = `平均亮度 ${(mean / img.length).toFixed(6)}`;
    if (state.sel.x >= model.W || state.sel.y >= model.H) state.sel = { x: 0, y: 0 };
    draw();
    showPixel();
  } catch (e) {
    $('err').textContent = e.message || String(e);
  }
}

function draw() {
  const { W, H } = state.model;
  view.width = W; view.height = H;
  clean.width = W; clean.height = H;
  const im = ctx.createImageData(W, H);
  for (let i = 0; i < state.img.length; i++) {
    const v = state.img[i];
    im.data[4 * i] = v; im.data[4 * i + 1] = v; im.data[4 * i + 2] = v; im.data[4 * i + 3] = 255;
  }
  cleanCtx.putImageData(im, 0, 0);
  ctx.putImageData(im, 0, 0);
  const { x, y } = state.sel;
  ctx.strokeStyle = '#5fd0a5';
  ctx.lineWidth = Math.max(1, Math.min(W, H) / 144);
  ctx.strokeRect(x + 0.001, y + 0.001, 1, 1);
}

function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function showPixel() {
  const { x, y } = state.sel;
  const rec = PhosphorEngine.pixelRecord(state.model, state.cam, x, y);
  state.rec = rec;
  let h = `<h2>像素 (${x}, ${y}) — 曝光窗 [${fmt(rec.window[0])}, ${fmt(rec.window[1])}) µs</h2>`;
  h += `<div>曝光起点亮度 L₀ = ${fmt(rec.exposureStartLum)}　积分 = ${fmt(rec.integral)}　` +
       `平均 = ${fmt(rec.average)}　PNG = <b>${rec.pngValue}</b></div>`;
  h += '<h2>锁页</h2><table><tr><th class="l">扫描时刻 µs</th><th>页</th><th>驱动 G</th><th class="l">备注</th></tr>';
  for (const lk of rec.locks) {
    h += `<tr><td class="l">${fmt(lk.scanTime)}</td><td>${lk.page < 0 ? '—' : lk.page}</td>` +
         `<td>${fmt(lk.drive)}</td><td class="l">${lk.note ? esc(lk.note) : (lk.scans ? '同页连续 ' + lk.scans + ' 次扫描' : '')}</td></tr>`;
  }
  h += '</table><h2>积分分段</h2><table><tr><th class="l">起 µs</th><th class="l">止 µs</th>' +
       '<th>页</th><th>驱动 G</th><th>扫描数</th><th>L起</th><th>L止</th><th>积分</th></tr>';
  for (const sg of rec.segments) {
    h += `<tr><td class="l">${fmt(sg.start)}</td><td class="l">${fmt(sg.end)}</td>` +
         `<td>${sg.page < 0 ? '—' : sg.page}</td><td>${fmt(sg.drive)}</td><td>${sg.scans}</td>` +
         `<td>${fmt(sg.Lstart)}</td><td>${fmt(sg.Lend)}</td><td>${fmt(sg.integral)}</td></tr>`;
  }
  h += '</table>';
  $('pixInfo').innerHTML = h;
}

view.addEventListener('click', (e) => {
  if (!state.model) return;
  const r = view.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * state.model.W);
  const y = Math.floor((e.clientY - r.top) / r.height * state.model.H);
  if (x < 0 || y < 0 || x >= state.model.W || y >= state.model.H) return;
  state.sel = { x, y };
  draw();
  showPixel();
});

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

$('dlPng').addEventListener('click', () => {
  if (!state.img) return;
  clean.toBlob((b) => download(b, 'phosphor-scanout.png'), 'image/png');
});
$('dlRec').addEventListener('click', () => {
  if (!state.rec) return;
  const { x, y } = state.sel;
  download(new Blob([JSON.stringify(state.rec, null, 2)], { type: 'application/json' }),
    `pixel-${x}-${y}-record.json`);
});

$('apply').addEventListener('click', recompute);
for (const id of ['camStart', 'camDur', 'camRow']) $(id).addEventListener('change', recompute);

$('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { setData(JSON.parse(rd.result)); }
    catch (err) { $('err').textContent = '导入失败: ' + (err.message || err); }
  };
  rd.readAsText(f);
});

$('btnSample').addEventListener('click', () => setData(SAMPLE));

$('btnFull').addEventListener('click', () => {
  const W = 256, H = 144;
  setData({
    format: '满额测试：32页(0..30,255)，2万换页 t=1009*i 页i%32，跳到第10亿扫',
    size: [W, H], P: 997, tau: 2000,
    pages: Array.from({ length: 32 }, (_, i) => new Array(W * H).fill(i < 31 ? i : 255)),
    switches: Array.from({ length: 20000 }, (_, i) => [1009 * i, i % 32]),
    camera: { start: 997 * 1e9, duration: 100, rowDelay: 1 },
  });
});

setData(SAMPLE);
</script>
</body>
</html>
