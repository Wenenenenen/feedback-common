<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图集过滤实验室 · Atlas Filter Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>图集过滤实验室</h1>
  <span class="sub">sRGB → 线性 → 预乘 alpha 过滤 · 每级外扩 2px · 双线性 / 三线性预览</span>
</header>

<main>
  <aside id="controls">
    <section>
      <h2>导入</h2>
      <label class="file">图集 PNG（RGBA，≤2048×2048）
        <input type="file" id="pngInput" accept="image/png">
      </label>
      <label class="file">图集 JSON（name / x / y / w / h）
        <input type="file" id="jsonInput" accept="application/json,.json">
      </label>
      <div id="importStatus" class="status">尚未导入。</div>
      <ul id="errorList" class="errors"></ul>
    </section>

    <section>
      <h2>预览</h2>
      <div class="row">
        <label>过滤方式</label>
        <label class="inline"><input type="radio" name="mode" value="bilinear"> 双线性</label>
        <label class="inline"><input type="radio" name="mode" value="trilinear" checked> 三线性</label>
      </div>
      <div class="row">
        <label for="zoom">缩放 <span id="zoomLabel">100%</span></label>
        <input type="range" id="zoom" min="-4" max="2" step="0.01" value="0">
        <div class="hint">自动 LOD：<span id="autoLod">0.00</span></div>
      </div>
      <div class="row">
        <label class="inline"><input type="checkbox" id="manualLod"> 手动 LOD</label>
        <input type="number" id="lodValue" min="0" max="12" step="0.1" value="0" disabled>
      </div>
      <div class="row">
        <label>背景</label>
        <label class="inline"><input type="radio" name="bg" value="checker" checked> 棋盘</label>
        <label class="inline"><input type="radio" name="bg" value="solid"> 纯色</label>
        <input type="color" id="bgColor" value="#808080">
      </div>
    </section>

    <section>
      <h2>导出</h2>
      <button id="exportBtn" disabled>导出全部图标各级 PNG + JSON（ZIP）</button>
      <div class="hint">每级 PNG 含 2px 外扩边；manifest.json 记录内容矩形。</div>
    </section>

    <section>
      <h2>图标 <span id="spriteCount"></span></h2>
      <ul id="spriteList" class="sprites"></ul>
    </section>
  </aside>

  <section id="stage">
    <div id="canvasWrap">
      <canvas id="preview"></canvas>
    </div>
    <div id="inspect">
      <h2>像素检查 <span class="hint">（点击预览图）</span></h2>
      <div id="inspectBody" class="hint">尚未选择像素。</div>
    </div>
    <div id="chainView">
      <h2>当前图标 mip 链（含外扩边）</h2>
      <div id="chainBody" class="hint">尚未选择图标。</div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
