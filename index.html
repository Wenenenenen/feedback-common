<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>镀膜层序光谱台</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="header-text">
        <h1>镀膜层序光谱台</h1>
        <p class="subtitle">相干多层膜 · s/p 反射透射吸收 · 白光球面预览</p>
      </div>
      <div class="header-controls">
        <label class="case-picker">
          <span class="ctl-label">样例</span>
          <select id="caseSelect" aria-label="选择样例"></select>
        </label>
        <button type="button" id="exportJsonBtn" class="btn">导出光谱 JSON</button>
        <button type="button" id="exportPngBtn" class="btn btn-primary">导出预览 PNG</button>
      </div>
    </header>

    <main class="layout">
      <!-- left: stack editor -->
      <section class="panel editor-panel" aria-label="膜层编辑">
        <div class="panel-head">
          <h2>膜层结构</h2>
          <span id="layerCount" class="layer-count"></span>
        </div>

        <div class="medium-grid">
          <label class="medium-field">
            <span class="ctl-label">入射介质 n₀（无吸收）</span>
            <input id="n0Input" class="num" type="number" min="1" max="5" step="0.001" value="1" inputmode="decimal">
          </label>
          <label class="medium-field">
            <span class="ctl-label">基底 n<sub>s</sub>（无吸收）</span>
            <input id="nsInput" class="num" type="number" min="1" max="5" step="0.001" value="1.5" inputmode="decimal">
          </label>
        </div>

        <div class="table-scroll">
          <table class="layer-table">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">厚度 d (nm)</th>
                <th scope="col">n</th>
                <th scope="col">k</th>
                <th scope="col" class="col-actions">层序</th>
              </tr>
            </thead>
            <tbody id="layerBody"></tbody>
          </table>
        </div>
        <button type="button" id="addLayerBtn" class="btn btn-block">＋ 添加膜层（最多 16 层）</button>
        <p class="hint">范围：d 0–5000 nm · n 1–3.5 · k 0–2。层序自上而下为光进入方向。</p>
      </section>

      <!-- right: sphere + readouts -->
      <section class="panel sphere-panel" aria-label="球面预览">
        <div class="panel-head">
          <h2>白光正交球面</h2>
          <span class="hint-inline">点球面定位角度</span>
        </div>
        <div class="sphere-stage">
          <canvas id="sphereCanvas" class="sphere-canvas" width="320" height="320"
                  role="slider" aria-label="球面预览，点击或拖动选择入射角"
                  aria-valuemin="0" aria-valuemax="85" aria-valuenow="0"></canvas>
        </div>
        <div class="angle-control">
          <label for="angleSlider" class="ctl-label">入射角</label>
          <input id="angleSlider" type="range" min="0" max="85" step="0.1" value="0">
          <output id="angleReadout" class="angle-readout">0.0°</output>
        </div>
        <div class="readout-grid">
          <div class="rgb-block">
            <div id="rgbSwatch" class="rgb-swatch" aria-hidden="true"></div>
            <div>
              <div class="ctl-label">当前角度白光反射色</div>
              <div id="rgbReadout" class="rgb-readout"></div>
            </div>
          </div>
          <table class="stat-table">
            <thead>
              <tr><th scope="col">偏振</th><th scope="col">R</th><th scope="col">T</th><th scope="col">A</th></tr>
            </thead>
            <tbody id="statBody"></tbody>
          </table>
        </div>
      </section>

      <!-- bottom: charts -->
      <section class="panel chart-panel spec-panel" aria-label="光谱曲线">
        <div class="panel-head">
          <h2>能量曲线 · 光谱</h2>
          <div class="chart-controls">
            <div class="seg" role="group" aria-label="物理量">
              <label><input type="radio" name="quantity" value="R" checked><span>反射 R</span></label>
              <label><input type="radio" name="quantity" value="T"><span>透射 T</span></label>
              <label><input type="radio" name="quantity" value="A"><span>吸收 A</span></label>
            </div>
            <div class="role-checks" role="group" aria-label="偏振通道">
              <label><input type="checkbox" name="role" value="s"><span class="key key-s"></span>s</label>
              <label><input type="checkbox" name="role" value="p"><span class="key key-p"></span>p</label>
              <label><input type="checkbox" name="role" value="u" checked><span class="key key-u"></span>无偏振</label>
            </div>
          </div>
        </div>
        <div id="specChart" class="chart-host"></div>
      </section>

      <section class="panel chart-panel angle-panel" aria-label="角度曲线">
        <div class="panel-head">
          <h2>能量曲线 · 角度</h2>
          <span id="wlReadout" class="hint-inline">550 nm 切片</span>
        </div>
        <div id="angleChart" class="chart-host"></div>
      </section>
    </main>

    <footer class="app-footer">
      <span id="statusLine" class="status-line"></span>
      <span class="footer-note">散射矩阵（S-matrix）求解 · 全反射与厚吸收膜稳定 · 400–700 nm / 10 nm · 0–85°</span>
    </footer>
  </div>

  <script src="js/tmm.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/color.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/sphere.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
